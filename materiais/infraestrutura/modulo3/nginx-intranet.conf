# Copie/revise em sites-available/intranet somente na VM isolada.
# Desabilite o link do default para evitar a escuta ampla desse outro site.
server {
    listen 127.0.0.1:80;
    # Só adicione listen 192.168.10.20:80 após preparar UFW e o teste remoto.
    server_name intranet.escolahorizonte.example;
    root /var/www/intranet;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
