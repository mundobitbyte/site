# Acrescente SOMENTE esta seção após preservar smb.conf na VM.
# Requer: grupo secretaria; ana membro; ana e caio cadastrados no Samba.
# /srv/escola/documentos: dono root, grupo secretaria, modo 2770.
[Secretaria]
    path = /srv/escola/documentos
    browseable = yes
    guest ok = no
    read only = yes
    valid users = @secretaria
    write list = @secretaria
    create mask = 0660
    directory mask = 2770
