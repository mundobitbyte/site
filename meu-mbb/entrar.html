<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Meu MbB</title>
  <link rel="stylesheet" href="../css/home.css"><link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header><h1>Mundo bit Byte</h1><a class="mbb-header-link" href="../index.html">← Início</a></header>
  <main class="mbb-pagina mbb-curta">
    <h2>Entrar no Meu MbB</h2>
    <p>A conta é opcional. Todos os conteúdos públicos continuam acessíveis sem cadastro.</p>
    <div class="mbb-abas"><button type="button" data-aba="entrar" aria-pressed="true">Entrar</button><button type="button" data-aba="criar" aria-pressed="false">Criar conta</button></div>
    <form id="form-entrar" class="mbb-formulario">
      <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
      <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button><button type="button" id="recuperar" class="mbb-secundario">Esqueci minha senha</button>
    </form>
    <form id="form-criar" class="mbb-formulario" hidden>
      <label>Nome<input type="text" name="nome" minlength="2" maxlength="80" autocomplete="name" required></label>
      <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
      <label>Senha<input type="password" name="senha" minlength="6" autocomplete="new-password" required></label>
      <button type="submit">Criar conta</button>
    </form>
    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>
  <script src="firebase-config.js"></script><script src="conta.js"></script><script src="entrar.js"></script>
</body>
</html>
