name: Atualização temporária do índice de pesquisa

on:
  push:
    branches:
      - lapidacao-titulos-mbb
    paths:
      - '.github/workflows/tmp-atualizar-pesquisa-titulos.yml'

permissions:
  contents: write

jobs:
  atualizar-indice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lapidacao-titulos-mbb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Atualizar catálogo de pesquisa
        run: node meu-mbb/atualizar-pesquisa.cjs

      - name: Commitar índice atualizado
        run: |
          if git diff --quiet -- meu-mbb/catalogo.json; then
            echo "Índice já estava atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "Atualiza índice de pesquisa após lapidação de títulos"
          git push origin HEAD:lapidacao-titulos-mbb
