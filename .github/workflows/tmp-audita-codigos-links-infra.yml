name: tmp-audita-codigos-links-infra
on:
  push:
    branches:
      - lapidacao-infraestrutura-mbb
    paths:
      - .github/workflows/tmp-audita-codigos-links-infra.yml
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
      - name: Inventariar códigos pedagógicos potenciais
        shell: python
        run: |
          from pathlib import Path
          import re, collections
          txt='\n'.join(p.read_text(encoding='utf-8') for p in Path('js/infraestrutura').glob('*.js'))
          toks=collections.Counter(re.findall(r'(?<![A-Z0-9])([A-Z]{1,5}-\d{1,3}[A-Z]?)(?![A-Z0-9])',txt))
          print('TOKENS')
          for k,v in sorted(toks.items()): print(k,v)
      - name: Verificar links externos publicados
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          files=[Path('pages/infraestrutura.html'),*Path('js/infraestrutura').glob('*.js')]
          urls=[]
          for p in files:
              t=p.read_text(encoding='utf-8')
              urls += re.findall(r'href="(https?://[^"#]+)',t)
          for url in sorted(set(urls)):
              r=subprocess.run(['curl','-L','--max-time','15','-A','Mozilla/5.0','-sS','-o','/dev/null','-w','%{http_code}',url],capture_output=True,text=True)
              code=r.stdout.strip() or 'ERR'
              print(code,url)
