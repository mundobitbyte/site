name: Regenerar índices finais — Análise conversa iniciante

on:
  push:
    branches:
      - analise-sistemas-contexto-vivo-iniciante
    paths:
      - '.github/workflows/tmp-regenerar-indices-analise-conversa-final.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analise-sistemas-contexto-vivo-iniciante
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar índices oficiais
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs
      - name: Commitar somente arquivos gerados
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
          else
            git commit -m "Análise de Sistemas: regenerar índices finais da revisão conversacional"
            git push origin HEAD:analise-sistemas-contexto-vivo-iniciante
          fi
