name: Validação Web III Capítulo 1
on:
  pull_request:
    branches: [main]
    paths: ['pages/programacao-web/**', 'materiais/programacao-web/**', 'downloads/programacao-web/**', 'tests/web3/**', 'meu-mbb/catalogo.json', '.github/workflows/web3-capitulo1-validacao.yml']
  push:
    branches: [main, feat/web3-capitulo1-20261023]
    paths: ['pages/programacao-web/**', 'materiais/programacao-web/**', 'downloads/programacao-web/**', 'tests/web3/**', 'meu-mbb/catalogo.json', '.github/workflows/web3-capitulo1-validacao.yml']
permissions:
  contents: read
jobs:
  pratica-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar arquivos reais dos checkpoints e suíte herdada
        run: python3 tests/web3/verificar-pratica.py --composer
      - name: Reconstruir as duas aulas do Capítulo 1 pelos trechos ensinados
        run: python3 tests/web3/auditar-construcao-capitulo1.py
      - name: Validar conteúdo e preservação
        run: node --test tests/web3/conteudo.test.cjs
  meu-mbb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node meu-mbb/atualizar-pesquisa.cjs --check
      - run: node meu-mbb/gerar-visitas.cjs --check
      - run: node --test meu-mbb/*.test.cjs
      - run: npm install --no-save --no-package-lock firebase@12.19.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2
      - run: npx firebase emulators:exec --config firebase.meu-mbb.json --only firestore --project demo-mbb-meu "node --test meu-mbb/tests/firestore-rules.test.cjs tests/web3/registros.rules.test.cjs"
