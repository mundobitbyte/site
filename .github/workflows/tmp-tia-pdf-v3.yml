name: Temporary TIA final PDF and header fix

on:
  push:
    branches:
      - tmp-tia-pdf-v3-20260912
    paths:
      - '.tmp-tia-pdf-v3/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify uploaded PDF
        shell: bash
        run: |
          cat .tmp-tia-pdf-v3/chunk_* | base64 -d > /tmp/tia.pdf.xz
          xz -dc /tmp/tia.pdf.xz > /tmp/TIA_Material_de_Apoio_Versao_Anterior.pdf
          echo "2459e628b6cf68fbe26f042eaa1dcd2e3919a67fdc1e0c937944c4d7fb3c67db  /tmp/TIA_Material_de_Apoio_Versao_Anterior.pdf" | sha256sum -c -
          test "$(pdfinfo /tmp/TIA_Material_de_Apoio_Versao_Anterior.pdf | awk '/^Pages:/ {print $2}')" = "52"

      - name: Apply surgical changes on main
        shell: bash
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git checkout -B main origin/main

          mkdir -p assets/pdf
          cp /tmp/TIA_Material_de_Apoio_Versao_Anterior.pdf assets/pdf/TIA_Material_de_Apoio_Versao_Anterior.pdf

          python - <<'PY'
          from pathlib import Path

          html_path = Path('pages/tia.html')
          html = html_path.read_text(encoding='utf-8')
          old = '    <a class="portal-link" href="../index.html">← Mundo bit Byte</a>\n    <h1>TI em Administração</h1>'
          new = '    <a class="portal-link" href="../index.html">← Mundo bit Byte</a>\n    <a class="portal-link tia-pdf-header" href="../assets/pdf/TIA_Material_de_Apoio_Versao_Anterior.pdf" download="TIA_Material_de_Apoio_Versao_Anterior.pdf" aria-label="Baixar PDF de apoio da versão anterior do módulo TIA" title="Material complementar para revisão, estudo em casa e atividades">PDF de apoio</a>\n    <h1>TI em Administração</h1>'
          if new not in html:
              if old not in html:
                  raise SystemExit('Cabeçalho esperado não encontrado em pages/tia.html')
              html = html.replace(old, new, 1)
          html_path.write_text(html, encoding='utf-8')

          js_path = Path('js/tia.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.find('  const headerLeft=document.querySelector(".header-left");')
          end_marker = '  scroller.addEventListener("scroll",setActive,{passive:true});'
          end = js.find(end_marker)
          if start != -1 and end != -1 and end > start:
              js = js[:start] + js[end:]
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('css/tia.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Botão fixo de PDF no cabeçalho TIA */'
          if marker not in css:
              css += '''\n\n/* Botão fixo de PDF no cabeçalho TIA */\n.tia-pdf-header{background:rgba(255,255,255,.2)!important;border-color:rgba(255,255,255,.7)!important;}\n.tia-pdf-header:hover,.tia-pdf-header:focus{background:rgba(255,255,255,.32)!important;}\n@media(max-width:720px){\n  .header-left{gap:6px!important;}\n  .tia-pdf-header{font-size:11px!important;padding:5px 7px!important;}\n  .topbar h1{min-width:0!important;}\n}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY

          git add assets/pdf/TIA_Material_de_Apoio_Versao_Anterior.pdf pages/tia.html js/tia.js css/tia.css
          git commit -m "Substitui PDF TIA e fixa botão no cabeçalho" || true
          git push origin HEAD:main

      - name: Remove temporary upload branch
        if: success()
        shell: bash
        run: git push origin --delete tmp-tia-pdf-v3-20260912 || true
