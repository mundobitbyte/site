name: SEIoT10 - sincronizar indice com escopo controlado
on:
  push:
    branches: [audit/seiot10-projeto-integrador-20261118]
    paths: ['.github/workflows/seiot10-indice-temporario.yml']
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seiot10-projeto-integrador-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regenerar busca e proteger demais unidades
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const path='meu-mbb/catalogo.json';
          const before=JSON.parse(fs.readFileSync(path,'utf8'));
          execFileSync('node',['meu-mbb/atualizar-pesquisa.cjs'],{stdio:'inherit'});
          const after=JSON.parse(fs.readFileSync(path,'utf8'));
          if(before.unidades.length!==after.unidades.length)throw Error('Quantidade de unidades alterada');
          const changed=[];
          for(let i=0;i<before.unidades.length;i++){
            const a=before.unidades[i],b=after.unidades[i];
            if(JSON.stringify(a)!==JSON.stringify(b)){
              if(a.localizacao_atual!==b.localizacao_atual)throw Error('Destino da unidade alterado');
              const keys=new Set([...Object.keys(a),...Object.keys(b)]);
              for(const key of keys)if(!['texto_busca','topicos_busca'].includes(key)&&JSON.stringify(a[key])!==JSON.stringify(b[key]))throw Error('Metadado protegido alterado: '+key);
              changed.push(a.localizacao_atual);
            }
          }
          if(changed.length!==1||changed[0]!=='pages/arduino-projeto-iot.html')throw Error('Unidade de pesquisa fora do escopo: '+JSON.stringify(changed));
          console.log('OK: somente campos de busca do projeto final atualizados.');
          NODE
          node meu-mbb/atualizar-pesquisa.cjs --check
          test "$(git diff --name-only)" = "meu-mbb/catalogo.json"
      - name: Registrar na branch controlada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "chore(seiot10): sincronizar indice do projeto integrador"
          git push origin HEAD:audit/seiot10-projeto-integrador-20261118
