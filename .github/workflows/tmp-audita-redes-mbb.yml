name: tmp-audita-redes-mbb

on:
  push:
    branches: [lapidacao-infraestrutura-mbb]

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
      - name: Mapear taxonomia e bastidores
        shell: python
        run: |
          from pathlib import Path
          import re
          files=[Path('js/infraestrutura/redes-00-03.js'),Path('js/infraestrutura/redes-04-07.js'),Path('js/infraestrutura/redes-08-10.js'),Path('js/infraestrutura/redes-99.js')]
          for p in files:
              text=p.read_text(encoding='utf-8')
              print(f'\n### {p}')
              print('aulas=',text.count('window.infraestruturaNetworkLessons.push({'),'record-box=',text.count('record-box'))
              for m in re.finditer(r'(?i).{0,85}(?:R-0\d|módulo|capítulo).{0,150}', text):
                  s=' '.join(m.group(0).split())
                  print(s)
