name: Lapidação temporária de títulos genéricos

on:
  push:
    branches:
      - lapidacao-titulos-mbb
    paths:
      - '.github/workflows/tmp-lapidacao-titulos-site.yml'

permissions:
  contents: write

jobs:
  lapidar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lapidacao-titulos-mbb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tornar títulos autossuficientes
        shell: python
        run: |
          from pathlib import Path

          qts = {
            '00-sera-que-esta-pronto.html': 'A seguir: o que significa qualidade?',
            '01-o-que-significa-qualidade.html': 'A seguir: erro, defeito, falha e teste',
            '02-erro-defeito-falha-teste.html': 'A seguir: o que deveria acontecer?',
            '03-o-que-deveria-acontecer.html': 'A seguir: encontrar problemas antes de executar',
            '04-antes-de-executar.html': 'A seguir: escolher bons valores de teste',
            '05-bons-valores-de-teste.html': 'A seguir: testar regras com várias condições',
            '06-regras-mais-complicadas.html': 'A seguir: níveis e tipos de teste',
            '07-o-que-estamos-testando.html': 'A seguir: decidir o que testar primeiro',
            '08-nao-da-para-testar-tudo.html': 'A seguir: planejar e documentar os testes',
            '09-planejar-e-documentar.html': 'A seguir: registrar e tratar um defeito',
            '10-encontramos-um-defeito.html': 'A seguir: automatizar verificações repetitivas',
            '11-automatizando-repeticoes.html': 'A seguir: escrever o teste antes do código',
            '12-teste-antes-do-codigo.html': 'A seguir: testar interface, servidor e banco juntos',
            '13-interface-servidor-banco.html': 'A seguir: testar o fluxo completo como o usuário',
            '14-como-o-usuario.html': 'A seguir: executar testes automaticamente a cada mudança',
            '15-testes-executando-sozinhos.html': 'A seguir: decidir se a versão está pronta para entrega',
          }

          trocas = 0
          for nome, titulo in qts.items():
            p = Path('pages/qts') / nome
            texto = p.read_text(encoding='utf-8')
            antigo = '<h3>Próxima etapa</h3>'
            if antigo not in texto:
              raise SystemExit(f'Título esperado não encontrado em {p}')
            texto = texto.replace(antigo, f'<h3>{titulo}</h3>', 1)
            p.write_text(texto, encoding='utf-8')
            trocas += 1

          p = Path('pages/tia-controle-versoes.html')
          texto = p.read_text(encoding='utf-8')
          if '13 - Agora é com você' not in texto or '<h2>Agora é com você</h2>' not in texto:
            raise SystemExit('Título esperado não encontrado em TIA')
          texto = texto.replace('13 - Agora é com você', '13 - Nova decisão administrativa', 1)
          texto = texto.replace('<h2>Agora é com você</h2>', '<h2>Controle de versões em uma nova decisão administrativa</h2>', 1)
          p.write_text(texto, encoding='utf-8')

          p = Path('pages/bancodedados.html')
          texto = p.read_text(encoding='utf-8')
          if '<h3>Exemplo</h3>' not in texto or '<h3>Por que isso importa?</h3>' not in texto:
            raise SystemExit('Títulos esperados não encontrados em Banco de Dados')
          texto = texto.replace('<h3>Exemplo</h3>', '<h3>Exemplo: cliente e pedidos</h3>', 1)
          texto = texto.replace('<h3>Por que isso importa?</h3>', '<h3>Por que o mecanismo de armazenamento importa?</h3>', 1)
          p.write_text(texto, encoding='utf-8')

          print(f'{trocas + 4} títulos/labels lapidados.')

      - name: Atualizar pesquisa e visitas diretas
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs

      - name: Commitar lapidação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/qts pages/tia-controle-versoes.html pages/bancodedados.html meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Lapida títulos genéricos nos módulos"
          git push origin HEAD:lapidacao-titulos-mbb
