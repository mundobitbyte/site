name: Regenerar visitas PR 115

on:
  push:
    branches:
      - analise-sistemas-fechamento-espiral-mbb

permissions:
  contents: write

jobs:
  regenerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analise-sistemas-fechamento-espiral-mbb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerar índice de visitas diretas
        run: node meu-mbb/gerar-visitas.cjs
      - name: Versionar somente o índice atualizado
        run: |
          if git diff --quiet -- meu-mbb/visitas-diretas.json; then
            echo "Visitas diretas já estão atualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/visitas-diretas.json
          git commit -m "Meu MbB: atualizar visitas diretas da Análise de Sistemas"
          git push origin HEAD:analise-sistemas-fechamento-espiral-mbb
