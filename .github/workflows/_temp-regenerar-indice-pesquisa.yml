name: TEMP regenerar índice da pesquisa

on:
  push:
    branches:
      - ajuste-busca-cabecalho-reactnative-20260928
    paths:
      - '.github/workflows/_temp-regenerar-indice-pesquisa.yml'
      - 'pages/**'
      - 'fundamentos-informatica/**'
      - 'js/**'
      - 'meu-mbb/catalogo.test.cjs'
      - 'meu-mbb/atualizar-pesquisa.cjs'

permissions:
  contents: write

jobs:
  regenerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ajuste-busca-cabecalho-reactnative-20260928
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerar índice
        run: node meu-mbb/atualizar-pesquisa.cjs

      - name: Commitar índice atualizado
        run: |
          if git diff --quiet -- meu-mbb/catalogo.json; then
            echo 'Índice já estava sincronizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meu-mbb/catalogo.json
          git commit -m 'Atualiza índice da pesquisa global'
          git push origin HEAD:ajuste-busca-cabecalho-reactnative-20260928
