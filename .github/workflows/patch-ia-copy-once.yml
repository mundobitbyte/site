name: Patch IA Copy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ia-copy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liga script de cópia à aula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/ia/programacao.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link href="../../css/ia-programacao.css" rel="stylesheet"/>'
          script = '<script src="../../js/ia-programacao.js" defer></script>'
          if script not in s:
              if marker not in s:
                  raise SystemExit('Marcador CSS não encontrado')
              s = s.replace(marker, marker + '\n' + script, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publica e remove workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-ia-copy-once.yml
          git add pages/ia/programacao.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Ativa Copiar seletivo em IA e Programação"
          git push
