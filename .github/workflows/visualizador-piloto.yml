name: Validação visual global MbB

on:
  push:
    branches:
      - main
      - visualizador-global-seletivo-mbb
    paths:
      - 'css/mbb-visualizador.css'
      - 'js/mbb-visualizador.js'
      - 'js/mbb-visualizador-site.js'
      - 'js/mbb-visualizador-piloto.js'
      - 'js/analise-sistemas-visuais-autocritica.js'
      - 'js/appinventor.js'
      - 'js/arduino-destaques-mbb.js'
      - 'js/arduino-protocolos.js'
      - 'js/bancodedados.js'
      - 'js/reactnative-ajustes-finais-mbb.js'
      - 'js/infraestrutura/destaques-mbb.js'
      - 'js/informatica-produtividade/destaques-mbb.js'
      - 'js/ds-fisica/app.js'
      - 'js/ds-quimica/app.js'
      - 'js/ds-matematica/navegacao.js'
      - 'pages/python.html'
      - 'pages/programacao.html'
      - 'pages/arduino-protocolos.html'
      - 'fundamentos-informatica/index.html'
      - 'pages/analise-sistemas/**'
      - 'tools/visualizador-piloto/**'
      - '.github/workflows/visualizador-piloto.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'css/mbb-visualizador.css'
      - 'js/mbb-visualizador.js'
      - 'js/mbb-visualizador-site.js'
      - 'js/mbb-visualizador-piloto.js'
      - 'js/analise-sistemas-visuais-autocritica.js'
      - 'js/appinventor.js'
      - 'js/arduino-destaques-mbb.js'
      - 'js/arduino-protocolos.js'
      - 'js/bancodedados.js'
      - 'js/reactnative-ajustes-finais-mbb.js'
      - 'js/infraestrutura/destaques-mbb.js'
      - 'js/informatica-produtividade/destaques-mbb.js'
      - 'js/ds-fisica/app.js'
      - 'js/ds-quimica/app.js'
      - 'js/ds-matematica/navegacao.js'
      - 'pages/python.html'
      - 'pages/programacao.html'
      - 'pages/arduino-protocolos.html'
      - 'fundamentos-informatica/index.html'
      - 'pages/analise-sistemas/**'
      - 'tools/visualizador-piloto/**'
      - '.github/workflows/visualizador-piloto.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser validation tool
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Validate selective viewer in real Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mbb-visualizador-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tools/visualizador-piloto/smoke.mjs
