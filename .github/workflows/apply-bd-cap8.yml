name: Aplicar Banco de Dados Capitulo 8

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/apply-bd-cap8.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
          fetch-depth: 0

      - name: Aplicar limpeza editorial e Capitulo 8
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('pages/bancodedados.html')
          body_file = Path('tmp/bd_cap8_body.html')
          ex_file = Path('tmp/bd_cap8_exercises.html')
          text = page.read_text(encoding='utf-8')
          body = body_file.read_text(encoding='utf-8').strip()
          exercises = ex_file.read_text(encoding='utf-8').strip()

          # Limpeza editorial: somente rótulos/meta-textos que não pertencem ao aluno.
          removals = [
              '<h2>✅ CAPÍTULO 3 — MODELAGEM LÓGICA E NORMALIZAÇÃO OFICIALMENTE FINALIZADO</h2>\n',
              '<h2>✅ CAPÍTULO 4 — SQL COM MYSQL OFICIALMENTE FINALIZADO</h2>\n',
              '<h2>✅ CAPÍTULO 5 — RELACIONAMENTOS E JOIN OFICIALMENTE FINALIZADO</h2>\n',
              '<h2>✅ CAPÍTULO 6 — ADMINISTRAÇÃO E SGBD OFICIALMENTE FINALIZADO</h2>\n',
              '<h2>✅ CAPÍTULO 7 — TRANSAÇÕES E ACID OFICIALMENTE FINALIZADO</h2>\n',
          ]
          for item in removals:
              if text.count(item) != 1:
                  raise SystemExit(f'Falha de seguranca: marcador editorial inesperado: {item[:80]}')
              text = text.replace(item, '')

          replacements = {
              'BLOCO 19 — Fechamento Oficial do Capítulo SQL com MySQL': 'BLOCO 19 — Fechamento do Capítulo SQL com MySQL',
              'MbB: primeiro entender, depois abreviar': 'Primeiro entender, depois abreviar',
              'Modo MbB de diagnosticar': 'Como diagnosticar',
              'Pergunta MbB': 'Pergunta de revisão',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Falha de seguranca: texto de bastidor inesperado: {old}')
              text = text.replace(old, new)

          old_chapter = '''<section class="module placeholder" id="mod-avancado"><section class="hero"><span class="kicker">Capítulo 8</span><h2>SQL Avançado</h2><p>Subconsultas, UNION, CTEs, funções de janela, views, índices, EXPLAIN, triggers, procedures e functions.</p></section>
          </section>'''
          if text.count(old_chapter) != 1:
              raise SystemExit('Falha de seguranca: placeholder do Capitulo 8 nao encontrado exatamente uma vez.')
          text = text.replace(old_chapter, body, 1)

          old_card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-building-avancado')">
          <h3>8 SQL Avançado</h3>
          <p>Subconsultas, UNION, CTEs, funções de janela, views, índices, EXPLAIN, triggers, procedures e functions.</p>
          <span class="exercise-status building">🟠 Em construção</span>
          </button>'''
          new_card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-cap9')">
          <h3>8 SQL Avançado</h3>
          <p>Subconsultas, UNION, CTEs, funções de janela, views, índices, EXPLAIN, triggers, procedures e functions.</p>
          <span class="exercise-status available">Disponível · 12 exercícios</span>
          </button>'''
          if text.count(old_card) != 1:
              raise SystemExit('Falha de seguranca: cartao de exercicios do Capitulo 8 nao encontrado.')
          text = text.replace(old_card, new_card, 1)

          old_view = '''<section class="exercise-chapter-view" id="ex-building-avancado">
          <div class="exercise-inner-card">
          <button class="exercise-back inside-card" onclick="backToExerciseHome()">← Voltar aos capítulos</button><section class="card note"><div class="card-body"><h3>🟠 Em construção</h3><p>Os exercícios deste capítulo serão adicionados quando o conteúdo estiver pronto.</p></div></section>
          </div>
          </section>'''
          if text.count(old_view) != 1:
              raise SystemExit('Falha de seguranca: area de exercicios do Capitulo 8 nao encontrada.')
          text = text.replace(old_view, exercises, 1)

          # Validacoes editoriais e estruturais.
          forbidden = ['OFICIALMENTE FINALIZADO', 'Fechamento Oficial', 'MbB: primeiro', 'Modo MbB', 'Pergunta MbB']
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Falha de validacao: texto de bastidor permaneceu: {item}')

          required = [
              'id="mod-avancado"',
              'BLOCO 20 — Resumo e próxima etapa',
              'EXPLAIN ANALYZE',
              'CREATE TRIGGER trg_produto_audita_preco',
              'CREATE PROCEDURE sp_produtos_por_categoria',
              'CREATE FUNCTION fn_status_estoque',
              'id="ex-cap9"',
              '8A — Subconsulta escalar',
              '8L — Desafio final: painel analítico',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Falha de validacao: conteudo esperado ausente: {item}')

          for module_id in ['mod-inicio','mod-fundamentos','mod-modelagem','mod-modelagem-logica','mod-sql','mod-joins','mod-sgbd','mod-transacoes','mod-avancado','mod-projetos','mod-moderna','mod-exercicios']:
              if text.count(f'id="{module_id}"') != 1:
                  raise SystemExit(f'Falha estrutural no modulo {module_id}')

          for label in ['8A','8B','8C','8D','8E','8F','8G','8H','8I','8J','8K','8L']:
              if text.count(f'<summary>{label} —') != 1:
                  raise SystemExit(f'Exercicio {label} ausente ou duplicado')

          page.write_text(text, encoding='utf-8')
          PY

      - name: Confirmar que somente a pagina sera alterada
        run: |
          git status --short
          changed=$(git status --short | awk '{print $2}' | grep -v '^tmp/' | grep -v '^.github/workflows/apply-bd-cap8.yml$' || true)
          if [ "$changed" != "pages/bancodedados.html" ]; then
            echo "Alteracao inesperada fora de pages/bancodedados.html: $changed"
            exit 1
          fi

      - name: Commitar pagina
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html
          git commit -m "Desenvolve capitulo 8 SQL Avancado e remove textos de bastidores"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd

      - name: Remover arquivos temporarios
        run: |
          git rm tmp/bd_cap8_body.html tmp/bd_cap8_exercises.html .github/workflows/apply-bd-cap8.yml
          git commit -m "Remove arquivos temporarios do capitulo 8"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd
