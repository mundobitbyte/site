name: Fechamento final Banco de Dados

on:
  push:
    branches:
      - bancodedados-fechamento-final
    paths:
      - .github/workflows/bd-fechamento-final.yml

permissions:
  contents: write

jobs:
  lapidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-fechamento-final
          fetch-depth: 0

      - name: Aplicar correções finais auditadas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('pages/bancodedados.html')
          s = path.read_text(encoding='utf-8')
          expected_blob = 'f00bd80537d829f698ccc33f26782cf85f0362d7'
          actual_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          assert actual_blob == expected_blob, f'Base inesperada: {actual_blob}'

          def once(old, new, label):
              global s
              n = s.count(old)
              assert n == 1, f'{label}: esperado 1, encontrado {n}'
              s = s.replace(old, new, 1)

          def sub_once(pattern, repl, label):
              global s
              new_s, n = re.subn(pattern, repl, s, count=1, flags=re.S)
              assert n == 1, f'{label}: esperado 1, encontrado {n}'
              s = new_s

          # 1) SQL incoerente no capítulo histórico.
          once("<pre>SELECT nome\nFROM alunos\nWHERE turma = '1A';</pre>",
               "<pre>SELECT nome\nFROM alunos\nWHERE id_turma = 10;</pre>",
               'SQL histórico')

          # 2) Início: manter evolução moderna como prévia histórica, sem antecipar o Capítulo 10.
          sub_once(
              r'<h2>17\. Big Data — quando os dados explodiram</h2>.*?(?=<h2>21\. O mundo atual funciona sobre dados</h2>)',
              '''<h2>17. Big Data — novos problemas de escala</h2>
<p>Com internet, smartphones, sensores e serviços digitais, algumas organizações passaram a lidar com volumes, velocidades e variedades de dados muito maiores. O termo <strong>Big Data</strong> aparece nesse contexto para descrever desafios que não se resumem apenas a “ter muitos dados”.</p>

<h2>18. NoSQL — outros modelos para outros problemas</h2>
<p>Também surgiram bancos não relacionais, frequentemente agrupados sob o nome <strong>NoSQL — Not Only SQL</strong>. Eles não substituem automaticamente bancos relacionais: oferecem modelos diferentes para necessidades específicas.</p>
<p><span class="tag">Documento</span> MongoDB &nbsp; <span class="tag">Chave-valor</span> Redis &nbsp; <span class="tag">Grafos</span> Neo4j &nbsp; <span class="tag">Colunas amplas (wide-column)</span> Cassandra</p>

<h2>19. Cloud Computing — bancos como serviço</h2>
<p>A computação em nuvem também mudou a forma de operar bancos: em vez de manter toda a infraestrutura localmente, organizações podem usar serviços gerenciados, com recursos de disponibilidade, backup, monitoramento e escala fornecidos pela plataforma.</p>

<h2>20. Dados e Inteligência Artificial</h2>
<p>Sistemas de Inteligência Artificial também dependem de dados organizados, acessíveis e confiáveis. Isso aproxima bancos de dados de temas como análise, busca, recomendação e aplicações com IA.</p>
<div class="card note"><div class="card-body"><h3>Prévia, não destino final</h3><p>Por enquanto, basta perceber que novos problemas produziram novas arquiteturas. No <strong>Capítulo 10 — Visão Moderna</strong>, voltaremos a Big Data, NoSQL, nuvem, analytics e IA com critérios de escolha e exemplos mais completos.</p></div></div>
''',
              'prévia moderna do Início')

          # Exercícios H6/H7 alinhados ao caráter introdutório do Início.
          sub_once(
              r'<details class="exercise-item">\s*<summary>H6 — Internet, Big Data, NoSQL e Cloud</summary>.*?</details>',
              '''<details class="exercise-item">
<summary>H6 — Internet, Big Data, NoSQL e Cloud</summary>
<div class="exercise-content">
<div class="exercise-meta"><span class="meta-pill meta-medium">🟡 Intermediário</span><span class="meta-pill">🌐 Evolução</span><span class="meta-pill">Tema: novos desafios</span></div>
<p><strong>Situação-problema:</strong> uma plataforma digital cresce de milhares para milhões de acessos e passa a registrar vídeos, comentários, pagamentos, recomendações e logs.</p>
<ol><li>Que novos desafios de volume, velocidade ou variedade podem aparecer?</li><li>Por que esse crescimento pode levar a organização a combinar tecnologias diferentes?</li><li>Explique por que NoSQL não significa “fim do SQL”.</li><li>Qual papel a nuvem pode ter nesse crescimento?</li></ol>
<div class="answer-space">Neste momento, foque no motivo histórico da evolução. A escolha arquitetural detalhada será estudada no Capítulo 10.</div>
</div>
</details>''',
              'H6')
          sub_once(
              r'<details class="exercise-item">\s*<summary>H7 — Desafio Final: Rede Social Moderna</summary>.*?</details>',
              '''<details class="exercise-item">
<summary>H7 — Desafio Final: da história ao presente</summary>
<div class="exercise-content">
<div class="exercise-meta"><span class="meta-pill meta-hard">🔴 Avançado</span><span class="meta-pill">🛠 Síntese</span><span class="meta-pill">Tema: evolução dos bancos</span></div>
<p>Escolha um sistema moderno, como rede social, streaming, banco digital ou e-commerce.</p>
<ol><li>Que problemas ele teria se dependesse apenas de arquivos isolados?</li><li>Onde um SGBD ajuda?</li><li>Por que o modelo relacional continua útil?</li><li>Que novos desafios de escala ou variedade aparecem?</li><li>Por que tecnologias diferentes podem coexistir no mesmo sistema?</li></ol>
<div class="answer-space">Produza uma síntese curta ligando sistemas manuais, arquivos, SGBDs, modelo relacional e desafios modernos.</div>
</div>
</details>''',
              'H7')

          # 3/4) Terminologia coerente: coluna/atributo para estrutura, valor para conteúdo.
          replacements = {
              '<p>O campo <strong>id_aluno</strong> identifica cada aluno individualmente. Ele não pode repetir e não deve ficar vazio.</p>': '<p>A coluna/atributo <strong>id_aluno</strong> identifica cada aluno individualmente. Ela não pode repetir e não deve ficar vazia.</p>',
              '<p>O campo <strong>id_turma</strong> aparece na tabela alunos para indicar a qual turma cada aluno pertence.</p>': '<p>A coluna/atributo <strong>id_turma</strong> aparece na tabela alunos para indicar a qual turma cada aluno pertence.</p>',
              'Tabelas\n↓\nCampos\n↓\nTipos': 'Tabelas\n↓\nColunas / atributos\n↓\nTipos',
              '<th>Campos principais</th>': '<th>Colunas principais</th>',
              'Dados, informação, tabelas, registros, campos, chaves e integridade.': 'Dados, informação, tabelas, registros, colunas/atributos, chaves e integridade.',
              'Dados, informação, tabelas, campos, chaves, tipos, relacionamentos, integridade e funcionamento real dos sistemas.': 'Dados, informação, tabelas, colunas/atributos, chaves, tipos, relacionamentos, integridade e funcionamento real dos sistemas.',
              'Depois pensamos nos campos, tipos, chaves, relacionamentos e regras de integridade.': 'Depois pensamos nas colunas/atributos, tipos, chaves, relacionamentos e regras de integridade.',
              'Quais campos seriam importantes?': 'Quais colunas/atributos seriam importantes?'
          }
          for old, new in replacements.items():
              assert old in s, f'Terminologia não encontrada: {old[:45]}'
              s = s.replace(old, new)

          # 5) Conceitual: entidade associativa no lugar de definição simplificada de forte/fraca.
          once(
              '<h3>Entidade forte e entidade fraca</h3>\n<p>Uma entidade forte consegue existir sozinha, como Cliente, Produto, Aluno ou Funcionário.</p>\n<p>Uma entidade fraca depende de outra para existir. Um exemplo simples é <strong>ItemPedido</strong>, que normalmente depende de um Pedido.</p>',
              '<h3>Entidade associativa: quando a relação também precisa guardar dados</h3>\n<p>Alguns relacionamentos precisam ser representados por um elemento próprio. É o caso de <strong>ItemPedido</strong>, que liga Pedido e Produto e pode guardar informações da própria relação, como quantidade e preço praticado.</p>\n<p>Esse tipo de estrutura é especialmente importante em relacionamentos N:N. Mais adiante veremos como ela se transforma em uma tabela associativa no modelo lógico.</p>',
              'entidade associativa')

          # DER conceitual: explicitar que Fornecedor 1:N Produto é uma regra simplificada, depois refinada.
          needle = '<li><strong>FORNECEDOR (1) — (N) PRODUTO:</strong> um fornecedor pode fornecer vários produtos, mas cada produto está ligado a um fornecedor neste modelo simplificado.</li>'
          once(needle, needle + '\n<li><strong>Regra simplificada:</strong> este desenho considera um fornecedor por produto apenas para a primeira leitura do DER. Se o negócio permitir vários fornecedores para o mesmo produto, a regra muda para N:N e o modelo precisará ser refinado — exatamente o que faremos no próximo capítulo.</li>', 'ponte DER N:N')

          # 10) Checagens internas curtas; prática completa permanece no 99 Exercícios.
          sub_once(
              r'<h2>23\. Exercícios diretos</h2>.*?(?=<h2>26\. Fechamento do capítulo</h2>)',
              '''<h2>23. Checagem antes de avançar</h2>
<ol><li>Qual problema central dos arquivos isolados levou à necessidade dos SGBDs?</li><li>O que o modelo relacional mudou na organização dos dados?</li><li>Qual é a diferença entre banco de dados, SGBD e SQL?</li><li>Por que o surgimento de novas tecnologias não tornou o modelo relacional inútil?</li></ol>
<div class="card note"><div class="card-body"><h3>Quer praticar mais?</h3><p>Os exercícios completos, graduados e contextualizados deste capítulo estão em <strong>99 Exercícios → Início</strong>.</p></div></div>
''',
              'checagem Início')
          once('<h2>26. Fechamento do capítulo</h2>', '<h2>24. Fechamento do capítulo</h2>', 'renumeração Início')

          for cap, questions in [
              ('1', '<ol><li>Explique a diferença entre dado e informação.</li><li>Diferencie tabela, registro, coluna/atributo e valor.</li><li>Qual é a função de PK e FK?</li><li>Por que integridade e tipos de dados importam?</li></ol>'),
              ('2', '<ol><li>Identifique entidades, atributos e relacionamentos em um sistema simples.</li><li>Escreva uma regra de negócio antes de definir uma cardinalidade.</li><li>Diferencie 1:1, 1:N e N:N.</li><li>Explique o que 0..N e 1..1 acrescentam à leitura da cardinalidade.</li></ol>'),
              ('3', '<ol><li>Explique como entidade, atributo e relacionamento chegam ao modelo lógico.</li><li>Por que um N:N costuma exigir tabela associativa?</li><li>Diferencie 1FN, 2FN e 3FN pelo problema que cada uma evita.</li><li>Explique por que dependência funcional ajuda a decidir onde um dado deve ficar.</li></ol>')
          ]:
              sub_once(
                  rf'<h2>EXERCÍCIOS — CAPÍTULO {cap}</h2>.*?(?=<h2>FECHAMENTO DO CAPÍTULO {cap}</h2>)',
                  '<h2>Checagem antes de avançar</h2>\n' + questions + f'\n<div class="card note"><div class="card-body"><h3>Prática completa</h3><p>Os exercícios graduados deste capítulo estão em <strong>99 Exercícios → Capítulo {cap}</strong>.</p></div></div>\n',
                  f'checagem capítulo {cap}')

          # 6) Política única de estado dos laboratórios a partir do primeiro capítulo executável.
          anchor = '<p>A administração completa de instalação, usuários, permissões, backup e restauração será aprofundada no Capítulo 6. Aqui fazemos apenas o necessário para conseguir praticar SQL desde já.</p>'
          once(anchor, anchor + '''
<div class="card note"><div class="card-body"><h3>Regra dos laboratórios: preserve a base de referência</h3><p>O banco <code>comercio</code> será reutilizado nos próximos capítulos. Por isso, exemplos que alteram dados reais devem terminar deixando a base novamente em um estado conhecido. Neste módulo faremos isso de três formas: <strong>ROLLBACK</strong> quando a alteração for apenas teste, <strong>registro temporário + limpeza</strong> quando for necessário praticar INSERT/DELETE, ou um <strong>banco/tabela de laboratório separado</strong> quando a experiência precisar permanecer.</p></div></div>''', 'política de laboratório')

          # 8) ALTER TABLE em tabela de laboratório, sem tocar no modelo comercial.
          alter_block = '''<h2>BLOCO 6.1 — ALTER TABLE: quando a estrutura precisa evoluir</h2>
<p>CREATE TABLE cria a estrutura inicial. Mas sistemas evoluem. <strong>ALTER TABLE</strong> modifica a estrutura de uma tabela que já existe.</p>
<p>Para aprender sem alterar o modelo comercial, use uma tabela de laboratório:</p>
<div class="codebox"><button class="copy-btn" type="button">Copiar laboratório ALTER TABLE</button><pre><code>CREATE TABLE estrutura_lab (
    id INT PRIMARY KEY
);

ALTER TABLE estrutura_lab
ADD COLUMN observacao VARCHAR(100);

DESCRIBE estrutura_lab;

ALTER TABLE estrutura_lab
DROP COLUMN observacao;

DROP TABLE estrutura_lab;</code></pre></div>
<div class="card warning"><div class="card-body"><h3>DDL não é um Ctrl+Z</h3><p>ALTER TABLE, DROP TABLE e outros comandos de definição podem causar <strong>commit implícito</strong> no MySQL. Por isso o laboratório usa uma tabela descartável: não conte com ROLLBACK para desfazer mudanças de estrutura.</p></div></div>
'''
          once('<h2>BLOCO 7 — INSERT INTO: inserindo os dados da base</h2>', alter_block + '<h2>BLOCO 7 — INSERT INTO: inserindo os dados da base</h2>', 'ALTER TABLE')

          # Capítulo 4: UPDATE de teste sempre volta ao estado anterior.
          sub_once(
              r'<h2>BLOCO 12 — UPDATE: alterando registros</h2>.*?(?=<h2>BLOCO 13 — DELETE: removendo registros</h2>)',
              '''<h2>BLOCO 12 — UPDATE: alterando registros</h2>
<p>UPDATE modifica dados existentes. O uso do WHERE é essencial. Como <code>comercio</code> será reutilizado, vamos praticar dentro de uma transação e terminar com ROLLBACK.</p>
<div class="codebox"><button class="copy-btn" type="button">Copiar UPDATE seguro</button><pre><code>START TRANSACTION;

SELECT *
FROM produto
WHERE id_produto = 22;

UPDATE produto
SET preco = 6
WHERE id_produto = 22;

SELECT *
FROM produto
WHERE id_produto = 22;

ROLLBACK;

SELECT *
FROM produto
WHERE id_produto = 22;</code></pre></div>
<div class="card problem"><div class="card-body"><h3>Cuidado</h3><p>UPDATE sem WHERE altera todos os registros da tabela. Em um banco real, isso pode causar grande impacto.</p></div></div>
<div class="codebox"><button class="copy-btn" type="button">Copiar UPDATE em grupo sem deixar alteração</button><pre><code>START TRANSACTION;

UPDATE produto
SET preco = preco + 1
WHERE id_categoria = 3;

SELECT id_produto, descricao, preco
FROM produto
WHERE id_categoria = 3;

ROLLBACK;</code></pre></div>
<p>O objetivo é enxergar o efeito do UPDATE sem carregar essa mudança para os capítulos seguintes.</p>
''',
              'UPDATE seguro')

          # Testes de FK/CHECK também dentro de transação, com IDs claramente de laboratório.
          sub_once(
              r'<h2>BLOCO 14 — FOREIGN KEY: integridade referencial real</h2>.*?(?=<h2>BLOCO 15 — JOIN: unindo tabelas relacionadas</h2>)',
              '''<h2>BLOCO 14 — FOREIGN KEY: integridade referencial real</h2>
<p>A FOREIGN KEY é a implementação física do relacionamento entre tabelas. Ela impede referências para registros que não existem. Faremos os testes dentro de uma transação para não deixar registros de laboratório na base.</p>
<div class="codebox"><button class="copy-btn" type="button">Copiar teste de integridade</button><pre><code>START TRANSACTION;

-- deve funcionar: categoria 3 existe
INSERT INTO produto
(id_produto, descricao, preco, qtde, id_categoria, estoque_minimo)
VALUES
(900001, 'PRODUTO TESTE', 5, 10, 3, 5);

-- deve falhar: categoria 999 não existe
INSERT INTO produto
(id_produto, descricao, preco, qtde, id_categoria, estoque_minimo)
VALUES
(900002, 'PRODUTO INVALIDO', 5, 10, 999, 5);

-- deve funcionar: produto e fornecedor existem
INSERT INTO produto_fornecedor (id_produto, id_fornecedor)
VALUES (900001, 4);

-- deve falhar: fornecedor 999 não existe
INSERT INTO produto_fornecedor (id_produto, id_fornecedor)
VALUES (900001, 999);

ROLLBACK;</code></pre></div>
<p>Os comandos inválidos são rejeitados pelas constraints. O ROLLBACK final desfaz também os testes válidos que chegaram a ser executados, preservando a base <code>comercio</code>.</p>
<div class="card solution"><div class="card-body"><h3>O erro é parte do laboratório</h3><p>Quando a FK ou o CHECK bloqueia um dado inválido, o banco está fazendo exatamente o que foi modelado: protegendo integridade.</p></div></div>
''',
              'integridade sem resíduos')

          # 7) Exercícios 4G e 4H coerentes com a política de laboratório.
          sub_once(
              r'<details class="exercise-item"><summary>4G — UPDATE seguro</summary>.*?</details>',
              '''<details class="exercise-item"><summary>4G — UPDATE seguro</summary><div class="exercise-content"><ol><li>Inicie uma transação.</li><li>Consulte o produto 22 e anote o preço.</li><li>Atualize temporariamente seu preço.</li><li>Consulte novamente para enxergar a mudança.</li><li>Execute ROLLBACK e confirme que o preço original voltou.</li><li>Explique o risco de UPDATE sem WHERE.</li></ol></div></details>''',
              'exercício 4G')
          sub_once(
              r'<details class="exercise-item"><summary>4H — DELETE seguro</summary>.*?</details>',
              '''<details class="exercise-item"><summary>4H — DELETE seguro</summary><div class="exercise-content"><ol><li>Crie um produto temporário com um ID reservado para laboratório e sem fornecedor associado.</li><li>Consulte esse registro pelo ID.</li><li>Remova somente o registro temporário com DELETE + WHERE.</li><li>Confirme que ele desapareceu.</li><li>Explique por que não devemos escolher um produto real da base apenas para praticar exclusão.</li><li>Explique o risco de DELETE sem WHERE.</li></ol></div></details>''',
              'exercício 4H')

          # 7) Capítulo 7: Sessão B não pode deixar baixa permanente após a espera.
          sub_once(
              r'<h2>BLOCO 16 — Laboratório de duas sessões</h2>.*?(?=<h2>BLOCO 17 — Deadlock:)',
              '''<h2>BLOCO 16 — Laboratório de duas sessões</h2>
<p>Abra duas conexões. Na <strong>Sessão A</strong>:</p>
<div class="codebox"><button class="copy-btn" type="button">Copiar Sessão A</button><pre><code>START TRANSACTION;

SELECT id_produto, qtde
FROM produto
WHERE id_produto = 22
FOR UPDATE;

-- não dê COMMIT ainda</code></pre></div>
<p>Na <strong>Sessão B</strong>, também abra uma transação antes de tentar alterar:</p>
<div class="codebox"><button class="copy-btn" type="button">Copiar Sessão B</button><pre><code>START TRANSACTION;

UPDATE produto
SET qtde = qtde - 1
WHERE id_produto = 22;

-- quando o UPDATE finalmente concluir, execute:
ROLLBACK;</code></pre></div>
<p>A Sessão B deve ficar aguardando enquanto A mantém o bloqueio. Volte à Sessão A e execute <code>ROLLBACK;</code>. O UPDATE da Sessão B então pode prosseguir; em seguida, execute o <code>ROLLBACK</code> indicado nela para que nenhuma baixa fique gravada.</p>
<div class="card solution"><div class="card-body"><h3>O conceito ficou visível sem sujar a base</h3><p>Duas conexões disputando a mesma linha permitem enxergar bloqueio e espera. As duas terminam com ROLLBACK, portanto o produto permanece com a quantidade original.</p></div></div>

''',
              'duas sessões seguras')
          sub_once(
              r'<details class="exercise-item"><summary>7G — Duas sessões</summary>.*?</details>',
              '''<details class="exercise-item"><summary>7G — Duas sessões</summary><div class="exercise-content"><ol><li>Abra duas conexões ao MySQL.</li><li>Na Sessão A, inicie uma transação e selecione um produto com FOR UPDATE.</li><li>Na Sessão B, inicie outra transação e tente alterar o mesmo produto.</li><li>Descreva a espera observada.</li><li>Execute ROLLBACK na Sessão A para liberar o bloqueio.</li><li>Assim que o UPDATE da Sessão B concluir, execute ROLLBACK nela também.</li><li>Confirme que a quantidade final do produto não mudou e explique por que B estava esperando.</li></ol></div></details>''',
              'exercício 7G')

          # 9) Capítulo 8: IN com subconsulta, coerente com o título do bloco.
          anchor8 = '<p>Subconsultas não servem apenas para retornar um único valor. Elas também podem responder se existe ou não uma correspondência.</p>'
          once(anchor8, anchor8 + '''
<h3>IN com subconsulta</h3>
<p>No Capítulo 4 usamos IN com uma lista fixa. Agora a própria lista pode vir de outro SELECT:</p>
<div class="codebox"><button class="copy-btn" type="button">Copiar IN com subconsulta</button><pre><code>SELECT id_produto, descricao, id_categoria
FROM produto
WHERE id_categoria IN (
    SELECT id_categoria
    FROM categoria
    WHERE nome LIKE '%DOCE%'
)
ORDER BY descricao;</code></pre></div>
<p>A consulta interna retorna os IDs das categorias cujo nome contém “DOCE”; a consulta externa procura produtos que pertencem a qualquer uma delas.</p>
''', 'IN com subconsulta')
          sub_once(
              r'<details class="exercise-item"><summary>8B — EXISTS e NOT EXISTS</summary>.*?</details>',
              '''<details class="exercise-item"><summary>8B — IN, EXISTS e NOT EXISTS</summary><div class="exercise-content"><ol><li>Use IN com uma subconsulta para listar produtos pertencentes a categorias selecionadas por outro SELECT.</li><li>Liste fornecedores que possuem pelo menos um produto associado usando EXISTS.</li><li>Liste fornecedores sem produtos usando NOT EXISTS.</li><li>Explique o papel da correlação entre fornecedor e produto_fornecedor.</li><li>Compare conceitualmente NOT EXISTS com LEFT JOIN + IS NULL.</li></ol></div></details>''',
              'exercício 8B')

          # Atualizar referências de conteúdo do Capítulo 4 para incluir evolução estrutural.
          s = s.replace('criação de banco, cinco tabelas relacionadas, restrições, inserção dos dados existentes', 'criação e evolução de estruturas, cinco tabelas relacionadas, restrições, inserção dos dados existentes')
          s = s.replace('CREATE DATABASE, CREATE TABLE, AUTO_INCREMENT, restrições, INSERT', 'CREATE DATABASE, CREATE TABLE, ALTER TABLE, AUTO_INCREMENT, restrições, INSERT')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validar conteúdo e estrutura
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('pages/bancodedados.html').read_text(encoding='utf-8')

          required = [
            "WHERE id_turma = 10;",
            "Colunas amplas (wide-column)",
            "Regra dos laboratórios: preserve a base de referência",
            "BLOCO 6.1 — ALTER TABLE",
            "ROLLBACK;</code></pre></div>\n<p>A Sessão B deve ficar aguardando",
            "IN com subconsulta",
            "99 Exercícios → Início",
            "99 Exercícios → Capítulo 1",
            "99 Exercícios → Capítulo 2",
            "99 Exercícios → Capítulo 3",
            "entidade associativa",
            "Regra simplificada:"
          ]
          for x in required:
              assert x in s, f'Faltando: {x}'

          forbidden = [
            "WHERE turma = '1A';",
            "<span class=\"tag\">Colunar</span> Cassandra",
            "Entidade forte e entidade fraca",
            "<h2>23. Exercícios diretos</h2>",
            "<h2>EXERCÍCIOS — CAPÍTULO 1</h2>",
            "<h2>EXERCÍCIOS — CAPÍTULO 2</h2>",
            "<h2>EXERCÍCIOS — CAPÍTULO 3</h2>",
            "OFICIALMENTE FINALIZADO",
            "Em construção"
          ]
          for x in forbidden:
              assert x not in s, f'Resíduo encontrado: {x}'

          # IDs únicos.
          ids = re.findall(r'\bid="([^"]+)"', s)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          assert not dup, f'IDs duplicados: {dup}'

          # Navegação principal.
          targets = re.findall(r'data-target="([^"]+)"', s)
          for t in targets:
              assert f'id="mod-{t}"' in s, f'Alvo de módulo ausente: {t}'

          # Cards de exercícios.
          ex_targets = re.findall(r"openExerciseChapter\('([^']+)'\)", s)
          for t in ex_targets:
              assert f'id="{t}"' in s, f'Alvo de exercício ausente: {t}'
          assert len(set(ex_targets)) == 11, f'Esperados 11 grupos de exercícios, encontrados {len(set(ex_targets))}'

          # Exercícios finais continuam presentes.
          for marker in ['4L —', '5L —', '6L —', '7L —', '8L —', '9L —', '10L —']:
              assert marker in s, f'Exercício final ausente: {marker}'

          print('VALIDAÇÃO FINAL OK')
          print('IDs:', len(ids), 'Módulos:', len(set(targets)), 'Grupos de exercícios:', len(set(ex_targets)))
          print('Ocorrências restantes do termo campo/campos:', len(re.findall(r'\bcampos?\b', s, flags=re.I)))
          PY

          # Nesta branch, antes da limpeza do workflow, só HTML + workflow podem diferir da main.
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | sort -u | grep -v -E '^(pages/bancodedados\.html|\.github/workflows/bd-fechamento-final\.yml)$' || true)"
          test -z "$BAD" || { echo "Arquivo fora do escopo: $BAD"; exit 1; }

      - name: Publicar HTML final
        shell: bash
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add pages/bancodedados.html
          git commit -m "Lapida e fecha modulo Banco de Dados"
          git push origin HEAD:bancodedados-fechamento-final

      - name: Remover workflow temporário
        shell: bash
        run: |
          rm .github/workflows/bd-fechamento-final.yml
          git add .github/workflows/bd-fechamento-final.yml
          git commit -m "Remove workflow temporario de fechamento de Banco de Dados"
          git push origin HEAD:bancodedados-fechamento-final
