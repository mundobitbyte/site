name: Fechamento final Banco de Dados

on:
  push:
    branches:
      - bancodedados-fechamento-final
    paths:
      - .github/workflows/bd-fechamento-final.yml

permissions:
  contents: write

jobs:
  lapidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-fechamento-final
          fetch-depth: 0

      - name: Aplicar e validar correções finais
        run: python .github/scripts/bd_final_patch.py

      - name: Validar escopo
        shell: bash
        run: |
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | sort -u | grep -v -E '^(pages/bancodedados\.html|\.github/workflows/bd-fechamento-final\.yml|\.github/scripts/bd_final_patch\.py)$' || true)"
          test -z "$BAD" || { echo "Arquivo fora do escopo: $BAD"; exit 1; }

      - name: Publicar HTML final
        shell: bash
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add pages/bancodedados.html
          git commit -m "Lapida e fecha modulo Banco de Dados"
          git push origin HEAD:bancodedados-fechamento-final

      - name: Limpar arquivos temporários
        shell: bash
        run: |
          rm .github/scripts/bd_final_patch.py
          rm .github/workflows/bd-fechamento-final.yml
          git add .github/scripts/bd_final_patch.py .github/workflows/bd-fechamento-final.yml
          git commit -m "Remove automacao temporaria de fechamento de Banco de Dados"
          git push origin HEAD:bancodedados-fechamento-final
