name: tmp-inspeciona-editorial-infra
on:
  push:
    branches:
      - lapidacao-infraestrutura-mbb
    paths:
      - .github/workflows/tmp-inspeciona-editorial-infra.yml
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
      - name: Mostrar ocorrências em contexto
        shell: python
        run: |
          from pathlib import Path
          import re, html
          files=list(Path('js/infraestrutura').glob('*.js'))
          pat=re.compile(r'(?i)\b(professor|aluno|módulo|módulos|capítulo|capítulos|próxima aula|nesta aula|aula anterior)\b')
          for p in files:
              t=p.read_text(encoding='utf-8')
              plain=html.unescape(re.sub(r'<[^>]+>',' ',t))
              plain=re.sub(r'\s+',' ',plain)
              for m in pat.finditer(plain):
                  a=max(0,m.start()-180); b=min(len(plain),m.end()+220)
                  print(f'{p} | {m.group(0)} | ...{plain[a:b]}...')
