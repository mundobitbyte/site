name: QTS - Cantina Horizonte

on:
  push:
    paths:
      - 'qts/cantina-horizonte-v1/**'
      - 'pages/qts/**'
      - 'js/qts.js'
      - 'css/qts.css'
      - '.github/workflows/qts-cantina-horizonte.yml'
  pull_request:
    paths:
      - 'qts/cantina-horizonte-v1/**'
      - 'pages/qts/**'
      - 'js/qts.js'
      - 'css/qts.css'
      - '.github/workflows/qts-cantina-horizonte.yml'
  workflow_dispatch:

jobs:
  testes-qts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qts/cantina-horizonte-v1

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Executar testes Python com cobertura
        run: pytest --cov=backend --cov-report=term-missing

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Executar teste E2E
        run: npm run test:e2e
