name: tmp-moderna-microfinal

on:
  push:
    branches: [lapidacao-infraestrutura-mbb]

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[moderna-m4-microfinal]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
          fetch-depth: 0
      - name: Corrigir resíduos finais
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/infraestrutura/moderna-00-03.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace('<td>S-00/S-10 e impacto de indisponibilidade</td>','<td>Registro do Servidor: necessidade, continuidade e impacto de indisponibilidade</td>')
          p.write_text(t,encoding='utf-8')

          p=Path('js/infraestrutura/moderna-99.js')
          t=p.read_text(encoding='utf-8')
          fixes={
            'os o Registro da Evolução atualizado':'o Registro da Evolução atualizado',
            '<strong>necessidade registrada · necessidade</strong>':'<strong>Necessidade e alternativas</strong>',
            '<strong>projeto e medição da VM · VM</strong>':'<strong>VM e medições</strong>',
            '<strong>comparação de capacidade e custo · capacidade</strong>':'<strong>Capacidade e custo</strong>',
            '<strong>inventário do runtime · runtime</strong>':'<strong>Runtime e contêineres</strong>',
            '<strong>evidência de persistência · persistência</strong>':'<strong>Persistência</strong>',
            '<strong>manifesto Compose · Compose</strong>':'<strong>Compose e serviços</strong>',
            '<strong>plano de atualização · atualização</strong>':'<strong>Atualização e retorno</strong>',
            '<strong>decisão de hospedagem · nuvem</strong>':'<strong>Hospedagem e responsabilidades</strong>',
            '<strong>implantação remota · implantação</strong>':'<strong>Implantação remota</strong>',
            '<strong>mapa de exposição · exposição</strong>':'<strong>Exposição e TLS</strong>',
            '<strong>decisão arquitetural · arquitetura</strong>':'<strong>Decisão arquitetural</strong>',
            'disco/ memória não coincide':'disco ou memória não coincide',
          }
          for old,new in fixes.items():
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
      - name: Validar microcorreção
        run: |
          set -e
          for f in js/infraestrutura/moderna-00-03.js js/infraestrutura/moderna-04-07.js js/infraestrutura/moderna-08-10.js js/infraestrutura/moderna-99.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('js/infraestrutura/moderna-00-03.js'),Path('js/infraestrutura/moderna-04-07.js'),Path('js/infraestrutura/moderna-08-10.js'),Path('js/infraestrutura/moderna-99.js')]
          txt='\n'.join(p.read_text(encoding='utf-8') for p in files)
          checks=[
            ('12 aulas',txt.count('window.infraestruturaModernLessons.push({')==12),
            ('sem S/R pedagógico',not re.search(r'(?<![A-Z0-9])[SR]-\d\d(?![A-Z0-9])',txt)),
            ('sem A/E/F pedagógico',not re.search(r'(?<![A-Z0-9])A-\d\d(?![A-Z0-9])|\bE-M\d+\b|\bF-M\d+\b',txt)),
            ('sem bastidores',not re.search(r'(?i)\b(professor|aluno|alunos|módulo|capítulo)\b',txt)),
            ('sem record-box','<div class="record-box">' not in txt),
            ('frase corrigida','os o Registro' not in txt),
            ('registro único','REGISTRO_DA_EVOLUCAO.md' in txt),
            ('técnica preservada',all(x in txt for x in ['VirtualBox','docker run','docker compose config','docker compose up -d','ssh -L','openssl s_client'])),
          ]
          for name,ok in checks: print(name,':','OK' if ok else 'FALHOU')
          assert all(ok for _,ok in checks)
          PY
          git diff --check
      - name: Commitar e limpar
        run: |
          set -e
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git rm .github/workflows/tmp-moderna-microfinal.yml
          git add js/infraestrutura/moderna-00-03.js js/infraestrutura/moderna-99.js
          git commit -m "Refina fechamento da Infraestrutura Moderna [moderna-m4-microfinal]"
          git push origin HEAD:lapidacao-infraestrutura-mbb
