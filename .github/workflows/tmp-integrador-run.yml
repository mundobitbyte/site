name: tmp-integrador-run

on:
  push:
    branches:
      - lapidacao-infraestrutura-mbb
    paths:
      - '.github/workflows/tmp-integrador-run.yml'

permissions:
  contents: write

jobs:
  lapidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
          fetch-depth: 0
      - name: Aplicar e validar
        run: |
          python .github/tmp-integrador-mbb.py
          node --check js/infraestrutura/integrador-99.js
          git diff --check
      - name: Commitar e limpar
        run: |
          git config user.name 'Mundo bit Byte'
          git config user.email 'mundobitbyte@gmail.com'
          git rm .github/tmp-integrador-mbb.py .github/workflows/tmp-integrador-run.yml
          git add js/infraestrutura/integrador-99.js
          git commit -m 'Lapida Laboratório Integrador de Infraestrutura no padrão MbB [infra-integrador]'
          git push origin HEAD:lapidacao-infraestrutura-mbb
