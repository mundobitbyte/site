name: Regenerar índices temporariamente — recebimento Análise

on:
  push:
    branches:
      - analise-sistemas-ambiguidade-recebimento
    paths:
      - '.github/workflows/tmp-indices-recebimento-analise.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analise-sistemas-ambiguidade-recebimento
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar índices oficiais
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs
      - name: Commitar índices
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
          else
            git commit -m "Análise de Sistemas: atualizar pesquisa após ajuste de recebimento"
            git push origin HEAD:analise-sistemas-ambiguidade-recebimento
          fi
