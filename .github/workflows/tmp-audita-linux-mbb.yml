name: tmp-audita-linux-mbb

on:
  push:
    branches: [lapidacao-infraestrutura-mbb]

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
      - name: Mapear taxonomia, bastidores e artefatos
        shell: python
        run: |
          from pathlib import Path
          import re
          files=[Path('js/infraestrutura/linux-00-03.js'),Path('js/infraestrutura/linux-04-07.js'),Path('js/infraestrutura/linux-08-10.js'),Path('js/infraestrutura/linux-99.js')]
          for p in files:
              text=p.read_text(encoding='utf-8')
              print(f'\n### {p}')
              print('aulas=',text.count('window.infraestruturaLinuxLessons.push({'),'record-box=',text.count('record-box'))
              pat=r'(?i).{0,95}(?:(?<![A-Z0-9])S-\d\d(?![A-Z0-9])|(?<![A-Z0-9])R-\d\d(?![A-Z0-9])|E-S\d|S-registros?|módulo|capítulo).{0,170}'
              for m in re.finditer(pat,text):
                  print(' '.join(m.group(0).split()))
