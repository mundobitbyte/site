name: Aplicar auditoria editorial de Programacao no main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar versao editorial exata
        shell: bash
        run: |
          git fetch origin programacao-editorial-20260824
          python - <<'PY'
          import base64, subprocess
          names = [f'part{i:02d}.b64' for i in range(1, 7)] + [f'seg{i:02d}.b64' for i in range(1, 11)]
          with open('/tmp/programacao_latest.patch', 'wb') as out:
              for name in names:
                  encoded = subprocess.check_output(['git','show',f'origin/programacao-editorial-20260824:.mbb-tmp/{name}'], text=True).strip()
                  out.write(base64.b64decode(encoded, validate=True))
          PY
          git apply --check /tmp/programacao_latest.patch
          git apply /tmp/programacao_latest.patch
          test "$(git hash-object js/programacao.js)" = "09ec37ccb8bcbfa72f40eb3e693aafd534af0688"
          test "$(git hash-object PROGRAMACAO_MBB_MAPA_E_AUDITORIA.md)" = "1e4de5cb6825a8b01176580042abd3fc523c978e"
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add js/programacao.js PROGRAMACAO_MBB_MAPA_E_AUDITORIA.md
          git rm .github/workflows/apply-programacao-editorial-main.yml
          git commit -m "Atualiza Programacao com auditoria editorial"
          git push origin HEAD:main
