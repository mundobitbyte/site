name: QTS - integração pública temporária

on:
  push:
    branches:
      - qts-integracao-publica
    paths:
      - '.github/workflows/qts-integracao-publica.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: qts-integracao-publica
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrar QTS à home e ao catálogo
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const homePath = 'index.html';
          let home = fs.readFileSync(homePath, 'utf8');
          if (!home.includes('href="pages/qts/index.html"')) {
            const card = `<a class="module-card" href="pages/qts/index.html">
          <div class="module-head"><h3>Qualidade e Teste de Software</h3></div>
          <div class="module-body">
          <p>Qualidade, técnicas de teste, evidências, automação, APIs, E2E e integração contínua aplicadas à Cantina Horizonte.</p>
          <span class="module-label">Qualidade e testes</span>
          </div>
          </a>`;
            const analise = /(<a class="module-card" href="pages\/analise-sistemas\/index\.html">[\s\S]*?<\/a>)/;
            if (!analise.test(home)) throw new Error('Cartão de Análise de Sistemas não encontrado na home.');
            home = home.replace(analise, `$1\n\n${card}`);
            fs.writeFileSync(homePath, home);
          }

          const catalogoPath = 'meu-mbb/catalogo.json';
          const catalogo = JSON.parse(fs.readFileSync(catalogoPath, 'utf8'));
          const specs = [
            ['mod-pages-qts-index', 'Qualidade e Teste de Software', 'pages/qts/index.html'],
            ['mod-pages-qts-00-sera-que-esta-pronto', '0 — Será que está pronto?', 'pages/qts/00-sera-que-esta-pronto.html'],
            ['mod-pages-qts-01-o-que-significa-qualidade', '1 — O que significa qualidade?', 'pages/qts/01-o-que-significa-qualidade.html'],
            ['mod-pages-qts-02-erro-defeito-falha-teste', '2 — Erro, defeito, falha e teste', 'pages/qts/02-erro-defeito-falha-teste.html'],
            ['mod-pages-qts-03-o-que-deveria-acontecer', '3 — O que deveria acontecer?', 'pages/qts/03-o-que-deveria-acontecer.html'],
            ['mod-pages-qts-04-antes-de-executar', '4 — Antes de executar', 'pages/qts/04-antes-de-executar.html'],
            ['mod-pages-qts-05-bons-valores-de-teste', '5 — Bons valores de teste', 'pages/qts/05-bons-valores-de-teste.html'],
            ['mod-pages-qts-06-regras-mais-complicadas', '6 — Regras mais complicadas', 'pages/qts/06-regras-mais-complicadas.html'],
            ['mod-pages-qts-07-o-que-estamos-testando', '7 — O que estamos testando?', 'pages/qts/07-o-que-estamos-testando.html'],
            ['mod-pages-qts-08-nao-da-para-testar-tudo', '8 — Não dá para testar tudo', 'pages/qts/08-nao-da-para-testar-tudo.html'],
            ['mod-pages-qts-09-planejar-e-documentar', '9 — Planejar e documentar', 'pages/qts/09-planejar-e-documentar.html'],
            ['mod-pages-qts-10-encontramos-um-defeito', '10 — Encontramos um defeito', 'pages/qts/10-encontramos-um-defeito.html'],
            ['mod-pages-qts-11-automatizando-repeticoes', '11 — Automatizando repetições', 'pages/qts/11-automatizando-repeticoes.html'],
            ['mod-pages-qts-12-teste-antes-do-codigo', '12 — Teste antes do código', 'pages/qts/12-teste-antes-do-codigo.html'],
            ['mod-pages-qts-13-interface-servidor-banco', '13 — Interface, servidor e banco juntos', 'pages/qts/13-interface-servidor-banco.html'],
            ['mod-pages-qts-14-como-o-usuario', '14 — Como o usuário', 'pages/qts/14-como-o-usuario.html'],
            ['mod-pages-qts-15-testes-executando-sozinhos', '15 — Testes executando sozinhos', 'pages/qts/15-testes-executando-sozinhos.html'],
            ['mod-pages-qts-16-esta-pronto-para-entrega', '16 — Está pronto para entrega?', 'pages/qts/16-esta-pronto-para-entrega.html']
          ];

          const ids = new Set(catalogo.unidades.map(item => item.conteudo_id));
          const locais = new Set(catalogo.unidades.map(item => item.localizacao_atual));
          let ordem = Math.max(0, ...catalogo.unidades.map(item => Number(item.ordem) || 0)) + 1;
          for (const [conteudo_id, titulo, localizacao_atual] of specs) {
            if (ids.has(conteudo_id) || locais.has(localizacao_atual)) continue;
            catalogo.unidades.push({
              conteudo_id,
              versao_conteudo: 1,
              titulo,
              area: 'Programação e Desenvolvimento',
              modulo: 'Qualidade e Teste de Software',
              trilha: '',
              ordem: ordem++,
              status: 'ativo',
              localizacao_atual,
              obrigatorio: false,
              texto_busca: ''
            });
          }
          fs.writeFileSync(catalogoPath, JSON.stringify(catalogo, null, 2) + '\n');
          NODE

      - name: Gerar pesquisa e visitas diretas
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs

      - name: Validar integração
        run: |
          node meu-mbb/atualizar-pesquisa.cjs --check
          node meu-mbb/gerar-visitas.cjs --check
          node --test meu-mbb/*.test.cjs

      - name: Consolidar em um único commit útil
        shell: bash
        run: |
          rm .github/workflows/qts-integracao-publica.yml
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add index.html meu-mbb/catalogo.json meu-mbb/visitas-diretas.json .github/workflows/qts-integracao-publica.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "QTS: integrar home, pesquisa e Meu MbB"
          git push origin HEAD:qts-integracao-publica
