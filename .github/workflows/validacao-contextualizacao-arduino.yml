name: Validação contextualização Arduino
on:
  push:
    branches:
      - arduino-contextualizacao-humana-20260911
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar sintaxe JavaScript
        run: |
          node --check js/arduino.js
          node --check js/arduino-fundamentos-mbb.js
          node --check js/arduino-contextualizacao-mbb.js
          node --check js/arduino-programacao-aplicada.js
          node --check js/arduino-conectividade.js
          node --check js/arduino-iot.js
          node --check js/arduino-protocolos.js
          node --check js/arduino-seguranca.js
          node --check js/arduino-projeto-iot.js
      - name: Verificar cobertura e preservação
        run: |
          python - <<'PY'
          from pathlib import Path
          c = Path('js/arduino-contextualizacao-mbb.js').read_text(encoding='utf-8')
          f = Path('js/arduino-fundamentos-mbb.js').read_text(encoding='utf-8')
          a = Path('js/arduino.js').read_text(encoding='utf-8')
          required = [
            'p1','p2','p3','p4','p5','lab1','p6','p7','lab2','p8','lab3','p9','lab4',
            'b5-1','b5-2','b5-3','b5-4',
            'b6-prep','b6-1','b6-2','b6-3','b6-4','b6-5',
            'b7-1','b7-2','b7-3','b7-4',
            'b8-prep','b8-1','b8-2','b8-3','b8-4','b8-5','b8-6','b8-7',
            'b9-prep','b9-1','b9-2',
            'b10-1','b10-2','b10-3','b10-4','b10-5','b10-6','b10-7'
          ]
          missing = [x for x in required if x not in c]
          assert not missing, f'Contextos ausentes: {missing}'
          for term in ['capacitor','indutor','circuito integrado','ATmega328P','datasheet']:
              assert term.lower() in f.lower(), f'Termo ausente em Fundamentos: {term}'
          assert "'#p2'" in a and "'#p1':'fundamentos'" in a
          assert 'arduino-contextualizacao-mbb.js' in a
          print('VALIDACAO_CONTEXTO_ARDUINO_OK')
          PY
      - name: Diff check
        run: git diff --check origin/main...HEAD
