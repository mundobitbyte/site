name: Prática real mDNS e servidor local
on:
  push:
    branches: [pratica-mdns-tunel-mbb-20261028]
    paths: ['materiais/arduino/conectividade/**', 'tests/seiot-rede/**', '.github/workflows/seiot-rede-pratica.yml']
  pull_request:
    paths: ['materiais/arduino/conectividade/**', 'tests/seiot-rede/**', '.github/workflows/seiot-rede-pratica.yml']
permissions:
  contents: read
jobs:
  rede-real:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install zeroconf==0.151.3
      - run: python tests/seiot-rede/real.py
