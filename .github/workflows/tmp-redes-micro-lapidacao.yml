name: tmp-redes-micro-lapidacao

on:
  push:
    branches: [lapidacao-infraestrutura-mbb]

permissions:
  contents: write

jobs:
  lapidar:
    if: ${{ !contains(github.event.head_commit.message, '[redes-m2-microfinal]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
          fetch-depth: 0
      - name: Refinar linguagem sem alterar a lógica
        shell: python
        run: |
          from pathlib import Path
          files=[Path('js/infraestrutura/redes-00-03.js'),Path('js/infraestrutura/redes-04-07.js'),Path('js/infraestrutura/redes-08-10.js'),Path('js/infraestrutura/redes-99.js')]
          repl={
            'mapa/inventário':'mapa e inventário',
            'portas/cabos':'portas e cabos',
            'segmentação/acesso':'segmentação e acesso',
            '<p>estado de rede anexa a configuração de referência ao mapa e inventário.':'<p>O estado de rede registrado passa a integrar o mapa e o inventário.',
            'Evidências (ID, horário e local):':'Evidências relacionadas (horário e local):',
            'atualiza os artefatos e permite continuidade':'atualiza os registros e permite continuidade',
            "objective: 'Investigar falhas controladas usando evidência e os artefatos acumulados, aplicar correção segura quando autorizada e entregar documentação reutilizável.',":"objective: 'Investigar falhas controladas usando evidência e os registros acumulados, aplicar correção segura quando autorizada e entregar documentação reutilizável.',",
          }
          for p in files:
              t=p.read_text(encoding='utf-8')
              for old,new in repl.items(): t=t.replace(old,new)
              p.write_text(t,encoding='utf-8')
      - name: Validar
        run: |
          set -e
          for f in js/infraestrutura/redes-00-03.js js/infraestrutura/redes-04-07.js js/infraestrutura/redes-08-10.js js/infraestrutura/redes-99.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('js/infraestrutura/redes-00-03.js'),Path('js/infraestrutura/redes-04-07.js'),Path('js/infraestrutura/redes-08-10.js'),Path('js/infraestrutura/redes-99.js')]
          txt='\n'.join(p.read_text(encoding='utf-8') for p in files)
          assert txt.count('window.infraestruturaNetworkLessons.push({') == 12
          assert 'RTR-01' in txt and 'RTmapa' not in txt
          assert not re.search(r'(?<![A-Za-z])R-0\d', txt)
          assert '<div class="record-box">' not in txt
          assert 'mapa/inventário' not in txt and 'portas/cabos' not in txt and 'segmentação/acesso' not in txt
          assert 'Evidências (ID, horário e local):' not in txt
          assert not re.search(r'(?i)\b(módulo|capítulo)\b', txt)
          print('Micro-lapidação validada: linguagem natural, RTR-01 íntegro, 12 aulas e sem bastidores/taxonomia R-* isolada.')
          PY
          git diff --check
      - name: Commitar e limpar
        run: |
          rm .github/workflows/tmp-redes-micro-lapidacao.yml
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add js/infraestrutura/redes-00-03.js js/infraestrutura/redes-04-07.js js/infraestrutura/redes-08-10.js js/infraestrutura/redes-99.js .github/workflows/tmp-redes-micro-lapidacao.yml
          git commit -m "Refina linguagem final do Módulo 2 de Redes [redes-m2-microfinal]"
          git push origin HEAD:lapidacao-infraestrutura-mbb
