name: Regenerar índices temporariamente — Análise de Sistemas

on:
  push:
    branches:
      - analise-sistemas-iniciante-mbb-integral
    paths:
      - '.github/workflows/tmp-regenerar-indices-analise.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: analise-sistemas-iniciante-mbb-integral
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerar índices oficiais
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs

      - name: Commitar somente arquivos gerados
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
          else
            git commit -m "Análise de Sistemas: regenerar índices de pesquisa"
            git push origin HEAD:analise-sistemas-iniciante-mbb-integral
          fi
