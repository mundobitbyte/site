name: Compilar práticas temporárias do projeto IoT

on:
  push:
    branches:
      - auditoria-projeto-iot-mbb-20261008
    paths:
      - '.github/workflows/temp-compilar-projeto-iot.yml'

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-projeto-iot-mbb-20261008
      - name: Instalar Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Criar sketches de validação
        run: |
          mkdir -p /tmp/projeto_local /tmp/projeto_final

          cat > /tmp/projeto_local/projeto_local.ino <<'EOF'
          const int LDR = 34;
          const int LED = 23;
          const int LIMIAR = 2000;
          const bool LEITURA_MAIOR_NO_ESCURO = false;

          bool ambienteEscuro(int leitura) {
            if (LEITURA_MAIOR_NO_ESCURO) {
              return leitura > LIMIAR;
            }
            return leitura < LIMIAR;
          }

          void setup() {
            Serial.begin(115200);
            pinMode(LED, OUTPUT);
            digitalWrite(LED, LOW);
          }

          void loop() {
            int luminosidade = analogRead(LDR);
            bool escuro = ambienteEscuro(luminosidade);
            digitalWrite(LED, escuro ? HIGH : LOW);

            Serial.print("Luminosidade: ");
            Serial.print(luminosidade);
            Serial.print(" | Ambiente: ");
            Serial.println(escuro ? "escuro" : "claro");
            delay(500);
          }
          EOF

          cat > /tmp/projeto_final/projeto_final.ino <<'EOF'
          #include <WiFi.h>
          #include <WebServer.h>

          const char* ssid = "NOME_DA_REDE";
          const char* senha = "SENHA_DA_REDE";

          const int LDR = 34;
          const int LED = 23;
          const int LIMIAR = 2000;
          const bool LEITURA_MAIOR_NO_ESCURO = false;
          const unsigned long TEMPO_MAX_WIFI = 10000;

          WebServer servidor(80);

          enum Modo { MANUAL, AUTOMATICO };
          Modo modo = AUTOMATICO;
          bool ledLigado = false;
          bool servidorDisponivel = false;

          bool ambienteEscuro(int leitura) {
            if (LEITURA_MAIOR_NO_ESCURO) {
              return leitura > LIMIAR;
            }
            return leitura < LIMIAR;
          }

          void definirLed(bool estado) {
            ledLigado = estado;
            digitalWrite(LED, estado ? HIGH : LOW);
          }

          void atualizarAutomacao() {
            if (modo != AUTOMATICO) return;
            int luminosidade = analogRead(LDR);
            definirLed(ambienteEscuro(luminosidade));
          }

          String montarPagina() {
            int luminosidade = analogRead(LDR);
            String pagina = "<!DOCTYPE html><html><head>";
            pagina += "<meta charset='utf-8'>";
            pagina += "<meta name='viewport' content='width=device-width,initial-scale=1'>";
            pagina += "<meta http-equiv='refresh' content='2'>";
            pagina += "<title>Ambiente MbB</title>";
            pagina += "<style>body{font-family:Arial;max-width:520px;margin:30px auto;padding:16px}";
            pagina += "a{display:inline-block;margin:6px;padding:12px 16px;background:#07515f;color:white;text-decoration:none;border-radius:8px}";
            pagina += ".painel{padding:16px;border:1px solid #ccc;border-radius:12px}</style>";
            pagina += "</head><body><div class='painel'>";
            pagina += "<h1>Ambiente MbB</h1>";
            pagina += "<p>Luminosidade: " + String(luminosidade) + "</p>";
            pagina += "<p>Iluminacao: " + String(ledLigado ? "LIGADA" : "DESLIGADA") + "</p>";
            pagina += "<p>Modo: " + String(modo == AUTOMATICO ? "AUTOMATICO" : "MANUAL") + "</p>";
            pagina += "<a href='/ligar'>Ligar</a>";
            pagina += "<a href='/desligar'>Desligar</a>";
            pagina += "<a href='/auto'>Automatico</a>";
            pagina += "</div></body></html>";
            return pagina;
          }

          void voltarParaInicio() {
            servidor.sendHeader("Location", "/");
            servidor.send(303, "text/plain", "");
          }

          void configurarServidor() {
            servidor.on("/", []() {
              servidor.send(200, "text/html", montarPagina());
            });

            servidor.on("/ligar", []() {
              modo = MANUAL;
              definirLed(true);
              voltarParaInicio();
            });

            servidor.on("/desligar", []() {
              modo = MANUAL;
              definirLed(false);
              voltarParaInicio();
            });

            servidor.on("/auto", []() {
              modo = AUTOMATICO;
              atualizarAutomacao();
              voltarParaInicio();
            });
          }

          void conectarWiFiSemBloquearParaSempre() {
            WiFi.mode(WIFI_STA);
            WiFi.begin(ssid, senha);

            Serial.print("Conectando ao Wi-Fi");
            unsigned long inicio = millis();

            while (WiFi.status() != WL_CONNECTED &&
                   millis() - inicio < TEMPO_MAX_WIFI) {
              delay(500);
              Serial.print(".");
            }

            Serial.println();

            if (WiFi.status() == WL_CONNECTED) {
              servidor.begin();
              servidorDisponivel = true;
              Serial.print("Abra no navegador: http://");
              Serial.println(WiFi.localIP());
            } else {
              servidorDisponivel = false;
              Serial.println("Wi-Fi indisponivel.");
              Serial.println("A automacao local continuara funcionando.");
            }
          }

          void setup() {
            Serial.begin(115200);
            pinMode(LED, OUTPUT);
            definirLed(false);
            configurarServidor();
            conectarWiFiSemBloquearParaSempre();
          }

          void loop() {
            if (servidorDisponivel && WiFi.status() == WL_CONNECTED) {
              servidor.handleClient();
            }
            atualizarAutomacao();
            delay(20);
          }
          EOF

      - name: Compilar práticas
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/projeto_local
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/projeto_final

      - name: Remover workflow temporário após sucesso
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git rm .github/workflows/temp-compilar-projeto-iot.yml
          git commit -m "chore: concluir compilação do projeto IoT"
          git push origin HEAD:auditoria-projeto-iot-mbb-20261008
