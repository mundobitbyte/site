name: Compilar práticas temporárias do módulo 8

on:
  push:
    branches:
      - auditoria-protocolos-mbb-20261008
    paths:
      - '.github/workflows/temp-compilar-modulo8.yml'

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-protocolos-mbb-20261008
      - name: Instalar Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib update-index
          arduino-cli lib install "LiquidCrystal I2C"
      - name: Criar sketches de validação
        run: |
          mkdir -p /tmp/rtos /tmp/scanner /tmp/lcd
          cat > /tmp/rtos/rtos.ino <<'EOF'
          const int LED = 23;
          void tarefaLed(void *parametro) {
            bool estado = false;
            while (true) {
              estado = !estado;
              digitalWrite(LED, estado);
              vTaskDelay(pdMS_TO_TICKS(1000));
            }
          }
          void tarefaMonitor(void *parametro) {
            while (true) {
              Serial.println("Tarefa Monitor: sistema ativo");
              vTaskDelay(pdMS_TO_TICKS(2000));
            }
          }
          void setup() {
            Serial.begin(115200);
            pinMode(LED, OUTPUT);
            xTaskCreate(tarefaLed, "LED", 2048, NULL, 1, NULL);
            xTaskCreate(tarefaMonitor, "Monitor", 2048, NULL, 1, NULL);
          }
          void loop() {
            vTaskDelay(pdMS_TO_TICKS(1000));
          }
          EOF
          cat > /tmp/scanner/scanner.ino <<'EOF'
          #include <Wire.h>
          void setup() {
            Serial.begin(115200);
            Wire.begin(21, 22);
            Serial.println("Procurando dispositivos I2C...");
            int encontrados = 0;
            for (byte endereco = 1; endereco < 127; endereco++) {
              Wire.beginTransmission(endereco);
              byte erro = Wire.endTransmission();
              if (erro == 0) {
                Serial.print("Dispositivo encontrado em 0x");
                if (endereco < 16) Serial.print("0");
                Serial.println(endereco, HEX);
                encontrados++;
              }
            }
            if (encontrados == 0) Serial.println("Nenhum dispositivo I2C encontrado.");
          }
          void loop() {}
          EOF
          cat > /tmp/lcd/lcd.ino <<'EOF'
          #include <Wire.h>
          #include <LiquidCrystal_I2C.h>
          const byte ENDERECO_LCD = 0x27;
          LiquidCrystal_I2C lcd(ENDERECO_LCD, 16, 2);
          void setup() {
            Wire.begin(21, 22);
            lcd.init();
            lcd.backlight();
            lcd.setCursor(0, 0);
            lcd.print("Ambiente MbB");
            lcd.setCursor(0, 1);
            lcd.print("Sistema ativo");
          }
          void loop() {}
          EOF
      - name: Compilar práticas
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/rtos
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/scanner
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/lcd
      - name: Remover workflow temporário após sucesso
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git rm .github/workflows/temp-compilar-modulo8.yml
          git commit -m "chore: concluir compilação das práticas do módulo 8"
          git push origin HEAD:auditoria-protocolos-mbb-20261008
