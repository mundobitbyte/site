name: Aplicar Banco de Dados Capitulo 6

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/apply-bd-cap6.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
      - name: Reconstruir conteudo do capitulo 6
        shell: bash
        run: |
          cat .mbb-tmp/mod6_0.b64 .mbb-tmp/mod6_1.b64 .mbb-tmp/mod6_2.b64 | base64 -d | xz -dc > /tmp/mod6.html
          cat .mbb-tmp/ex6.b64 | base64 -d | xz -dc > /tmp/ex6.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/bancodedados.html')
          s = p.read_text(encoding='utf-8')
          mod = Path('/tmp/mod6.html').read_text(encoding='utf-8')
          ex = Path('/tmp/ex6.html').read_text(encoding='utf-8')
          card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-cap7')">
          <h3>6 Administração e SGBD</h3>
          <p>Servidor, serviço, clientes, usuários, privilégios, roles, backup, restauração e diagnóstico.</p>
          <span class="exercise-status available">Disponível · 12 exercícios</span>
          </button>'''.replace('\n          ', '\n')

          a = s.index('<section class="module placeholder" id="mod-sgbd">')
          b = s.index('<section class="module placeholder" id="mod-transacoes">', a)
          s = s[:a] + mod + s[b:]

          marker = '<button class="exercise-chapter-card" onclick="openExerciseChapter(\'ex-building-sgbd\')">'
          a = s.index(marker)
          b = s.index('</button>', a) + len('</button>')
          s = s[:a] + card + s[b:]

          a = s.index('<section class="exercise-chapter-view" id="ex-building-sgbd">')
          b = s.index('<section class="exercise-chapter-view" id="ex-building-transacoes">', a)
          s = s[:a] + ex + s[b:]

          assert '<section class="module" id="mod-sgbd">' in s
          assert 'id="ex-cap7"' in s
          assert "openExerciseChapter('ex-cap7')" in s
          assert '6L — Desafio final: operação e recuperação' in s
          assert '<section class="module placeholder" id="mod-sgbd">' not in s
          assert 'id="ex-building-sgbd"' not in s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit final do capitulo 6
        shell: bash
        run: |
          rm -rf .mbb-tmp
          rm -f .github/workflows/apply-bd-cap6.yml
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html .mbb-tmp .github/workflows/apply-bd-cap6.yml
          git commit -m "Desenvolve capitulo 6 Administracao e SGBD"
          git push origin bancodedados-cap6-administracao-sgbd
