name: Fechar Capítulo 0 temporariamente

on:
  push:
    branches:
      - analise-sistemas-capitulo-zero-conversa
    paths:
      - '.github/workflows/tmp-fechar-capitulo-zero.yml'

permissions:
  contents: write

jobs:
  fechar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analise-sistemas-capitulo-zero-conversa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar versão pedagógica e índices
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('js/analise-sistemas.js')
          s = js.read_text()
          old = "{ path:'00-antes-do-sistema.html', title:'Antes do sistema', group:'Descobrir', conteudo_id:'analise-sistemas-00', versao_conteudo:1 }"
          new = "{ path:'00-antes-do-sistema.html', title:'Antes do sistema', group:'Descobrir', conteudo_id:'analise-sistemas-00', versao_conteudo:2 }"
          assert old in s
          js.write_text(s.replace(old, new, 1))

          smoke = Path('tools/analise-sistemas-validacao/smoke.mjs')
          s = smoke.read_text()
          old = 'const expectedVersions=[1,1,1,2,2,2,1,2,2,1,1,1,1,1,1];'
          new = 'const expectedVersions=[2,1,1,2,2,2,1,2,2,1,1,1,1,1,1];'
          assert old in s
          smoke.write_text(s.replace(old, new, 1))
          PY
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs
      - name: Commitar fechamento
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add js/analise-sistemas.js tools/analise-sistemas-validacao/smoke.mjs meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
          else
            git commit -m "Análise de Sistemas: fechar versão pedagógica do Capítulo 0"
            git push origin HEAD:analise-sistemas-capitulo-zero-conversa
          fi
