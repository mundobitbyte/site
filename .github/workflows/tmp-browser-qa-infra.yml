name: tmp-browser-qa-infra
on:
  push:
    branches:
      - lapidacao-infraestrutura-mbb
    paths:
      - .github/workflows/tmp-browser-qa-infra.yml
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
          fetch-depth: 0
      - name: Preparar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Testar área em navegador real
        shell: bash
        run: |
          set -e
          python3 -m http.server 8000 >/tmp/mbb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              ['desktop',{width:1440,height:900}],
              ['mobile',{width:390,height:844}]
            ];
            const starts=[
              ['diagnostico','00. Você consegue investigar antes de mexer?'],
              ['redes-diagnostico','00. Onde a rede começa a falhar?'],
              ['linux-diagnostico','00. O servidor consegue sustentar um serviço?'],
              ['moderna-diagnostico','00. O portal cabe no servidor que já existe?'],
              ['integrador-final','99. Coloque a Feira de Projetos em operação — e entregue o plantão']
            ];
            let failures=[];
            for(const [label,viewport] of cases){
              const context=await browser.newContext({viewport});
              const page=await context.newPage();
              const consoleErrors=[]; const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.goto('http://127.0.0.1:8000/pages/infraestrutura.html',{waitUntil:'networkidle'});
              const portalVisible=await page.locator('#portalView').isVisible();
              if(!portalVisible) failures.push(`${label}: portal não visível`);
              const cards=await page.locator('.module-card.available').count();
              if(cards!==5) failures.push(`${label}: cards=${cards}`);
              for(const [hash,title] of starts){
                await page.goto(`http://127.0.0.1:8000/pages/infraestrutura.html#${hash}`,{waitUntil:'networkidle'});
                const h1=(await page.locator('#lessonTitle').textContent()||'').trim();
                if(h1!==title) failures.push(`${label}/${hash}: título inesperado: ${h1}`);
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                if(overflow>2) failures.push(`${label}/${hash}: overflow horizontal ${overflow}px`);
                const menuBtn=page.locator('#openMenu');
                await menuBtn.click();
                if(!(await page.locator('#lessonMenu').isVisible())) failures.push(`${label}/${hash}: menu não abriu`);
                await page.keyboard.press('Escape');
                if(await page.locator('#lessonMenu').evaluate(el=>el.classList.contains('open'))) failures.push(`${label}/${hash}: Escape não fechou menu`);
              }
              // Quiz: uma resposta qualquer deve gerar feedback, sem erro JS.
              await page.goto('http://127.0.0.1:8000/pages/infraestrutura.html#diagnostico',{waitUntil:'networkidle'});
              const firstQ=page.locator('[data-quiz-question]').first();
              if(await firstQ.count()){
                await firstQ.locator('input[type=radio]').first().check();
                const group=firstQ.locator('xpath=ancestor::*[@data-quiz-group][1]');
                const questions=group.locator('[data-quiz-question]');
                for(let i=1;i<await questions.count();i++) await questions.nth(i).locator('input[type=radio]').first().check();
                await group.locator('[data-check-quiz]').click();
                const result=(await group.locator('[data-quiz-result]').textContent()||'').trim();
                if(!result) failures.push(`${label}: quiz sem feedback`);
              }
              // Checklist do integrador: progresso deve reagir.
              await page.goto('http://127.0.0.1:8000/pages/infraestrutura.html#integrador-final',{waitUntil:'networkidle'});
              const check=page.locator('[data-checklist] input[type=checkbox]').first();
              if(await check.count()){
                await check.check();
                const progress=(await page.locator('[data-check-progress]').first().textContent()||'').trim();
                if(!/^1\//.test(progress)) failures.push(`${label}: checklist não atualizou (${progress})`);
              }
              if(consoleErrors.length) failures.push(`${label}: console errors: ${consoleErrors.join(' | ')}`);
              if(pageErrors.length) failures.push(`${label}: page errors: ${pageErrors.join(' | ')}`);
              await page.screenshot({path:`/tmp/infra-${label}.png`,fullPage:true});
              await context.close();
            }
            await browser.close();
            if(failures.length){console.error('FALHAS_BROWSER'); failures.forEach(x=>console.error(x)); process.exit(1)}
            console.log('BROWSER_QA_OK desktop+mobile, 5 módulos, menu, quiz, checklist, hashes e overflow.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remover workflow temporário
        if: always()
        run: |
          set -e
          git config user.name 'Mundo bit Byte'
          git config user.email 'mundobitbyte@gmail.com'
          git rm .github/workflows/tmp-browser-qa-infra.yml
          git commit -m 'Remove inspeção visual temporária de Infraestrutura'
          git push origin HEAD:lapidacao-infraestrutura-mbb
