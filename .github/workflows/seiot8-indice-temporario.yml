name: SEIoT8 - indice de busca controlado temporario
on:
  push:
    branches: [audit/seiot8-espiral-20261118]
    paths: ['.github/workflows/seiot8-indice-temporario.yml']
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seiot8-espiral-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regenerar e proteger todas as demais unidades
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const path='meu-mbb/catalogo.json';
          const before=JSON.parse(fs.readFileSync(path,'utf8'));
          execFileSync('node',['meu-mbb/atualizar-pesquisa.cjs'],{stdio:'inherit'});
          const after=JSON.parse(fs.readFileSync(path,'utf8'));
          if(before.unidades.length!==after.unidades.length)throw Error('Quantidade de unidades alterada');
          const changed=[];
          for(let i=0;i<before.unidades.length;i++){
            const a=before.unidades[i],b=after.unidades[i];
            if(JSON.stringify(a)!==JSON.stringify(b)){
              if(a.localizacao_atual!==b.localizacao_atual)throw Error('Localizacao alterada');
              const keys=new Set([...Object.keys(a),...Object.keys(b)]);
              for(const key of keys)if(!['texto_busca','topicos_busca'].includes(key)&&JSON.stringify(a[key])!==JSON.stringify(b[key]))throw Error('Campo protegido alterado: '+key);
              changed.push(a.localizacao_atual);
            }
          }
          if(changed.length!==1||changed[0]!=='pages/arduino-protocolos.html')
            throw Error('Fora do escopo do topico 8: '+JSON.stringify(changed));
          console.log('OK: somente a unidade RTOS/Protocolos foi sincronizada.');
          NODE
          node meu-mbb/atualizar-pesquisa.cjs --check
          test "$(git diff --name-only)" = "meu-mbb/catalogo.json"
      - name: Versionar indice na branch de auditoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "chore(seiot8): sincronizar pesquisa do topico RTOS e Protocolos"
          git push origin HEAD:audit/seiot8-espiral-20261118
