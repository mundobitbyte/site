name: Restaurar exercicios aprovados do Capitulo 5

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/restore-bd-cap5-exercises.yml

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
      - name: Restaurar exercicios 5A a 5L
        shell: bash
        run: |
          cat .mbb-tmp/cap5ex.b64 | base64 -d | xz -dc > /tmp/cap5ex.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/bancodedados.html')
          s = p.read_text(encoding='utf-8')
          ex = Path('/tmp/cap5ex.html').read_text(encoding='utf-8')
          card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-cap6')">
          <h3>5 Relacionamentos e JOIN</h3>
          <p>INNER JOIN, LEFT JOIN, RIGHT JOIN, N:N, múltiplas junções, ausências e relatórios.</p>
          <span class="exercise-status available">Disponível · 12 exercícios</span>
          </button>'''.replace('\n          ', '\n')

          marker = '<button class="exercise-chapter-card" onclick="openExerciseChapter(\'ex-building-joins\')">'
          a = s.index(marker)
          b = s.index('</button>', a) + len('</button>')
          s = s[:a] + card + s[b:]

          a = s.index('<section class="exercise-chapter-view" id="ex-building-joins">')
          b = s.index('<section class="exercise-chapter-view" id="ex-cap7">', a)
          s = s[:a] + ex + s[b:]

          assert "openExerciseChapter('ex-cap6')" in s
          assert 'id="ex-cap6"' in s
          assert '5L — Desafio final: relatório comercial' in s
          assert 'id="ex-building-joins"' not in s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit da restauracao
        shell: bash
        run: |
          rm -rf .mbb-tmp
          rm -f .github/workflows/restore-bd-cap5-exercises.yml
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html .mbb-tmp .github/workflows/restore-bd-cap5-exercises.yml
          git commit -m "Restaura exercicios aprovados do capitulo 5"
          git push origin bancodedados-cap6-administracao-sgbd
