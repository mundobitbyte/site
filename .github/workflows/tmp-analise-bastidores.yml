name: Temp lapidar Analise de Sistemas

"on":
  push:
    branches:
      - analise-sistemas-ajuste-link-bastidores

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analise-sistemas-ajuste-link-bastidores
          fetch-depth: 0
      - name: Aplicar correcoes
        run: |
          python tools/tmp-analise-bastidores.py
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git rm .github/workflows/tmp-analise-bastidores.yml tools/tmp-analise-bastidores.py
          git add pages/analise-sistemas tools/analise-sistemas-validacao meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          git commit -m "Análise de Sistemas: corrigir link e remover linguagem de bastidores"
          git push origin HEAD:analise-sistemas-ajuste-link-bastidores
