name: SEIoT6 - regeneracao controlada do indice (temporario)
on:
  push:
    branches:
      - audit/seiot6-mbb-segura-20261118
    paths:
      - '.github/workflows/seiot6-indice-temporario.yml'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seiot6-mbb-segura-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar indice e impedir modificacoes de outras unidades
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const file='meu-mbb/catalogo.json';
          const before=JSON.parse(fs.readFileSync(file,'utf8'));
          execFileSync('node',['meu-mbb/atualizar-pesquisa.cjs'],{stdio:'inherit'});
          const after=JSON.parse(fs.readFileSync(file,'utf8'));
          if(before.unidades.length!==after.unidades.length)throw Error('Quantidade de unidades alterada');
          const changed=[];
          for(let i=0;i<before.unidades.length;i++){
            const a=before.unidades[i],b=after.unidades[i];
            if(JSON.stringify(a)!==JSON.stringify(b)){
              if(a.localizacao_atual!==b.localizacao_atual)throw Error('Localizacao alterada');
              const keys=[...new Set([...Object.keys(a),...Object.keys(b)])];
              if(keys.some(k=>!['texto_busca','topicos_busca'].includes(k)&&JSON.stringify(a[k])!==JSON.stringify(b[k])))
                throw Error('Metadados alterados em '+a.localizacao_atual);
              changed.push(a.localizacao_atual);
            }
          }
          if(changed.length!==1||changed[0]!=='pages/arduino-conectividade.html')
            throw Error('Alteracao fora do escopo seguro: '+JSON.stringify(changed));
          console.log('Conferencia aprovada: somente a unidade Conectividade foi atualizada.');
          NODE
          node meu-mbb/atualizar-pesquisa.cjs --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "meu-mbb/catalogo.json"
      - name: Versionar indice atualizado somente na branch de auditoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "chore(seiot6): sincronizar indice de pesquisa da conectividade"
          git push origin HEAD:audit/seiot6-mbb-segura-20261118
