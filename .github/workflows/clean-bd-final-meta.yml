name: Limpar texto editorial final Banco de Dados

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/clean-bd-final-meta.yml

permissions:
  contents: write

jobs:
  limpar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
      - name: Limpar texto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/bancodedados.html')
          s=p.read_text(encoding='utf-8')
          old='<p>Cada capítulo terá seus próprios exercícios. Os capítulos ainda não desenvolvidos aparecem como <strong>Em construção</strong>.</p>'
          new='<p>Escolha um capítulo abaixo para praticar os conceitos estudados e consolidar o aprendizado.</p>'
          if s.count(old) != 1:
              raise SystemExit('Texto editorial esperado ausente ou duplicado.')
          s=s.replace(old,new,1)
          for bad in ['OFICIALMENTE FINALIZADO','Fechamento Oficial','Modo MbB','Pergunta MbB','MbB:','Em construção','ex-building-','module placeholder']:
              if bad in s:
                  raise SystemExit(f'Residuo editorial/placeholder encontrado: {bad}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar escopo e publicar
        run: |
          changed=$(git status --short | awk '{print $2}' | grep -v '^.github/workflows/clean-bd-final-meta.yml$' || true)
          if [ "$changed" != "pages/bancodedados.html" ]; then echo "Alteracao inesperada: $changed"; exit 1; fi
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html
          git commit -m "Remove ultimo texto de bastidor do modulo Banco de Dados"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd
      - name: Limpar workflow temporario
        run: |
          git rm .github/workflows/clean-bd-final-meta.yml
          git commit -m "Remove workflow temporario de limpeza editorial"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd
