name: Validacao pratica 7.5 - Granja IoT
on:
  pull_request:
    branches: [main]
    paths:
      - 'wokwi/granja-inteligente/**'
      - 'pages/arduino-granja-inteligente.html'
      - 'pages/arduino-iot.html'
      - 'js/arduino-granja-integracao.js'
      - '.github/workflows/seiot-granja-validacao.yml'
      - 'tests/seiot-granja/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise-estatica:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/seiot-granja/validar.mjs

  compilacao-esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Preparar plataforma ESP32
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Instalar bibliotecas usadas
        run: |
          arduino-cli lib install "DHT sensor library for ESPx"
          arduino-cli lib install "MFRC522"
          arduino-cli lib install "UniversalTelegramBot"
          arduino-cli lib install "ArduinoJson"
      - name: Compilar projeto real (modo sem Telegram)
        run: |
          mkdir -p "$RUNNER_TEMP/GranjaInteligente"
          cp wokwi/granja-inteligente/sketch.ino "$RUNNER_TEMP/GranjaInteligente/GranjaInteligente.ino"
          arduino-cli compile --fqbn esp32:esp32:esp32 "$RUNNER_TEMP/GranjaInteligente"
