name: Temporario - atualizar catalogo auditoria TIA

on:
  push:
    branches:
      - tia-controle-versoes-auditoria-final

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tia-controle-versoes-auditoria-final
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar indice
        run: node meu-mbb/atualizar-pesquisa.cjs
      - name: Publicar indice atualizado
        run: |
          if git diff --quiet -- meu-mbb/catalogo.json; then
            echo "Catalogo ja atualizado."
            exit 0
          fi
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add meu-mbb/catalogo.json
          git commit -m "Atualiza indice de pesquisa apos auditoria TIA"
          git push origin HEAD:tia-controle-versoes-auditoria-final
