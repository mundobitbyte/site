name: Validação percurso Ventilador Bluetooth
on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/arduino*.html'
      - 'pages/appinventor.html'
      - 'js/arduino*.js'
      - 'js/appinventor.js'
      - 'js/*ventilador*.js'
      - 'css/ventilador-bluetooth.css'
      - 'downloads/ventilador/**'
      - 'img/arduino/ventilador/**'
      - 'tools/ventilador/**'
      - '.github/workflows/ventilador-validacao.yml'
  push:
    branches: [main]
    paths:
      - 'pages/arduino*.html'
      - 'pages/appinventor.html'
      - 'js/arduino*.js'
      - 'js/appinventor.js'
      - 'js/*ventilador*.js'
      - 'css/ventilador-bluetooth.css'
      - 'downloads/ventilador/**'
      - 'img/arduino/ventilador/**'
      - 'tools/ventilador/**'
      - '.github/workflows/ventilador-validacao.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramenta de teste
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verificar percurso no Chromium sem acesso externo
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mbb-ventilador-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tools/ventilador/smoke-publicacao.mjs
      - name: Guardar capturas da validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventilador-chromium
          path: artifacts/ventilador/
          retention-days: 7
