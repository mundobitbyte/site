name: Temporario - regenerar catalogo TIA

on:
  push:
    branches:
      - tia-controle-versoes-compras-mbb

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tia-controle-versoes-compras-mbb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar indice oficial
        run: node meu-mbb/atualizar-pesquisa.cjs

      - name: Commitar somente se houver mudanca
        shell: bash
        run: |
          if git diff --quiet -- meu-mbb/catalogo.json; then
            echo "Catalogo ja esta atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "Atualiza indice de pesquisa para topico TIA"
          git push origin HEAD:tia-controle-versoes-compras-mbb
