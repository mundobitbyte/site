name: SEIoT9 - sincronizacao de pesquisa restrita (temporario)
on:
  push:
    branches: [audit/seiot9-protecao-20261118]
    paths: ['.github/workflows/seiot9-indice-temporario.yml']
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seiot9-protecao-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Atualizar indice e barrar outras unidades
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const file='meu-mbb/catalogo.json';
          const prev=JSON.parse(fs.readFileSync(file,'utf8'));
          execFileSync('node',['meu-mbb/atualizar-pesquisa.cjs'],{stdio:'inherit'});
          const next=JSON.parse(fs.readFileSync(file,'utf8'));
          if(prev.unidades.length!==next.unidades.length)throw Error('Quantidade de unidades alterada');
          const changed=[];
          for(let i=0;i<prev.unidades.length;i++){
            const a=prev.unidades[i],b=next.unidades[i];
            if(JSON.stringify(a)!==JSON.stringify(b)){
              if(a.localizacao_atual!==b.localizacao_atual)throw Error('Destino mudou');
              for(const key of new Set([...Object.keys(a),...Object.keys(b)])){
                if(!['texto_busca','topicos_busca'].includes(key)&&JSON.stringify(a[key])!==JSON.stringify(b[key]))throw Error('Metadado protegido: '+key);
              }
              changed.push(a.localizacao_atual);
            }
          }
          if(changed.length!==1||changed[0]!=='pages/arduino-seguranca.html')throw Error('Fora do escopo 9: '+JSON.stringify(changed));
          console.log('OK: somente indice de Protecao e Seguranca atualizado.');
          NODE
          node meu-mbb/atualizar-pesquisa.cjs --check
          test "$(git diff --name-only)" = "meu-mbb/catalogo.json"
      - name: Registrar apenas indice na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "chore(seiot9): atualizar busca da unidade Protecao e Seguranca"
          git push origin HEAD:audit/seiot9-protecao-20261118
