name: Restaurar corpo aprovado do Capitulo 5

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/restore-bd-cap5-body.yml

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd

      - name: Restaurar somente o Capitulo 5 e validar congelamento
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          page = Path('pages/bancodedados.html')
          s = page.read_text(encoding='utf-8')
          cap5 = Path('.mbb-tmp/cap5-body-approved.html').read_text(encoding='utf-8')

          old_start = '<section class="module placeholder" id="mod-joins">'
          cap6_start = '<section class="module" id="mod-sgbd">'

          assert old_start in s, 'Placeholder do Capitulo 5 nao encontrado'
          assert cap6_start in s, 'Inicio do Capitulo 6 nao encontrado'
          assert cap5.startswith('<section class="module" id="mod-joins">')
          assert 'CAPÍTULO 5 — RELACIONAMENTOS E JOIN OFICIALMENTE FINALIZADO' in cap5

          a = s.index(old_start)
          b = s.index(cap6_start, a)

          prefix = s[:a]
          suffix = s[b:]
          prefix_hash = hashlib.sha256(prefix.encode()).hexdigest()
          suffix_hash = hashlib.sha256(suffix.encode()).hexdigest()

          novo = prefix + cap5 + suffix

          # Provas de preservacao: nada antes do Capitulo 5 e nada a partir do 6 pode mudar.
          na = novo.index('<section class="module" id="mod-joins">')
          nb = novo.index(cap6_start, na)
          assert hashlib.sha256(novo[:na].encode()).hexdigest() == prefix_hash
          assert hashlib.sha256(novo[nb:].encode()).hexdigest() == suffix_hash

          # Conteudo e navegacao esperados.
          assert old_start not in novo
          assert novo.count('id="mod-joins"') == 1
          assert 'BLOCO 16 — Fechamento do Capítulo' in novo[na:nb]
          assert 'id="mod-sgbd"' in novo[nb:]
          assert 'CAPÍTULO 6 — ADMINISTRAÇÃO E SGBD OFICIALMENTE FINALIZADO' in novo[nb:]
          assert 'CAPÍTULO 7 — TRANSAÇÕES E ACID OFICIALMENTE FINALIZADO' in novo[nb:]

          # Exercicios existentes ficam no sufixo e, portanto, byte a byte intactos.
          for marker in ['5A — Relacionamento ou JOIN?', '5L — Desafio final: relatório comercial',
                         '6A — Banco, servidor ou ferramenta?', '6L — Desafio final: operação e recuperação',
                         '7A — O que precisa ser uma transação?', '7L — Desafio final: operação confiável']:
              assert marker in novo[nb:], marker

          ids = re.findall(r'\bid="([^"]+)"', novo)
          dup = sorted({i for i in ids if ids.count(i) > 1})
          assert not dup, f'IDs duplicados: {dup}'

          page.write_text(novo, encoding='utf-8')
          print('OK: Capitulo 5 restaurado')
          print('OK: Início e Capitulos 1-4 intactos por hash')
          print('OK: Capitulos 6-7 e todos os exercicios existentes intactos por hash')
          PY

      - name: Limpar temporarios e publicar
        shell: bash
        run: |
          rm -f .mbb-tmp/cap5-body-approved.html
          rmdir .mbb-tmp 2>/dev/null || true
          rm -f .github/workflows/restore-bd-cap5-body.yml
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html .mbb-tmp .github/workflows/restore-bd-cap5-body.yml
          git commit -m "Restaura corpo aprovado do capitulo 5 sem alterar demais conteudos"
          git push origin bancodedados-cap6-administracao-sgbd
