name: Aplicar Banco de Dados Capitulo 7

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/apply-bd-cap7.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
      - name: Aplicar capitulo 7 e proteger capitulos anteriores
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('pages/bancodedados.html')
          s = p.read_text(encoding='utf-8')
          cap7 = Path('.mbb-tmp/cap7.html').read_text(encoding='utf-8')
          ex7 = Path('.mbb-tmp/cap7-exercicios.html').read_text(encoding='utf-8')

          cap_marker = '<section class="module placeholder" id="mod-transacoes">'
          next_cap = '<section class="module placeholder" id="mod-avancado">'
          card_marker = '<button class="exercise-chapter-card" onclick="openExerciseChapter(\'ex-building-transacoes\')">'
          ex_marker = '<section class="exercise-chapter-view" id="ex-building-transacoes">'
          next_ex = '<section class="exercise-chapter-view" id="ex-building-avancado">'

          # Congelamento explícito: conteúdo principal até o início do capítulo 7.
          frozen_main = s[:s.index(cap_marker)]
          frozen_main_hash = hashlib.sha256(frozen_main.encode()).hexdigest()

          # Congelamento dos cartões anteriores e exercícios dos capítulos Início a 5.
          menu_start = s.index('<div class="exercise-menu-grid">')
          frozen_menu = s[menu_start:s.index(card_marker)]
          frozen_menu_hash = hashlib.sha256(frozen_menu.encode()).hexdigest()
          ex1 = s.index('<section class="exercise-chapter-view" id="ex-cap1">')
          ex6_end = s.index('<section class="exercise-chapter-view" id="ex-cap7">')
          frozen_ex = s[ex1:ex6_end]
          frozen_ex_hash = hashlib.sha256(frozen_ex.encode()).hexdigest()

          # Substitui somente o placeholder do capítulo 7.
          a = s.index(cap_marker)
          b = s.index(next_cap, a)
          s = s[:a] + cap7 + s[b:]

          # Atualiza somente o cartão do capítulo 7 em Exercícios 99.
          card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-cap8')">
          <h3>7 Transações e ACID</h3>
          <p>COMMIT, ROLLBACK, SAVEPOINT, ACID, concorrência, isolamento, bloqueios e deadlocks.</p>
          <span class="exercise-status available">Disponível · 12 exercícios</span>
          </button>'''.replace('\n          ', '\n')
          a = s.index(card_marker)
          b = s.index('</button>', a) + len('</button>')
          s = s[:a] + card + s[b:]

          # Substitui somente a tela de exercícios do capítulo 7.
          a = s.index(ex_marker)
          b = s.index(next_ex, a)
          s = s[:a] + ex7 + s[b:]

          # Prova que capítulos anteriores não mudaram.
          new_main = s[:s.index('<section class="module" id="mod-transacoes">')]
          assert hashlib.sha256(new_main.encode()).hexdigest() == frozen_main_hash
          new_menu_start = s.index('<div class="exercise-menu-grid">')
          new_menu = s[new_menu_start:s.index("<button class=\"exercise-chapter-card\" onclick=\"openExerciseChapter('ex-cap8')\">")]
          assert hashlib.sha256(new_menu.encode()).hexdigest() == frozen_menu_hash
          new_ex1 = s.index('<section class="exercise-chapter-view" id="ex-cap1">')
          new_ex6_end = s.index('<section class="exercise-chapter-view" id="ex-cap7">')
          assert hashlib.sha256(s[new_ex1:new_ex6_end].encode()).hexdigest() == frozen_ex_hash

          # Validações do novo capítulo.
          assert 'id="mod-transacoes"' in s
          assert 'CAPÍTULO 7 — TRANSAÇÕES E ACID OFICIALMENTE FINALIZADO' in s
          assert 'id="ex-cap8"' in s
          assert '7L — Desafio final: operação confiável' in s
          assert 'id="ex-building-transacoes"' not in s
          assert "openExerciseChapter('ex-building-transacoes')" not in s

          ids = re.findall(r'\bid="([^"]+)"', s)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          assert not duplicates, f'IDs duplicados: {duplicates}'

          p.write_text(s, encoding='utf-8')
          print('Congelamento capítulos 1-5: OK')
          print('Capítulo 7: 21 blocos; exercícios 7A-7L: OK')
          PY
      - name: Limpar temporarios e publicar
        shell: bash
        run: |
          rm -rf .mbb-tmp
          rm -f .github/workflows/apply-bd-cap7.yml
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html .mbb-tmp .github/workflows/apply-bd-cap7.yml
          git commit -m "Desenvolve capitulo 7 Transacoes e ACID"
          git push origin bancodedados-cap6-administracao-sgbd
