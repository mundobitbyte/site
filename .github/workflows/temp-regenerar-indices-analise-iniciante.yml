name: Temporário - regenerar índices Análise iniciante

on:
  push:
    branches:
      - analise-sistemas-iniciante-mbb-integral
    paths:
      - .github/workflows/temp-regenerar-indices-analise-iniciante.yml

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: analise-sistemas-iniciante-mbb-integral
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerar índices oficiais
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs
      - name: Persistir somente índices gerados
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if git diff --cached --quiet; then
            echo "Índices já estavam atualizados."
            exit 0
          fi
          git commit -m "Análise de Sistemas: regenerar índices após revisão pedagógica"
          git push origin HEAD:analise-sistemas-iniciante-mbb-integral
