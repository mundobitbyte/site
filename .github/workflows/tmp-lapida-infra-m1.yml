name: tmp-lapida-infra-m1

on:
  push:
    branches:
      - lapidacao-infraestrutura-mbb

permissions:
  contents: write

jobs:
  lapidar:
    if: ${{ !contains(github.event.head_commit.message, '[infra-m1-lapidado]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
          fetch-depth: 0

      - name: Lapidar Módulo 1
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('js/infraestrutura/conteudo-00-03.js'),
              Path('js/infraestrutura/conteudo-04-06.js'),
              Path('js/infraestrutura/conteudo-07-10.js'),
              Path('js/infraestrutura/conteudo-99.js'),
          ]

          replacements = {
              'O resultado não é nota. Ele indica quais decisões precisam de mais atenção durante o módulo.':
                  'O resultado não é nota. Ele mostra quais decisões ainda precisam de mais atenção nos próximos atendimentos.',
              'Ao final do módulo, refaça o diagnóstico e compare <em>como</em> você decidiu, não apenas quantos itens acertou.':
                  'No fechamento, refaça o diagnóstico e compare <em>como</em> você decidiu, não apenas quantos itens acertou.',
              '— sem antecipar o módulo de redes.':
                  '— sem concluir além da evidência disponível.',
              '<strong>Limite absoluto deste módulo</strong>':
                  '<strong>Limite absoluto de segurança</strong>',
              'Para a estação deste módulo, a plataforma principal é o <strong>Windows 11</strong>.':
                  'Para a nova instalação da <strong>SEC-02</strong>, a plataforma principal é o <strong>Windows 11</strong>.',
              '<h3>Aplicar: um chamado que permite continuidade</h3>':
                  '<h3>Aplicar: manter um registro que ajuda a próxima decisão</h3>',
              '<textarea id="ticket-template" class="report-template" aria-label="Modelo de registro de chamado" readonly>CHAMADO:':
                  '<textarea id="ticket-template" class="report-template" aria-label="Modelo de registro de chamado" readonly>REGISTRO DE SUPORTE — SEC-02\nCHAMADO:',
              '</textarea>\n    <p><button class="action-button" type="button" data-copy-template="#ticket-template">Copiar modelo</button>':
                  '</textarea>\n    <p class="microcopy"><strong>Um registro, várias decisões.</strong> Continue neste mesmo registro enquanto o caso evolui. Acrescente somente fatos, evidências, mudanças e decisões que ajudem a próxima pessoa a continuar o atendimento.</p>\n    <p><button class="action-button" type="button" data-copy-template="#ticket-template">Copiar modelo</button>',
              '<h3>Pacote de evidências obrigatório</h3>':
                  '<h3>Evidências que sustentam o atendimento</h3>',
              'Não basta contar o que ocorreu. Entregue evidências identificadas e relacionadas ao chamado, sem expor dados pessoais, senhas ou chaves.':
                  'Não basta contar o que ocorreu. Guarde apenas evidências que sustentem uma decisão, uma comparação ou o estado entregue, sem expor dados pessoais, senhas ou chaves.',
              '<div class="note-box compact"><strong>Continue o trabalho; não comece do zero.</strong><p>Reutilize o modelo de chamado do capítulo 01, o inventário do 02, o baseline do 06, a matriz de acesso do 07, a linha do tempo de evidências do 08 e o registro de manutenção/restauração do 09. O professor pode ocultar uma informação ou introduzir uma falha controlada; peça o que falta e registre o limite.</p></div>':
                  '<div class="note-box compact"><strong>Continue o trabalho; não comece do zero.</strong><p>Use o histórico recebido: chamado, inventário, baseline, acessos, linha do tempo e registros de manutenção/restauração. Se faltar uma informação, peça ou observe antes de agir e registre o limite da conclusão.</p></div>',
              '<div class="note-box compact"><strong>Evidência sem vínculo vira anexo decorativo.</strong><p>No relatório, cite o identificador: “A hipótese H1 ganhou força porque E-04 mostrou...”. Se uma tela não ajuda a decidir ou provar um estado, ela não precisa ser incluída.</p></div>':
                  '<div class="note-box compact"><strong>Evidência sem vínculo vira anexo decorativo.</strong><p>No relatório, ligue a evidência diretamente à decisão: “A hipótese H1 ganhou força porque o teste antes/depois mostrou...”. Se uma tela não ajuda a decidir ou provar um estado, ela não precisa ser incluída.</p></div>',
              '<div class="essence"><strong>Essência do Módulo 1</strong>':
                  '<div class="essence"><strong>Essência do trabalho de suporte</strong>',
              '<div class="bridge-box"><strong>Limite desta fase</strong><p>O Módulo 1 termina aqui. Conectividade apareceu apenas como função a validar ou limite de encaminhamento. A configuração e o diagnóstico de redes pertencem ao próximo módulo e não foram iniciados.</p></div>':
                  '<div class="bridge-box"><strong>O próximo problema nasce da própria operação</strong><p>A estação agora pode ser identificada, mantida e recuperada com método. Quando ela depende de impressoras, servidores, Wi-Fi e outros computadores, o diagnóstico precisa seguir o caminho da comunicação sem abandonar as mesmas regras: observar, testar, interpretar e só então alterar.</p></div>',
              'Resultado observado / evidência (ID):':
                  'Resultado observado / evidência relacionada:',
              'Comparação antes/depois (IDs das evidências):':
                  'Comparação antes/depois (evidências relacionadas):',
          }

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text

              for old, new in replacements.items():
                  text = text.replace(old, new)

              # A documentação continua existindo, mas deixa de dominar visualmente a aula.
              text = text.replace('<div class="record-box">', '<div class="note-box compact">')

              # Retira códigos de evidência da oficina final; o aluno deve lembrar a evidência, não uma taxonomia do curso.
              if path.name == 'conteudo-99.js':
                  text = re.sub(r'<strong>E-0([1-6]) · ', '<strong>', text)

              # O teste de restauração deve ser lembrado pela ação, não por três códigos paralelos.
              if path.name == 'conteudo-07-10.js':
                  text = text.replace('<small class="evidence-id">AMOSTRA B-01</small>', '<small class="evidence-id">AMOSTRA REGISTRADA</small>')
                  text = text.replace('<small class="evidence-id">TESTE R-01</small>', '<small class="evidence-id">ALTERAÇÃO CONTROLADA</small>')
                  text = text.replace('<small class="evidence-id">EVIDÊNCIA R-01</small>', '<small class="evidence-id">RESTAURAÇÃO CONFERIDA</small>')

              # Frases curriculares que quebram a imersão do aluno.
              text = text.replace('Redes virtuais e snapshots serão aprofundados no Módulo 4.', 'A rede virtual e o snapshot serão usados aqui apenas no necessário para manter o laboratório isolado e recuperável.')
              text = text.replace('sem antecipar o módulo de redes', 'sem atribuir à estação uma causa que ainda não foi testada')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Arquivos alterados:')
          for p in changed:
              print(' -', p)

          # Auditoria editorial final do piloto.
          print('\nOcorrências remanescentes de "módulo" no M1:')
          for path in files:
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'módulo' in line.lower():
                      print(f'{path}:{n}: {line.strip()}')

      - name: Validar JavaScript e estrutura
        run: |
          set -e
          for f in js/infraestrutura/conteudo-00-03.js js/infraestrutura/conteudo-04-06.js js/infraestrutura/conteudo-07-10.js js/infraestrutura/conteudo-99.js; do
            node --check "$f"
          done
          python - <<'PY'
          from pathlib import Path
          files=[Path('js/infraestrutura/conteudo-00-03.js'),Path('js/infraestrutura/conteudo-04-06.js'),Path('js/infraestrutura/conteudo-07-10.js'),Path('js/infraestrutura/conteudo-99.js')]
          txt='\n'.join(p.read_text(encoding='utf-8') for p in files)
          assert txt.count('window.infraestruturaLessons.push({') == 12, 'Quantidade de aulas do M1 mudou'
          assert '<div class="record-box">' not in txt, 'record-box ainda protagoniza documentação'
          assert 'E-01 ·' not in txt and 'E-06 ·' not in txt, 'taxonomia E-* ainda presente na oficina'
          assert 'O Módulo 1 termina aqui' not in txt, 'bastidor curricular ainda presente'
          print('Validação MbB: 12 aulas, sintaxe OK, documentação despriorizada e bastidor principal removido.')
          PY
          git diff --check

      - name: Commitar lapidação e remover workflow temporário
        run: |
          set -e
          rm .github/workflows/tmp-lapida-infra-m1.yml
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add js/infraestrutura/conteudo-00-03.js js/infraestrutura/conteudo-04-06.js js/infraestrutura/conteudo-07-10.js js/infraestrutura/conteudo-99.js .github/workflows/tmp-lapida-infra-m1.yml
          git commit -m "Lapida Módulo 1 de Infraestrutura no padrão MbB [infra-m1-lapidado]"
          git push origin HEAD:lapidacao-infraestrutura-mbb
