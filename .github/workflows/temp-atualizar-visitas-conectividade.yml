name: Atualizar visitas temporário Conectividade

on:
  push:
    branches:
      - auditoria-conectividade-mbb-20261008
    paths:
      - '.github/workflows/temp-atualizar-visitas-conectividade.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-conectividade-mbb-20261008
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar visitas diretas
        run: node meu-mbb/gerar-visitas.cjs
      - name: Salvar índice e remover workflow temporário
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "mundobitbyte@gmail.com"
          git add meu-mbb/visitas-diretas.json
          git rm .github/workflows/temp-atualizar-visitas-conectividade.yml
          git commit -m "MbB: atualizar visitas diretas após auditoria de Conectividade"
          git push origin HEAD:auditoria-conectividade-mbb-20261008
