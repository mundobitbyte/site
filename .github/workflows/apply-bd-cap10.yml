name: Aplicar Banco de Dados Capitulo 10

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/apply-bd-cap10.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
          fetch-depth: 0

      - name: Aplicar Capitulo 10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('pages/bancodedados.html')
          text = page.read_text(encoding='utf-8')
          body = Path('tmp/bd_cap10_body.html').read_text(encoding='utf-8').strip()
          exercises = Path('tmp/bd_cap10_exercises.html').read_text(encoding='utf-8').strip()

          old_chapter = '''<section class="module placeholder" id="mod-moderna"><section class="hero"><span class="kicker">Capítulo 10</span><h2>Visão Moderna</h2><p>NoSQL, bancos em nuvem, APIs, Big Data, IA e critérios para escolher tecnologias de dados.</p></section>
          </section>'''
          if text.count(old_chapter) != 1:
              raise SystemExit('Placeholder do Capitulo 10 ausente ou duplicado.')
          text = text.replace(old_chapter, body, 1)

          old_card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-building-moderna')">
          <h3>10 Visão Moderna</h3>
          <p>NoSQL, cloud, APIs, Big Data, IA e tendências de mercado.</p>
          <span class="exercise-status building">🟠 Em construção</span>
          </button>'''
          new_card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-cap11')">
          <h3>10 Visão Moderna</h3>
          <p>NoSQL, nuvem, escala, APIs, analytics, Big Data, IA e decisão arquitetural.</p>
          <span class="exercise-status available">Disponível · 12 exercícios</span>
          </button>'''
          if text.count(old_card) != 1:
              raise SystemExit('Cartao do Capitulo 10 ausente ou duplicado.')
          text = text.replace(old_card, new_card, 1)

          old_view = '''<section class="exercise-chapter-view" id="ex-building-moderna">
          <div class="exercise-inner-card">
          <button class="exercise-back inside-card" onclick="backToExerciseHome()">← Voltar aos capítulos</button><section class="card note"><div class="card-body"><h3>🟠 Em construção</h3><p>Os exercícios deste capítulo serão adicionados quando o conteúdo estiver pronto.</p></div></section>
          </div>
          </section>'''
          if text.count(old_view) != 1:
              raise SystemExit('Area de exercicios do Capitulo 10 ausente ou duplicada.')
          text = text.replace(old_view, exercises, 1)

          forbidden = [
              'OFICIALMENTE FINALIZADO',
              'Fechamento Oficial',
              'Modo MbB',
              'Pergunta MbB',
              'MbB:',
              '🟠 Em construção',
              'ex-building-'
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Texto ou marcador de bastidor permaneceu: {item}')

          required = [
              'id="mod-moderna"',
              'BLOCO 24 — Fechamento do módulo',
              'NoSQL é uma família',
              'atributos JSON',
              'Réplica não é backup',
              'RAG — Retrieval-Augmented Generation',
              'id="ex-cap11"',
              '10A — Relacional ainda faz sentido?',
              '10L — Desafio final: decisão consciente'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Conteudo esperado ausente: {item}')

          module_ids = ['mod-inicio','mod-fundamentos','mod-modelagem','mod-modelagem-logica','mod-sql','mod-joins','mod-sgbd','mod-transacoes','mod-avancado','mod-projetos','mod-moderna','mod-exercicios']
          for module_id in module_ids:
              if text.count(f'id="{module_id}"') != 1:
                  raise SystemExit(f'Modulo ausente ou duplicado: {module_id}')

          for label in ['10A','10B','10C','10D','10E','10F','10G','10H','10I','10J','10K','10L']:
              if text.count(f'<summary>{label} —') != 1:
                  raise SystemExit(f'Exercicio {label} ausente ou duplicado')

          # Todos os alvos da navegacao principal devem ter modulo correspondente.
          targets = re.findall(r'data-target="([^"]+)"', text)
          for target in targets:
              if f'id="mod-{target}"' not in text:
                  raise SystemExit(f'Alvo de navegacao sem modulo: {target}')

          # IDs HTML nao podem se repetir.
          ids = re.findall(r'\sid="([^"]+)"', text)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              raise SystemExit(f'IDs duplicados: {duplicates}')

          page.write_text(text, encoding='utf-8')
          PY

      - name: Confirmar escopo
        run: |
          git status --short
          changed=$(git status --short | awk '{print $2}' | grep -v '^tmp/' | grep -v '^.github/workflows/apply-bd-cap10.yml$' || true)
          if [ "$changed" != "pages/bancodedados.html" ]; then
            echo "Alteracao inesperada: $changed"
            exit 1
          fi

      - name: Commitar pagina
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html
          git commit -m "Desenvolve capitulo 10 Visao Moderna"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd

      - name: Remover arquivos temporarios
        run: |
          git rm tmp/bd_cap10_body.html tmp/bd_cap10_exercises.html .github/workflows/apply-bd-cap10.yml
          git commit -m "Remove arquivos temporarios do capitulo 10"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd
