name: SEIoT Integral - sincronizar pesquisa restrita (temporario)
on:
  push:
    branches: [audit/seiot-1a10-integral-20261118]
    paths: ['.github/workflows/seiot-integral-indice-temporario.yml']
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seiot-1a10-integral-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regerar indice com escopo exclusivo de fundamentos Arduino
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const path='meu-mbb/catalogo.json';
          const a=JSON.parse(fs.readFileSync(path,'utf8'));
          execFileSync('node',['meu-mbb/atualizar-pesquisa.cjs'],{stdio:'inherit'});
          const b=JSON.parse(fs.readFileSync(path,'utf8'));
          if(a.unidades.length!==b.unidades.length)throw Error('Quantidade de unidades alterada');
          const changes=[];
          for(let i=0;i<a.unidades.length;i++){
            const x=a.unidades[i],y=b.unidades[i];
            if(JSON.stringify(x)!==JSON.stringify(y)){
              if(x.localizacao_atual!==y.localizacao_atual)throw Error('Localização alterada');
              for(const k of new Set([...Object.keys(x),...Object.keys(y)]))if(!['texto_busca','topicos_busca'].includes(k)&&JSON.stringify(x[k])!==JSON.stringify(y[k]))throw Error('Metadado não pesquisável alterado: '+k);
              changes.push(x.localizacao_atual);
            }
          }
          if(changes.length!==1||changes[0]!=='pages/arduino.html')throw Error('Alterações inesperadas: '+JSON.stringify(changes));
          console.log('OK: somente campos pesquisáveis da página Arduino alterados.');
          NODE
          node meu-mbb/atualizar-pesquisa.cjs --check
          test "$(git diff --name-only)" = "meu-mbb/catalogo.json"
      - name: Registrar a alteração somente na branch de auditoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json
          git commit -m "chore(seiot): sincronizar pesquisa após numeração dos projetos"
          git push origin HEAD:audit/seiot-1a10-integral-20261118
