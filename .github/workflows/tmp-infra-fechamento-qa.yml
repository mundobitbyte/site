name: tmp-infra-fechamento-qa
on:
  push:
    branches:
      - lapidacao-infraestrutura-mbb
    paths:
      - .github/workflows/tmp-infra-fechamento-qa.yml
permissions:
  contents: write
jobs:
  fechar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lapidacao-infraestrutura-mbb
          fetch-depth: 0
      - name: Micro-lapidar fluência e regra diagnóstica
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/infraestrutura/redes-99.js'); t=p.read_text(encoding='utf-8')
          repl={
            'mapa e inventário e portas e cabos corrigidos, com lacunas marcadas':'mapa, inventário, portas e cabos corrigidos, com lacunas marcadas',
            'Mapa/inventário e portas e cabos:':'Mapa, inventário, portas e cabos:',
            'Serviços, segmentação e acesso e Wi-Fi:':'Serviços, segmentação, acessos e Wi-Fi:',
            'mapa/baseline/matriz':'mapa, baseline e matriz',
          }
          for a,b in repl.items(): t=t.replace(a,b)
          p.write_text(t,encoding='utf-8')
          p=Path('INFRAESTRUTURA_MBB_MAPA_E_CRITERIOS.md'); t=p.read_text(encoding='utf-8')
          old='**Sintoma → contexto → hipótese → teste seguro → evidência → isolamento → correção → validação → documentação.**'
          new='**Sintoma → contexto → hipótese → teste seguro → evidência → redução de hipóteses → correção ou encaminhamento → validação → documentação.**'
          if old not in t: raise SystemExit('Cadeia diagnóstica canônica não encontrada')
          p.write_text(t.replace(old,new),encoding='utf-8')
      - name: Validar texto e JavaScript
        run: |
          set -e
          node --check js/infraestrutura/redes-99.js
          ! grep -Fq 'mapa e inventário e portas e cabos' js/infraestrutura/redes-99.js
          ! grep -Fq 'segmentação e acesso e Wi-Fi' js/infraestrutura/redes-99.js
          grep -Fq 'redução de hipóteses → correção ou encaminhamento' INFRAESTRUTURA_MBB_MAPA_E_CRITERIOS.md
          git diff --check
      - name: Preparar Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Confirmar lazy loading e interação em mobile/desktop
        run: |
          set -e
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          P=$!
          trap 'kill $P || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const expected={
              diagnostico:'00. Você consegue investigar antes de mexer?',
              'redes-diagnostico':'00. “A rede caiu” ainda não é um diagnóstico',
              'linux-diagnostico':'00. O que precisa deixar de depender de improviso?',
              'moderna-diagnostico':'00. O portal cabe no servidor que já existe?',
              'integrador-final':'99. Coloque a Feira de Projetos em operação — e entregue o plantão'
            };
            let fail=[];
            for(const [label,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){
              const ctx=await browser.newContext({viewport}); const page=await ctx.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              for(const [hash,title] of Object.entries(expected)){
                await page.goto(`http://127.0.0.1:8000/pages/infraestrutura.html#${hash}`,{waitUntil:'networkidle'});
                const got=(await page.locator('#lessonTitle').textContent()||'').trim(); if(got!==title)fail.push(`${label}/${hash}: ${got}`);
                const over=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); if(over>2)fail.push(`${label}/${hash}: overflow ${over}`);
              }
              await page.goto('http://127.0.0.1:8000/pages/infraestrutura.html#componentes-compatibilidade',{waitUntil:'networkidle'});
              const imgs=page.locator('.object-card img');
              if(await imgs.count()<3)fail.push(`${label}: poucas imagens`);
              for(let i=0;i<await imgs.count();i++){
                await imgs.nth(i).scrollIntoViewIfNeeded();
                await page.waitForTimeout(200);
                if(!(await imgs.nth(i).evaluate(img=>img.complete&&img.naturalWidth>0))) fail.push(`${label}: imagem ${i} não carregou após entrar na viewport`);
              }
              await page.goto('http://127.0.0.1:8000/pages/infraestrutura.html#integrador-final',{waitUntil:'networkidle'});
              const c=page.locator('[data-checklist] input').first(); await c.check();
              const prog=(await page.locator('[data-check-progress]').first().textContent()||'').trim(); if(!/^1\//.test(prog))fail.push(`${label}: checklist ${prog}`);
              if(errors.length)fail.push(`${label}: erros ${errors.join(' | ')}`);
              await ctx.close();
            }
            await browser.close();
            if(fail.length){console.error(fail.join('\n'));process.exit(1)}
            console.log('QA_BROWSER_FINAL_OK — lazy loading confirmado após scroll, sem overflow/erros, hashes e checklist válidos.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Gravar correção e remover workflow temporário
        if: success()
        run: |
          set -e
          git config user.name 'Mundo bit Byte'
          git config user.email 'mundobitbyte@gmail.com'
          git rm .github/workflows/tmp-infra-fechamento-qa.yml
          git add js/infraestrutura/redes-99.js INFRAESTRUTURA_MBB_MAPA_E_CRITERIOS.md
          git commit -m 'Refina achados da inspeção visual final de Infraestrutura [infra-qa-final]'
          git push origin HEAD:lapidacao-infraestrutura-mbb
      - name: Remover workflow se QA falhar
        if: failure()
        run: |
          git config user.name 'Mundo bit Byte'
          git config user.email 'mundobitbyte@gmail.com'
          git rm .github/workflows/tmp-infra-fechamento-qa.yml
          git commit -m 'Remove QA temporário de fechamento de Infraestrutura'
          git push origin HEAD:lapidacao-infraestrutura-mbb
