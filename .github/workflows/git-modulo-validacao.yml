name: Validação módulo Git

on:
  push:
    branches:
      - main
      - git-fechamento-arquitetura-mbb-20260923
    paths:
      - 'pages/git.html'
      - 'js/git*.js'
      - 'css/git*.css'
      - 'assets/git-github-checkpoint-comandos.txt'
      - 'tools/git-modulo-validacao/**'
      - '.github/workflows/git-modulo-validacao.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pages/git.html'
      - 'js/git*.js'
      - 'css/git*.css'
      - 'assets/git-github-checkpoint-comandos.txt'
      - 'tools/git-modulo-validacao/**'
      - '.github/workflows/git-modulo-validacao.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser validation tool
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Validate module in real Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mbb-git-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tools/git-modulo-validacao/smoke.mjs

      - name: Preserve pilot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meu-mbb-piloto-screenshots
          path: artifacts/meu-mbb/*.png
          if-no-files-found: ignore
