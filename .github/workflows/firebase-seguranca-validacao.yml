name: Validação segurança Firebase

on:
  pull_request:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'academia/tests/firestore-rules.test.cjs'
      - 'meu-mbb/firestore.rules'
      - 'firebase.meu-mbb.json'
      - 'meu-mbb/firestore-rules.test.cjs'
      - '.github/workflows/firebase-seguranca-validacao.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'academia/tests/firestore-rules.test.cjs'
      - 'meu-mbb/firestore.rules'
      - 'firebase.meu-mbb.json'
      - 'meu-mbb/firestore-rules.test.cjs'
      - '.github/workflows/firebase-seguranca-validacao.yml'

permissions:
  contents: read

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar ferramentas de teste
        run: npm install --no-save --no-package-lock firebase@12.19.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2

      - name: Validar regras da Academia
        run: npx firebase emulators:exec --config firebase.json --only firestore --project demo-mbb-academia "node --test academia/tests/firestore-rules.test.cjs"

      - name: Validar regras do Meu MbB
        run: npx firebase emulators:exec --config firebase.meu-mbb.json --only firestore --project demo-mbb-meu "node --test meu-mbb/firestore-rules.test.cjs"
