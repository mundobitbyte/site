name: Atualizar índices MbB somente na branch de recuperação
on:
  push:
    branches:
      - fix/seiot6-recuperacao-integral-preservacao-20261117
    paths:
      - pages/arduino-conectividade.html
      - js/arduino-conectividade.js
      - .github/workflows/seiot6-atualizar-indices.yml
permissions:
  contents: write
jobs:
  reindexar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Gerar índices conforme regras oficiais
        run: |
          node meu-mbb/atualizar-pesquisa.cjs
          node meu-mbb/gerar-visitas.cjs
          node meu-mbb/atualizar-pesquisa.cjs --check
          node meu-mbb/gerar-visitas.cjs --check
      - name: Registrar apenas na branch de recuperação (nunca na main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meu-mbb/catalogo.json meu-mbb/visitas-diretas.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(meu-mbb): atualizar pesquisa e visitas do tópico 6 recuperado"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "Indices já atualizados."
          fi
