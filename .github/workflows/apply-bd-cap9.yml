name: Aplicar Banco de Dados Capitulo 9

on:
  push:
    branches:
      - bancodedados-cap6-administracao-sgbd
    paths:
      - .github/workflows/apply-bd-cap9.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bancodedados-cap6-administracao-sgbd
          fetch-depth: 0

      - name: Aplicar Capitulo 9
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('pages/bancodedados.html')
          text = page.read_text(encoding='utf-8')
          body = Path('tmp/bd_cap9_body.html').read_text(encoding='utf-8').strip()
          exercises = Path('tmp/bd_cap9_exercises.html').read_text(encoding='utf-8').strip()

          old_chapter = '''<section class="module placeholder" id="mod-projetos"><section class="hero"><span class="kicker">Capítulo 9</span><h2>Projeto Integrador</h2><p>Requisitos, regras de negócio, DER, normalização, implementação, consultas e conexão com aplicações.</p></section>
          </section>'''
          if text.count(old_chapter) != 1:
              raise SystemExit('Placeholder do Capitulo 9 ausente ou duplicado.')
          text = text.replace(old_chapter, body, 1)

          old_card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-building-projetos')">
          <h3>9 Projeto Integrador</h3>
          <p>Cenários reais, modelagem, implementação, consultas e conexão com aplicações.</p>
          <span class="exercise-status building">🟠 Em construção</span>
          </button>'''
          new_card = '''<button class="exercise-chapter-card" onclick="openExerciseChapter('ex-cap10')">
          <h3>9 Projeto Integrador</h3>
          <p>Problema, requisitos, regras, DER, normalização, implementação, consultas, transações e aplicação.</p>
          <span class="exercise-status available">Disponível · 12 exercícios</span>
          </button>'''
          if text.count(old_card) != 1:
              raise SystemExit('Cartao do Capitulo 9 ausente ou duplicado.')
          text = text.replace(old_card, new_card, 1)

          old_view = '''<section class="exercise-chapter-view" id="ex-building-projetos">
          <div class="exercise-inner-card">
          <button class="exercise-back inside-card" onclick="backToExerciseHome()">← Voltar aos capítulos</button><section class="card note"><div class="card-body"><h3>🟠 Em construção</h3><p>Os exercícios deste capítulo serão adicionados quando o conteúdo estiver pronto.</p></div></section>
          </div>
          </section>'''
          if text.count(old_view) != 1:
              raise SystemExit('Area de exercicios do Capitulo 9 ausente ou duplicada.')
          text = text.replace(old_view, exercises, 1)

          forbidden = ['OFICIALMENTE FINALIZADO', 'Fechamento Oficial', 'Modo MbB', 'Pergunta MbB', 'MbB:']
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Texto de bastidor encontrado: {item}')

          required = [
              'id="mod-projetos"',
              'CREATE DATABASE loja_integrador',
              'CREATE TABLE item_pedido',
              'START TRANSACTION;',
              'FOR UPDATE;',
              'vw_resumo_pedido',
              'WHERE id_cliente = ?',
              'id="ex-cap10"',
              '9A — Problema e requisitos',
              '9L — Entrega final do projeto'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Conteudo esperado ausente: {item}')

          for module_id in ['mod-inicio','mod-fundamentos','mod-modelagem','mod-modelagem-logica','mod-sql','mod-joins','mod-sgbd','mod-transacoes','mod-avancado','mod-projetos','mod-moderna','mod-exercicios']:
              if text.count(f'id="{module_id}"') != 1:
                  raise SystemExit(f'Modulo ausente ou duplicado: {module_id}')

          for label in ['9A','9B','9C','9D','9E','9F','9G','9H','9I','9J','9K','9L']:
              if text.count(f'<summary>{label} —') != 1:
                  raise SystemExit(f'Exercicio {label} ausente ou duplicado')

          page.write_text(text, encoding='utf-8')
          PY

      - name: Confirmar escopo
        run: |
          git status --short
          changed=$(git status --short | awk '{print $2}' | grep -v '^tmp/' | grep -v '^.github/workflows/apply-bd-cap9.yml$' || true)
          if [ "$changed" != "pages/bancodedados.html" ]; then
            echo "Alteracao inesperada: $changed"
            exit 1
          fi

      - name: Commitar pagina
        run: |
          git config user.name "Mundo bit Byte"
          git config user.email "actions@users.noreply.github.com"
          git add pages/bancodedados.html
          git commit -m "Desenvolve capitulo 9 Projeto Integrador"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd

      - name: Remover arquivos temporarios
        run: |
          git rm tmp/bd_cap9_body.html tmp/bd_cap9_exercises.html .github/workflows/apply-bd-cap9.yml
          git commit -m "Remove arquivos temporarios do capitulo 9"
          git push origin HEAD:bancodedados-cap6-administracao-sgbd
