name: Auditoria IP temporaria
on:
  push:
    branches: [piloto-pedagogico-informatica-produtividade]
    paths: ['.github/workflows/auditoria-ip-temporaria.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar detalhes restantes
        shell: python
        run: |
          import zipfile, xml.etree.ElementTree as ET
          NS={
            'office':'urn:oasis:names:tc:opendocument:xmlns:office:1.0',
            'text':'urn:oasis:names:tc:opendocument:xmlns:text:1.0',
            'table':'urn:oasis:names:tc:opendocument:xmlns:table:1.0',
            'draw':'urn:oasis:names:tc:opendocument:xmlns:drawing:1.0',
            'chart':'urn:oasis:names:tc:opendocument:xmlns:chart:1.0'
          }
          def txt(el): return ''.join(el.itertext())
          print('=== ODT ESTRUTURA EXATA ===')
          p='downloads/informatica-produtividade/modulo-02/minuta-programacao-feira.odt'
          with zipfile.ZipFile(p) as z:
            root=ET.fromstring(z.read('content.xml'))
            body=root.find('.//office:text',NS)
            for i,el in enumerate(list(body),1):
              if el.tag in {f"{{{NS['text']}}}p",f"{{{NS['text']}}}h"}:
                print('PARA',i,'STYLE',el.attrib.get(f"{{{NS['text']}}}style-name"),'RAW',repr(txt(el)))
            for i,img in enumerate(root.findall('.//draw:image',NS),1):
              print('IMAGE',i,'ATTR',img.attrib)
            for i,frame in enumerate(root.findall('.//draw:frame',NS),1):
              print('FRAME',i,'ATTR',frame.attrib,'TEXT',repr(txt(frame)))

          print('=== ODP OBJETO/GRAFICO ===')
          p='downloads/informatica-produtividade/modulo-04/apresentacao-feira-diagnostico.odp'
          with zipfile.ZipFile(p) as z:
            print('ENTRIES',[n for n in z.namelist() if n.startswith('Object')])
            if 'Object 1/content.xml' in z.namelist():
              c=ET.fromstring(z.read('Object 1/content.xml'))
              print('CHART_TEXT',repr(' '.join(txt(c).split())))
              for t in c.findall('.//table:table',NS):
                print('CHART_TABLE',t.attrib.get(f"{{{NS['table']}}}name"))
                r=0
                for row in t.findall('./table:table-row',NS):
                  r+=1; vals=[]
                  for cell in row.findall('./table:table-cell',NS):
                    vals.append({'text':' '.join(txt(cell).split()),'value':cell.attrib.get(f"{{{NS['office']}}}value"),'type':cell.attrib.get(f"{{{NS['office']}}}value-type")})
                  print('CHART_ROW',r,vals)

          print('=== ICS PROJETO INTEGRADOR ===')
          p='downloads/informatica-produtividade/projeto-integrador/pacote-final-feira.zip'
          with zipfile.ZipFile(p) as z:
            print(z.read('fontes/evento-revisao.ics').decode('utf-8',errors='replace'))
