name: Auditoria IP temporaria
on:
  push:
    branches: [piloto-pedagogico-informatica-produtividade]
    paths: ['.github/workflows/auditoria-ip-temporaria.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar copias corrigidas
        shell: bash
        run: |
          mkdir -p /tmp/auditoria/js/informatica-produtividade /tmp/auditoria/downloads/informatica-produtividade/projeto-integrador
          cp js/informatica-produtividade/modulo-02.js /tmp/auditoria/js/informatica-produtividade/
          cp js/informatica-produtividade/modulo-03.js /tmp/auditoria/js/informatica-produtividade/
          cp js/informatica-produtividade/modulo-04.js /tmp/auditoria/js/informatica-produtividade/
          cp downloads/informatica-produtividade/projeto-integrador/pacote-final-feira.zip /tmp/auditoria/downloads/informatica-produtividade/projeto-integrador/
          python - <<'PY'
          from pathlib import Path
          import zipfile, os
          root=Path('/tmp/auditoria')
          def rep(rel,old,new):
              p=root/rel; s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n!=1: raise SystemExit(f'{rel}: ocorrência {n}: {old[:60]}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          m2='js/informatica-produtividade/modulo-02.js'
          rep(m2,'Há títulos feitos manualmente, linhas da programação alinhadas com sequências de espaços e imagem sem origem clara.','Há títulos digitados como texto comum, linhas da programação também em texto comum, sem tabela estrutural, e uma imagem sem legenda nem origem registrada.')
          rep(m2,'Localize título, data, horários, locais, linhas da programação alinhadas por espaços, imagem e pendências.','Localize título, data, horários, locais, as quatro linhas da programação, a imagem e as pendências.')
          rep(m2,'hierarquia inconsistente, alinhamento por espaços formando colunas improvisadas, imagem sem legenda/origem, pendência de horário e uma identificação de versão ambígua: “versão final nova”.','hierarquia inconsistente, programação digitada como texto comum sem tabela estrutural, imagem sem legenda/origem, pendência de horário e uma identificação de versão ambígua: “versão final nova”.')
          rep(m2,'Credenciamento, horários e orientações aparecem dispersos.','Data, horários, orientação de entrada e contato aparecem sem uma hierarquia clara.')
          rep(m2,'<h2>A impressão revela cortes que a tela escondia.</h2><p>Linhas vazias foram usadas para empurrar conteúdo e o rodapé desaparece.</p>','<h2>A prévia de impressão mostra que o documento ainda não tem regras claras de página.</h2><p>Há um parágrafo vazio no conteúdo e ainda faltam cabeçalho, numeração automática e configuração explícita de A4.</p>')
          rep(m2,'<h2>Uma atividade longa desloca horários porque as colunas eram espaços.</h2><p>Cada linha precisa manter juntos horário, atividade e local.</p>','<h2>A programação foi digitada como linhas de texto comum, sem estrutura de tabela.</h2><p>Para revisar e imprimir com segurança, cada linha precisa relacionar horário, atividade e local em células próprias.</p>')
          rep(m2,'<tr><td>horário</td><td>decisão registrada de Paulo</td></tr><tr><td>valor</td><td>planilha conferida por Renato</td></tr><tr><td>mapa</td><td>arquivo autorizado por Lia</td></tr>','<tr><td>horário de abertura</td><td>decisão registrada de Paulo</td></tr><tr><td>orientação de entrada</td><td>mapa/arquivo autorizado por Lia</td></tr><tr><td>programação de atividades</td><td>fonte aprovada pela coordenação</td></tr>')
          rep(m2,'<h2>Paulo sugere “acolhida”, mas não aprova tudo.</h2><p>A sugestão precisa continuar separada da decisão final.</p>','<h2>Paulo sugere trocar “Visita aos projetos do Bloco A” por “Visitação aos projetos do Bloco A”, mas o horário pendente continua sem aprovação.</h2><p>A sugestão de texto precisa continuar separada da decisão sobre o horário.</p>')
          m3='js/informatica-produtividade/modulo-03.js'
          rep(m3,'<code>ID_Material</code>, <code>Material</code>, <code>Categoria</code>, <code>Quantidade</code>, <code>Unidade</code>, <code>Responsavel</code> e <code>Status</code>.','<code>ID_Material</code>, <code>Material</code>, <code>Categoria</code>, <code>Quantidade</code>, <code>Unidade</code>, <code>Responsavel</code>, <code>Status</code> e <code>Observacao</code>.')
          rep(m3,'<li>Separe um material por linha.</li>','<li>Separe cabos, extensões e adaptadores em linhas distintas, mas não distribua as “10 caixas” entre eles: a fonte informa uma quantidade para o conjunto. Deixe Quantidade/Unidade individual pendentes e registre em Observacao: “10 caixas para o conjunto; distribuição a confirmar”.</li>')
          rep(m3,'<li>Compare a quantidade de itens antes de remover a área temporária.</li>','<li>Confira que nenhum material foi perdido e que a quantidade ainda não individualizada ficou explícita antes de remover a área temporária.</li>')
          rep(m3,'<strong>Teste</strong><p>qualquer linha deve descrever exatamente um material. Quantidade e unidade não podem estar misturadas na mesma célula.</p>','<strong>Teste</strong><p>qualquer linha deve descrever exatamente um material, e nenhuma quantidade individual pode ser inventada a partir das “10 caixas” atribuídas ao conjunto.</p>')
          rep(m3,'<h2>Marina escreve “Confirmada”; Lia usa “OK”; Renato filtra “Aprovado”.</h2><p>O campo aceita qualquer texto, então o problema se repete.</p>','<h2>Na planilha aparecem estados como “OK”, “Aprov.” e “Aprovado”.</h2><p>Enquanto o campo aceitar qualquer texto, filtros e contagens continuarão tratando estados equivalentes como valores diferentes.</p>')
          rep(m3,'Ordenar só a coluna de valores separaria custo, fornecedor e status.','Ordenar só a coluna de valores separaria item, categoria e status.')
          rep(m3,'<h2>Marina precisa cruzar inscrições confirmadas com materiais solicitados.</h2><p>Há uma inconsistência preparada; você precisa localizá-la pelas evidências.</p>','<h2>Marina precisa acompanhar inscrições confirmadas e materiais solicitados no mesmo controle.</h2><p>Há inconsistências preparadas; você precisa localizá-las pelas evidências e corrigir somente o que conseguir justificar.</p>')
          m4='js/informatica-produtividade/modulo-04.js'
          rep(m4,'<strong>Mensagem</strong><p>“32 projetos transformam problemas locais em soluções testáveis”</p>','<strong>Mensagem</strong><p>“32 projetos: 12 no Bloco A, 10 no Bloco B, 6 no pátio e 4 em outros espaços”</p>')
          zp=root/'downloads/informatica-produtividade/projeto-integrador/pacote-final-feira.zip'; tmp=zp.with_suffix('.tmp.zip')
          novo=('Escola Horizonte — Feira de Projetos\nEntregar guia público em PDF, controle auditável em ODS/PDF, apresentação ODP/PDF e o arquivo CONTROLE_DA_FEIRA.txt com as seções [P-00] a [P-05], [P-10], [P-20], [P-30] e [P-40].\nAbertura aprovada: 08:30. Entrada: Rua das Flores.\nPrazo, equipe receptora e falha selecionada: definidos pelo professor.\nNão publicar dados pessoais, custos detalhados ou comentários internos.\n').encode('utf-8')
          with zipfile.ZipFile(zp) as zin, zipfile.ZipFile(tmp,'w') as zout:
              for info in zin.infolist(): zout.writestr(info, novo if info.filename=='PEDIDO_OFICIAL.txt' else zin.read(info.filename))
          os.replace(tmp,zp)
          with zipfile.ZipFile(zp) as z:
              assert len(z.namelist())==9
              pedido=z.read('PEDIDO_OFICIAL.txt').decode('utf-8')
              assert 'CONTROLE_DA_FEIRA.txt' in pedido and 'registros P-00 a P-40' not in pedido
          PY
          node --check /tmp/auditoria/js/informatica-produtividade/modulo-02.js
          node --check /tmp/auditoria/js/informatica-produtividade/modulo-03.js
          node --check /tmp/auditoria/js/informatica-produtividade/modulo-04.js
      - uses: actions/upload-artifact@v4
        with:
          name: correcoes-auditoria-ip
          path: /tmp/auditoria
          retention-days: 1
