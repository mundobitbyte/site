<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DS Matemática — 1ª série do Ensino Médio integrado ao Técnico em Desenvolvimento de Sistemas. Conteúdo para acompanhar as aulas, revisar e praticar.">
  <title>DS Matemática | Mundo bit Byte</title>
  <link rel="stylesheet" href="../css/ds-matematica.css?v=6">
  <link rel="stylesheet" href="../css/ds-matematica-reforma.css?v=1">
</head>
<body>
  <header class="site-header">
    <a class="brand-link" href="../index.html" aria-label="Voltar ao Mundo bit Byte">
      <span class="brand-mark">MbB</span>
      <span>Mundo bit Byte</span>
    </a>
    <strong>DS Matemática</strong>
  </header>

  <main id="seriesHome" class="series-home">
    <section class="intro-card">
      <span class="eyebrow">Ensino Médio + Desenvolvimento de Sistemas</span>
      <h1>Matemática</h1>
      <p>Use este material para acompanhar as aulas, recordar o que foi estudado e praticar até o conteúdo ficar claro.</p>
    </section>

    <section class="series-grid" aria-label="Séries do Ensino Médio">
      <button class="series-card active" type="button" data-series="1">
        <span class="series-label">1ª Série</span>
        <strong>Acessar conteúdo</strong>
      </button>
      <article class="series-card disabled" aria-disabled="true">
        <span class="series-label">2ª Série</span>
        <strong>Em breve</strong>
      </article>
      <article class="series-card disabled" aria-disabled="true">
        <span class="series-label">3ª Série</span>
        <strong>Em breve</strong>
      </article>
    </section>
  </main>

  <section id="courseView" class="course-view" hidden>
    <div class="course-toolbar">
      <button id="backToSeries" class="pill-button" type="button">← Séries</button>
      <span class="series-pill">1ª Série</span>
      <button id="openMenu" class="pill-button menu-toggle" type="button" aria-controls="lessonMenu" aria-expanded="false">Conteúdos</button>
    </div>

    <div class="course-layout">
      <aside id="lessonMenu" class="lesson-menu" aria-label="Conteúdos da 1ª série"></aside>

      <main class="content-area">
        <header class="lesson-heading">
          <div>
            <div id="unitName" class="unit-name"></div>
            <div id="technicalTitle" class="technical-title"></div>
            <h2 id="lessonTitle"></h2>
          </div>
          <p id="lessonObjective" class="lesson-objective"></p>
        </header>

        <article id="lessonContent" class="lesson-content" aria-live="polite"></article>
      </main>
    </div>
  </section>

  <script src="../js/ds-matematica-conteudo-01.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-02.js?v=6"></script>
  <script src="../js/ds-matematica-conteudo-03.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-04.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-05.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-06.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-07.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-08.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-09.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-10.js?v=5"></script>
  <script src="../js/ds-matematica-conteudo-11.js?v=5"></script>
  <script src="../js/ds-matematica-geradores.js?v=5"></script>
  <script src="../js/ds-matematica-exercicios.js?v=5"></script>
  <script src="../js/ds-matematica-core.js?v=6"></script>
</body>
</html>
