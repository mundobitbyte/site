<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc"><title id="title">Categoria e Produto no modelo lógico</title><desc id="desc">A chave primária de Categoria é referenciada por id_categoria em Produto. A FK de Produto é obrigatória.</desc><defs><style>text{font:22px Arial,sans-serif;fill:#171717} .name{font-weight:bold} .small{font-size:18px} .heading{font-weight:bold;font-size:25px} .box{fill:white;stroke:#222;stroke-width:1.6} .line{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style><g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g><g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g></defs><rect width="620" height="620" fill="white" /><path class="line" d="M40 117 H15 V513 H40" /><rect x="40" y="60" width="420" height="120" class="box" /><rect x="40" y="60" width="420" height="40" class="header" /><text x="250" y="87" class="name" text-anchor="middle">CATEGORIA</text><use href="#pk" x="48" y="108" /><text x="105" y="124" class="" text-anchor="start">id_categoria: INT</text><path class="line" d="M40 134 H460" /><text x="105" y="158" class="" text-anchor="start">nome: VARCHAR(50)</text><path class="line" d="M40 168 H460" /><rect x="40" y="168" width="420" height="12" class="header" /><rect x="40" y="320" width="420" height="256" class="box" /><rect x="40" y="320" width="420" height="40" class="header" /><text x="250" y="347" class="name" text-anchor="middle">PRODUTO</text><use href="#pk" x="48" y="368" /><text x="105" y="384" class="" text-anchor="start">id_produto: INT</text><path class="line" d="M40 394 H460" /><text x="105" y="418" class="" text-anchor="start">descricao: VARCHAR(100)</text><path class="line" d="M40 428 H460" /><text x="105" y="452" class="" text-anchor="start">preco: DECIMAL(10,2)</text><path class="line" d="M40 462 H460" /><text x="105" y="486" class="" text-anchor="start">qtde: INT</text><path class="line" d="M40 496 H460" /><use href="#fk" x="48" y="504" /><text x="105" y="520" class="" text-anchor="start">id_categoria: INT</text><path class="line" d="M40 530 H460" /><text x="105" y="554" class="" text-anchor="start">estoque_minimo: INT</text><path class="line" d="M40 564 H460" /><rect x="40" y="564" width="420" height="12" class="header" /><text x="45" y="240" class="small" text-anchor="start">FK no lado N: produto.id_categoria.</text><text x="45" y="272" class="small" text-anchor="start">NOT NULL: todo produto tem uma categoria.</text><text x="45" y="602" class="small" text-anchor="start">Chave dourada: PK. Chave cinza: FK.</text></svg>