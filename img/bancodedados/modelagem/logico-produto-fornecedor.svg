<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Conversão do muitos para muitos</title><desc id="desc">Produto e Fornecedor se ligam por Produto_fornecedor, com duas FKs e chave primária composta. Custo e prazo ficam na tabela associativa.</desc><defs><style>text{font:20px Arial,sans-serif;fill:#171717} .name{font-weight:bold} .small{font-size:18px} .heading{font-weight:bold;font-size:25px} .box{fill:white;stroke:#222;stroke-width:1.6} .line{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style><g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="1.6" fill="white"/><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z"/></g><g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="1.6" fill="white"/><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z"/></g></defs><rect width="1200" height="850" fill="white"/><path class="line" d="M500 117 H560 V425 H300 V537 H330"/><path class="line" d="M700 117 H640 V440 H930 V571 H880"/><rect x="40" y="60" width="460" height="256" class="box"/><rect x="40" y="60" width="460" height="40" class="header"/><text x="270.0" y="87" class="name" text-anchor="middle">PRODUTO</text><use href="#pk" x="48" y="108"/><text x="105" y="124" class="" text-anchor="start">id_produto: INT</text><path class="line" d="M40 134 H500"/><text x="105" y="158" class="" text-anchor="start">descricao: VARCHAR(100)</text><path class="line" d="M40 168 H500"/><text x="105" y="192" class="" text-anchor="start">preco: DECIMAL(10,2)</text><path class="line" d="M40 202 H500"/><text x="105" y="226" class="" text-anchor="start">qtde: INT</text><path class="line" d="M40 236 H500"/><use href="#fk" x="48" y="244"/><text x="105" y="260" class="" text-anchor="start">id_categoria: INT</text><path class="line" d="M40 270 H500"/><text x="105" y="294" class="" text-anchor="start">estoque_minimo: INT</text><path class="line" d="M40 304 H500"/><rect x="40" y="304" width="460" height="12" class="header"/><rect x="700" y="60" width="450" height="188" class="box"/><rect x="700" y="60" width="450" height="40" class="header"/><text x="925.0" y="87" class="name" text-anchor="middle">FORNECEDOR</text><use href="#pk" x="708" y="108"/><text x="765" y="124" class="" text-anchor="start">id_fornecedor: INT</text><path class="line" d="M700 134 H1150"/><text x="765" y="158" class="" text-anchor="start">nome: VARCHAR(80)</text><path class="line" d="M700 168 H1150"/><text x="765" y="192" class="" text-anchor="start">telefone: VARCHAR(20)</text><path class="line" d="M700 202 H1150"/><use href="#fk" x="708" y="210"/><text x="765" y="226" class="" text-anchor="start">id_cidade: INT</text><path class="line" d="M700 236 H1150"/><rect x="700" y="236" width="450" height="12" class="header"/><rect x="330" y="480" width="550" height="188" class="box"/><rect x="330" y="480" width="550" height="40" class="header"/><text x="605.0" y="507" class="name" text-anchor="middle">PRODUTO_FORNECEDOR</text><use href="#pk" x="338" y="528"/><use href="#fk" x="361" y="528"/><text x="395" y="544" class="" text-anchor="start">id_produto: INT</text><path class="line" d="M330 554 H880"/><use href="#pk" x="338" y="562"/><use href="#fk" x="361" y="562"/><text x="395" y="578" class="" text-anchor="start">id_fornecedor: INT</text><path class="line" d="M330 588 H880"/><text x="395" y="612" class="" text-anchor="start">preco_custo: DECIMAL(10,2)</text><path class="line" d="M330 622 H880"/><text x="395" y="646" class="" text-anchor="start">prazo_entrega: INT</text><path class="line" d="M330 656 H880"/><rect x="330" y="656" width="550" height="12" class="header"/><text x="45" y="735" class="small" text-anchor="start">Cada linha da associação exige um produto e um fornecedor existentes.</text><text x="45" y="772" class="small" text-anchor="start">O par não se repete; cada ID, isoladamente, pode aparecer em várias linhas.</text><text x="45" y="809" class="small" text-anchor="start">Dourada: PK. Cinza: FK. Os dois símbolos aparecem nos campos da chave composta.</text></svg>
