<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550" role="img" aria-labelledby="title desc"><title id="title">Conversão do exemplo um para um</title><desc id="desc">Exercício independente. Crachá tem chave primária própria e uma FK id_funcionario obrigatória e única. Não altera o comércio.</desc><defs><style>text{font:22px Arial,sans-serif;fill:#171717} .name{font-weight:bold} .small{font-size:18px} .heading{font-weight:bold;font-size:25px} .box{fill:white;stroke:#222;stroke-width:1.6} .line{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style><g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g><g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g></defs><rect width="620" height="550" fill="white" /><path class="line" d="M40 117 H15 V405 H40" /><rect x="40" y="60" width="420" height="120" class="box" /><rect x="40" y="60" width="420" height="40" class="header" /><text x="250" y="87" class="name" text-anchor="middle">FUNCIONARIO</text><use href="#pk" x="48" y="108" /><text x="105" y="124" class="" text-anchor="start">id_funcionario: INT</text><path class="line" d="M40 134 H460" /><text x="105" y="158" class="" text-anchor="start">nome: VARCHAR(80)</text><path class="line" d="M40 168 H460" /><rect x="40" y="168" width="420" height="12" class="header" /><rect x="40" y="280" width="420" height="154" class="box" /><rect x="40" y="280" width="420" height="40" class="header" /><text x="250" y="307" class="name" text-anchor="middle">CRACHA_ATIVO</text><use href="#pk" x="48" y="328" /><text x="105" y="344" class="" text-anchor="start">id_cracha: INT</text><path class="line" d="M40 354 H460" /><text x="105" y="378" class="" text-anchor="start">numero: VARCHAR(20)</text><path class="line" d="M40 388 H460" /><use href="#fk" x="48" y="396" /><text x="105" y="412" class="" text-anchor="start">id_funcionario: INT</text><path class="line" d="M40 422 H460" /><rect x="40" y="422" width="420" height="12" class="header" /><text x="45" y="230" class="small" text-anchor="start">FK NOT NULL + UNIQUE em id_funcionario.</text><text x="45" y="475" class="small" text-anchor="start">Cada crachá aponta para um funcionário.</text><text x="45" y="508" class="small" text-anchor="start">UNIQUE: no máximo um crachá ativo</text><text x="45" y="537" class="small">por funcionário.</text></svg>