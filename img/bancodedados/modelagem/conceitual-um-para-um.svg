<svg xmlns="http://www.w3.org/2000/svg" width="400" height="390" viewBox="100 0 400 390" role="img" aria-labelledby="title desc"><title id="title">Funcionário e crachá ativo: um para um</title><desc id="desc">Um funcionário pode ter zero ou um crachá ativo. Cada crachá ativo pertence a exatamente um funcionário. Exercício separado do comércio.</desc><defs><style>text{font:22px Arial,sans-serif;fill:#171717} .name{font-weight:bold} .small{font-size:18px} .heading{font-weight:bold;font-size:25px} .box{fill:white;stroke:#222;stroke-width:1.6} .line{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style><g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g><g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g></defs><rect width="600" height="450" fill="white" /><rect x="175" y="30" width="250" height="60" class="box" /><text x="300.0" y="67" class="name" text-anchor="middle">FUNCIONÁRIO</text><path class="line" d="M300 90 V165 M300 245 V320" /><polygon class="box" points="300,165 390,205 300,245 210,205" /><text x="300" y="211" class="small" text-anchor="middle">POSSUI</text><rect x="175" y="320" width="250" height="60" class="box" /><text x="300.0" y="357" class="name" text-anchor="middle">CRACHÁ ATIVO</text><text x="325" y="125" class="" text-anchor="start">(1,1)</text><text x="325" y="300" class="" text-anchor="start">(0,1)</text></svg>