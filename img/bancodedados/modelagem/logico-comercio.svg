<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
    <title id="title">Modelo lógico completo do comércio</title><desc id="desc">As cinco tabelas categoria, cidade, produto, fornecedor e produto_fornecedor, com todos os campos e tipos dos CREATE aprovados. As ligações terminam nos campos referenciados. As duas colunas da chave composta da tabela associativa são também chaves estrangeiras.</desc>
    <defs><style>text{font-family:Arial,sans-serif;fill:#171717;font-size:20px} .heading{font-size:27px;font-weight:bold} .entity{font-weight:bold;font-size:21px} .relation{font-size:17px} .field{font-size:20px} .small{font-size:18px} .box{fill:white;stroke:#222;stroke-width:1.6} .edge{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style>
    <g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="1.6" fill="white"/><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z"/></g>
    <g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="1.6" fill="white"/><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z"/></g></defs>
    <rect width="1200" height="1180" fill="white"/><text x="35" y="40" class="heading" text-anchor="start">Comércio — modelo lógico completo</text><text x="35" y="74" class="small" text-anchor="start">Cinco tabelas, seus campos e as ligações entre chaves primárias e estrangeiras</text><path class="edge" d="M40 173 H18 V625 H40"/><path class="edge" d="M1150 173 H1180 V587 H1150"/><path class="edge" d="M500 473 H560 V750 H300 V873 H330"/><path class="edge" d="M700 473 H640 V765 H930 V911 H880"/><rect class="box" x="40" y="110" width="440" height="135"/><rect class="header" x="40" y="110" width="440" height="44"/><text x="260.0" y="139" class="entity" text-anchor="middle">CATEGORIA</text><path class="edge" d="M40 192 H480"/><use href="#pk" x="50" y="163"/><text x="108" y="180" class="field" text-anchor="start">id_categoria: INT</text><path class="edge" d="M40 230 H480"/><text x="108" y="218" class="field" text-anchor="start">nome: VARCHAR(50)</text><rect class="header" x="40" y="230" width="440" height="15"/><rect class="box" x="700" y="110" width="450" height="173"/><rect class="header" x="700" y="110" width="450" height="44"/><text x="925.0" y="139" class="entity" text-anchor="middle">CIDADE</text><path class="edge" d="M700 192 H1150"/><use href="#pk" x="710" y="163"/><text x="768" y="180" class="field" text-anchor="start">id_cidade: INT</text><path class="edge" d="M700 230 H1150"/><text x="768" y="218" class="field" text-anchor="start">nome_cidade: VARCHAR(80)</text><path class="edge" d="M700 268 H1150"/><text x="768" y="256" class="field" text-anchor="start">estado: CHAR(2)</text><rect class="header" x="700" y="268" width="450" height="15"/><rect class="box" x="40" y="410" width="460" height="287"/><rect class="header" x="40" y="410" width="460" height="44"/><text x="270.0" y="439" class="entity" text-anchor="middle">PRODUTO</text><path class="edge" d="M40 492 H500"/><use href="#pk" x="50" y="463"/><text x="108" y="480" class="field" text-anchor="start">id_produto: INT</text><path class="edge" d="M40 530 H500"/><text x="108" y="518" class="field" text-anchor="start">descricao: VARCHAR(100)</text><path class="edge" d="M40 568 H500"/><text x="108" y="556" class="field" text-anchor="start">preco: DECIMAL(10,2)</text><path class="edge" d="M40 606 H500"/><text x="108" y="594" class="field" text-anchor="start">qtde: INT</text><path class="edge" d="M40 644 H500"/><use href="#fk" x="50" y="615"/><text x="108" y="632" class="field" text-anchor="start">id_categoria: INT</text><path class="edge" d="M40 682 H500"/><text x="108" y="670" class="field" text-anchor="start">estoque_minimo: INT</text><rect class="header" x="40" y="682" width="460" height="15"/><rect class="box" x="700" y="410" width="450" height="211"/><rect class="header" x="700" y="410" width="450" height="44"/><text x="925.0" y="439" class="entity" text-anchor="middle">FORNECEDOR</text><path class="edge" d="M700 492 H1150"/><use href="#pk" x="710" y="463"/><text x="768" y="480" class="field" text-anchor="start">id_fornecedor: INT</text><path class="edge" d="M700 530 H1150"/><text x="768" y="518" class="field" text-anchor="start">nome: VARCHAR(80)</text><path class="edge" d="M700 568 H1150"/><text x="768" y="556" class="field" text-anchor="start">telefone: VARCHAR(20)</text><path class="edge" d="M700 606 H1150"/><use href="#fk" x="710" y="577"/><text x="768" y="594" class="field" text-anchor="start">id_cidade: INT</text><rect class="header" x="700" y="606" width="450" height="15"/><rect class="box" x="330" y="810" width="550" height="211"/><rect class="header" x="330" y="810" width="550" height="44"/><text x="605.0" y="839" class="entity" text-anchor="middle">PRODUTO_FORNECEDOR</text><path class="edge" d="M330 892 H880"/><use href="#pk" x="340" y="863"/><use href="#fk" x="365" y="863"/><text x="398" y="880" class="field" text-anchor="start">id_produto: INT</text><path class="edge" d="M330 930 H880"/><use href="#pk" x="340" y="901"/><use href="#fk" x="365" y="901"/><text x="398" y="918" class="field" text-anchor="start">id_fornecedor: INT</text><path class="edge" d="M330 968 H880"/><text x="398" y="956" class="field" text-anchor="start">preco_custo: DECIMAL(10,2)</text><path class="edge" d="M330 1006 H880"/><text x="398" y="994" class="field" text-anchor="start">prazo_entrega: INT</text><rect class="header" x="330" y="1006" width="550" height="15"/><text x="80" y="720" class="small" text-anchor="start">Categoria → produtos: 0..N</text><text x="80" y="748" class="small" text-anchor="start">Produto → categoria: 1..1</text><text x="725" y="662" class="small" text-anchor="start">Cidade → fornecedores: 0..N</text><text x="725" y="690" class="small" text-anchor="start">Fornecedor → cidade: 0..1</text><use href="#pk" x="45" y="1060"/><text x="76" y="1077" class="small" text-anchor="start">PK</text><use href="#fk" x="155" y="1060"/><text x="186" y="1077" class="small" text-anchor="start">FK</text><text x="270" y="1077" class="small" text-anchor="start">Dois símbolos na mesma linha: o campo é parte da PK e também é FK.</text><text x="35" y="1120" class="small" text-anchor="start">O N:N origina produto_fornecedor; sua PK é o par (id_produto, id_fornecedor).</text><text x="35" y="1151" class="small" text-anchor="start">Nulabilidade, unicidade, valores padrão e CHECK são detalhados junto à atividade correspondente.</text></svg>