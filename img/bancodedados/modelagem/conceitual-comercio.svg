<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
    <title id="title">DER conceitual completo do comércio</title><desc id="desc">Quatro entidades e três relacionamentos. Categoria participa de zero a muitos produtos; produto pertence a uma categoria. Produto e fornecedor têm participação de zero a muitos no fornecimento, que tem custo e prazo. Fornecedor pode ter zero ou uma cidade; uma cidade pode ter zero a muitos fornecedores.</desc>
    <defs><style>text{font-family:Arial,sans-serif;fill:#171717;font-size:20px} .heading{font-size:27px;font-weight:bold} .entity{font-weight:bold;font-size:21px} .relation{font-size:17px} .field{font-size:20px} .small{font-size:18px} .box{fill:white;stroke:#222;stroke-width:1.6} .edge{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style>
    <g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="1.6" fill="white"/><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z"/></g>
    <g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="1.6" fill="white"/><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z"/></g></defs>
    <rect width="1200" height="1180" fill="white"/><text x="35" y="40" class="heading" text-anchor="start">Comércio — modelo conceitual completo</text><text x="35" y="74" class="small" text-anchor="start">Quatro entidades e as regras do comércio que será implementado no MySQL</text><rect class="box" x="180" y="130" width="240" height="60"/><text x="300.0" y="167" class="entity" text-anchor="middle">CATEGORIA</text><rect class="box" x="180" y="430" width="240" height="60"/><text x="300.0" y="467" class="entity" text-anchor="middle">PRODUTO</text><rect class="box" x="800" y="430" width="240" height="60"/><text x="920.0" y="467" class="entity" text-anchor="middle">FORNECEDOR</text><rect class="box" x="800" y="870" width="240" height="60"/><text x="920.0" y="907" class="entity" text-anchor="middle">CIDADE</text><path class="edge" d="M300 190 V270 M300 350 V430"/><polygon class="box" points="300,270 385,310 300,350 215,310"/><text x="300" y="316" class="relation" text-anchor="middle">CLASSIFICA</text><text x="322" y="227" class="" text-anchor="start">(0,n)</text><text x="322" y="412" class="" text-anchor="start">(1,1)</text><path class="edge" d="M420 460 H535 M685 460 H800"/><polygon class="box" points="610,420 685,460 610,500 535,460"/><text x="610" y="466" class="relation" text-anchor="middle">FORNECE</text><text x="438" y="441" class="" text-anchor="start">(0,n)</text><text x="727" y="441" class="" text-anchor="start">(0,n)</text><path class="edge" d="M920 490 V660 M920 740 V870"/><polygon class="box" points="920,660 1010,700 920,740 830,700"/><text x="920" y="706" class="relation" text-anchor="middle">LOCALIZA-SE</text><text x="940" y="532" class="" text-anchor="start">(0,1)</text><text x="940" y="848" class="" text-anchor="start">(0,n)</text><path class="edge" d="M440 130 V181"/><path class="edge" d="M440 141 H453"/><circle cx="460" cy="141" r="6" fill="#222" stroke="#222" stroke-width="1.6"/><text x="477" y="147" class="field" text-anchor="start">id_categoria</text><path class="edge" d="M440 181 H453"/><circle cx="460" cy="181" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="477" y="187" class="field" text-anchor="start">nome</text><path class="edge" d="M420 141 H440"/><path class="edge" d="M210 490 V708"/><path class="edge" d="M210 540 H228"/><circle cx="235" cy="540" r="6" fill="#222" stroke="#222" stroke-width="1.6"/><text x="252" y="546" class="field" text-anchor="start">id_produto</text><path class="edge" d="M210 582 H228"/><circle cx="235" cy="582" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="252" y="588" class="field" text-anchor="start">descricao</text><path class="edge" d="M210 624 H228"/><circle cx="235" cy="624" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="252" y="630" class="field" text-anchor="start">preco</text><path class="edge" d="M210 666 H228"/><circle cx="235" cy="666" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="252" y="672" class="field" text-anchor="start">qtde</text><path class="edge" d="M210 708 H228"/><circle cx="235" cy="708" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="252" y="714" class="field" text-anchor="start">estoque_minimo</text><path class="edge" d="M830 220 V347"/><path class="edge" d="M830 263 H848"/><circle cx="855" cy="263" r="6" fill="#222" stroke="#222" stroke-width="1.6"/><text x="872" y="269" class="field" text-anchor="start">id_fornecedor</text><path class="edge" d="M830 305 H848"/><circle cx="855" cy="305" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="872" y="311" class="field" text-anchor="start">nome</text><path class="edge" d="M830 347 H848"/><circle cx="855" cy="347" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="872" y="353" class="field" text-anchor="start">telefone</text><path class="edge" d="M830 347 V430"/><path class="edge" d="M610 500 V600"/><path class="edge" d="M610 558 H643"/><circle cx="650" cy="558" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="667" y="564" class="field" text-anchor="start">preco_custo</text><path class="edge" d="M610 600 H643"/><circle cx="650" cy="600" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="667" y="606" class="field" text-anchor="start">prazo_entrega</text><path class="edge" d="M830 930 V1062"/><path class="edge" d="M830 978 H848"/><circle cx="855" cy="978" r="6" fill="#222" stroke="#222" stroke-width="1.6"/><text x="872" y="984" class="field" text-anchor="start">id_cidade</text><path class="edge" d="M830 1020 H848"/><circle cx="855" cy="1020" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="872" y="1026" class="field" text-anchor="start">nome_cidade</text><path class="edge" d="M830 1062 H848"/><circle cx="855" cy="1062" r="6" fill="white" stroke="#222" stroke-width="1.6"/><text x="872" y="1068" class="field" text-anchor="start">estado</text><text x="35" y="795" class="small" text-anchor="start">● Identificador    ○ Atributo</text><text x="35" y="826" class="small" text-anchor="start">(mínimo, máximo): participação da entidade junto à marcação.</text><text x="35" y="866" class="small" text-anchor="start">No N:N, custo e prazo pertencem ao vínculo produto–fornecedor.</text><text x="35" y="1140" class="small" text-anchor="start">Leia os mínimos: categoria sem produtos; produto sem fornecedor; fornecedor sem cidade informada.</text></svg>