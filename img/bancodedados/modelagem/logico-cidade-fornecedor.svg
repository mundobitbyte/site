<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="title desc"><title id="title">Cidade e Fornecedor no modelo lógico</title><desc id="desc">A coluna id_cidade de Fornecedor é uma FK que aceita NULL. Quando preenchida, referencia uma cidade cadastrada.</desc><defs><style>text{font:22px Arial,sans-serif;fill:#171717} .name{font-weight:bold} .small{font-size:18px} .heading{font-weight:bold;font-size:25px} .box{fill:white;stroke:#222;stroke-width:1.6} .line{fill:none;stroke:#222;stroke-width:1.6} .header{fill:#c2ddc1;stroke:#222;stroke-width:1.6}</style><g id="pk" fill="#f5d673" stroke="#785c0c" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g><g id="fk" fill="#c8c8c8" stroke="#555" stroke-width="1.2"><circle cx="6" cy="6" r="5" /><circle cx="6" cy="6" r="1.6" fill="white" /><path d="M9 9 L17 17 L21 13 L18 10 L16 12 L13 9 Z" /></g></defs><rect width="620" height="550" fill="white" /><path class="line" d="M40 117 H15 V459 H40" /><rect x="40" y="60" width="420" height="154" class="box" /><rect x="40" y="60" width="420" height="40" class="header" /><text x="250" y="87" class="name" text-anchor="middle">CIDADE</text><use href="#pk" x="48" y="108" /><text x="105" y="124" class="" text-anchor="start">id_cidade: INT</text><path class="line" d="M40 134 H460" /><text x="105" y="158" class="" text-anchor="start">nome_cidade: VARCHAR(80)</text><path class="line" d="M40 168 H460" /><text x="105" y="192" class="" text-anchor="start">estado: CHAR(2)</text><path class="line" d="M40 202 H460" /><rect x="40" y="202" width="420" height="12" class="header" /><rect x="40" y="300" width="420" height="188" class="box" /><rect x="40" y="300" width="420" height="40" class="header" /><text x="250" y="327" class="name" text-anchor="middle">FORNECEDOR</text><use href="#pk" x="48" y="348" /><text x="105" y="364" class="" text-anchor="start">id_fornecedor: INT</text><path class="line" d="M40 374 H460" /><text x="105" y="398" class="" text-anchor="start">nome: VARCHAR(80)</text><path class="line" d="M40 408 H460" /><text x="105" y="432" class="" text-anchor="start">telefone: VARCHAR(20)</text><path class="line" d="M40 442 H460" /><use href="#fk" x="48" y="450" /><text x="105" y="466" class="" text-anchor="start">id_cidade: INT</text><path class="line" d="M40 476 H460" /><rect x="40" y="476" width="420" height="12" class="header" /><text x="45" y="250" class="small" text-anchor="start">id_cidade em fornecedor pode ser NULL.</text><text x="45" y="518" class="small" text-anchor="start">Se informada, deve apontar para uma</text><text x="45" y="548" class="small">cidade existente.</text></svg>