<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Captura de tela didática com erro FileNotFoundError</title>
<desc id="desc">Editor de código fictício mostrando o arquivo cadastro_alunos.py e uma mensagem FileNotFoundError no painel de saída, para o aluno separar o que a tela confirma de hipóteses sobre a causa.</desc>
<defs><style>
.ui{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#172235}.mono{font-family:'Courier New',monospace;fill:#1b2433}.small{font-size:18px}.mid{font-size:22px}.big{font-size:26px}.line{stroke:#d7e0eb;stroke-width:2}.red{fill:#b42318}.green{fill:#147a2a}.blue{fill:#1d5ed6}.panel{fill:#fff;stroke:#ccd8e6;stroke-width:2}
</style></defs>
<rect width="1200" height="760" rx="20" fill="#edf2f7"/>
<rect x="20" y="20" width="1160" height="720" rx="16" class="panel"/>
<rect x="20" y="20" width="1160" height="54" rx="16" fill="#f5f7fa"/>
<text x="42" y="54" class="ui small">Arquivo   Editar   Selecionar   Exibir   Executar   Terminal   Ajuda</text>
<line x1="20" y1="74" x2="1180" y2="74" class="line"/>
<rect x="20" y="74" width="280" height="448" fill="#f8fafc"/><line x1="300" y1="74" x2="300" y2="522" class="line"/>
<text x="42" y="112" class="ui mid" font-weight="700">Explorador de arquivos</text>
<text x="56" y="155" class="ui mid">▾ projeto</text>
<text x="78" y="194" class="ui mid">▾ dados</text>
<text x="100" y="232" class="ui mid">exemplo.csv</text>
<rect x="34" y="250" width="240" height="42" rx="9" fill="#dcecff"/>
<text x="78" y="278" class="ui mid">cadastro_alunos.py</text>
<text x="78" y="324" class="ui mid">funcoes.py</text>
<text x="78" y="366" class="ui mid">leia_me.txt</text>
<rect x="300" y="74" width="880" height="448" fill="#fff"/>
<rect x="320" y="86" width="275" height="48" rx="8" fill="#f5f7fa"/><text x="342" y="117" class="ui mid" font-weight="700">cadastro_alunos.py</text>
<line x1="374" y1="134" x2="374" y2="522" class="line"/>
<g class="mono mid"><text x="338" y="174">1</text><text x="396" y="174" class="green"># Programa para ler a lista de alunos</text>
<text x="338" y="220">3</text><text x="396" y="220"><tspan class="blue">print</tspan>("Iniciando o cadastro de alunos...")</text>
<rect x="380" y="248" width="760" height="48" rx="7" fill="#fff0f0"/>
<text x="338" y="280" class="red">5</text><text x="396" y="280"><tspan class="blue">with</tspan> open("dados/alunos.csv", "r", encoding="utf-8") as arquivo:</text>
<text x="338" y="326">6</text><text x="438" y="326">linhas = arquivo.readlines()</text>
<text x="338" y="398">8</text><text x="396" y="398"><tspan class="blue">print</tspan>(f"Total de linhas lidas: {len(linhas)}")</text></g>
<line x1="20" y1="522" x2="1180" y2="522" class="line"/>
<rect x="20" y="522" width="1160" height="218" fill="#fff"/><text x="42" y="557" class="ui mid" font-weight="700">Saída</text><text x="132" y="557" class="ui mid">Terminal</text><text x="238" y="557" class="ui mid">Problemas</text><rect x="38" y="574" width="1124" height="146" rx="10" fill="#fff1f1"/>
<g class="mono mid"><text x="58" y="606" font-weight="700">Executando cadastro_alunos.py</text><text x="58" y="638">Traceback (most recent call last):</text><text x="82" y="670">File "cadastro_alunos.py", line 12, in &lt;module&gt;</text><text x="82" y="700" class="red">FileNotFoundError: [Errno 2] No such file or directory: 'dados/alunos.csv'</text></g>
</svg>