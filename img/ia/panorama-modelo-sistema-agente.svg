<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Modelo, sistema de IA e agente</title>
<desc id="desc">Diagrama compacto que diferencia modelo, sistema de IA e agente, mostrando contexto, ferramentas e ações com permissão.</desc>
<defs><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#10213d}.h{font-weight:800;fill:#0f4c9b}.small{font-size:16px}.body{font-size:18px}.head{font-size:22px}.title{font-size:30px}.panel{fill:#f4f9ff;stroke:#8bb9ec;stroke-width:2.5}.agent{fill:#eaf4ff;stroke:#67a2e7;stroke-width:3}.card{fill:#fff;stroke:#c9dcf2;stroke-width:2}.accent{fill:#286dcc}.green{fill:#eafff6;stroke:#72cfac;stroke-width:2}
</style></defs>
<rect width="1400" height="560" rx="24" fill="#fbfdff"/>
<text x="42" y="48" class="t h title">Modelo → Sistema de IA → Agente</text>
<text x="42" y="78" class="t body">Mais capacidade de agir exige mais limites, confirmação e revisão humana.</text>
<rect x="35" y="105" width="1330" height="390" rx="24" class="agent"/>
<text x="62" y="142" class="t h title">Agente</text>
<text x="180" y="141" class="t body">persegue um objetivo e pode executar etapas usando ferramentas autorizadas</text>
<g transform="translate(62 160)"><rect width="392" height="72" rx="15" class="card"/><circle cx="36" cy="36" r="21" class="accent"/><text x="36" y="43" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">1</text><text x="72" y="30" class="t h head">Planeja etapas</text><text x="72" y="53" class="t small">decompõe o objetivo</text></g>
<g transform="translate(504 160)"><rect width="392" height="72" rx="15" class="card"/><circle cx="36" cy="36" r="21" class="accent"/><text x="36" y="43" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">2</text><text x="72" y="30" class="t h head">Usa ferramentas</text><text x="72" y="53" class="t small">somente com permissão</text></g>
<g transform="translate(946 160)"><rect width="392" height="72" rx="15" class="card"/><circle cx="36" cy="36" r="21" class="accent"/><text x="36" y="43" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">3</text><text x="72" y="30" class="t h head">Pede confirmação</text><text x="72" y="53" class="t small">antes de ações importantes</text></g>
<rect x="62" y="255" width="1276" height="170" rx="20" class="panel"/>
<text x="86" y="288" class="t h head">Sistema de IA</text>
<text x="235" y="288" class="t small">combina modelo, contexto, dados, regras e ferramentas</text>
<g transform="translate(86 307)"><rect width="190" height="92" rx="14" class="card"/><text x="95" y="34" text-anchor="middle" class="t h head">Interface</text><text x="95" y="59" text-anchor="middle" class="t small">onde você interage</text></g>
<g transform="translate(292 307)"><rect width="205" height="92" rx="14" class="card"/><text x="102.5" y="34" text-anchor="middle" class="t h head">Contexto</text><text x="102.5" y="59" text-anchor="middle" class="t small">conversa e arquivos</text></g>
<g transform="translate(513 307)"><rect width="350" height="92" rx="14" fill="#eaf3ff" stroke="#4e93df" stroke-width="2.5"/><text x="175" y="29" text-anchor="middle" class="t h head">Modelo</text><text x="36" y="60" class="t small">entrada</text><text x="99" y="60" class="t h head">→</text><rect x="137" y="39" width="72" height="34" rx="9" class="accent"/><text x="173" y="63" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="800" fill="#fff">IA</text><text x="223" y="60" class="t h head">→</text><text x="263" y="60" class="t small">saída</text></g>
<g transform="translate(879 307)"><rect width="190" height="92" rx="14" class="card"/><text x="95" y="34" text-anchor="middle" class="t h head">Busca</text><text x="95" y="59" text-anchor="middle" class="t small">fontes e dados</text></g>
<g transform="translate(1085 307)"><rect width="229" height="92" rx="14" class="card"/><text x="114.5" y="34" text-anchor="middle" class="t h head">Ferramentas</text><text x="114.5" y="59" text-anchor="middle" class="t small">apps e serviços</text></g>
<g transform="translate(120 447)"><rect width="500" height="58" rx="16" fill="#f2f7fd"/><text x="24" y="36" class="t h head">Chat responde</text><text x="185" y="36" class="t body">você pergunta e recebe uma resposta</text></g>
<g transform="translate(780 447)"><rect width="500" height="58" rx="16" class="green"/><text x="24" y="36" class="t h head">Agente responde e age</text><text x="264" y="36" class="t body">com limites e permissão</text></g>
</svg>