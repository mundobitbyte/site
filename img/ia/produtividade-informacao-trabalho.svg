<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Da informação espalhada ao trabalho verificável</title>
<desc id="desc">Fluxo em três etapas: entradas dispersas, organização e saídas úteis, com textos dimensionados para permanecer dentro dos cartões.</desc>
<defs><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#10213d}.h{font-weight:800;fill:#0f4c9b}.small{font-size:15px}.body{font-size:17px}.head{font-size:21px}.title{font-size:30px}.panel{fill:#eef6ff;stroke:#9fc7f3;stroke-width:2.5}.card{fill:#fff;stroke:#cfdef0;stroke-width:2}.accent{fill:#286dcc}.green{fill:#eafff6}.violet{fill:#f3efff}.gold{fill:#fff7d6}.arrow{fill:#286dcc}
</style></defs>
<rect width="1400" height="560" rx="24" fill="#fbfdff"/>
<text x="42" y="48" class="t h title">Da informação espalhada ao trabalho verificável</text>
<text x="42" y="78" class="t body">Produtividade com IA é transformar material real em trabalho confiável.</text>
<g transform="translate(36 112)"><rect width="405" height="368" rx="22" class="panel"/><circle cx="46" cy="44" r="25" class="accent"/><text x="46" y="52" text-anchor="middle" font-family="system-ui" font-size="23" font-weight="800" fill="#fff">1</text><text x="88" y="51" class="t h head">Entradas dispersas</text><text x="28" y="82" class="t body">Informações chegam de vários lugares.</text><g transform="translate(28 104)"><rect width="349" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Mensagens</text><text x="18" y="42" class="t small">conversas, grupos e e-mails</text></g><g transform="translate(28 166)"><rect width="349" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Anotações</text><text x="18" y="42" class="t small">ideias soltas e registros</text></g><g transform="translate(28 228)"><rect width="349" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Regulamento</text><text x="18" y="42" class="t small">regras, prazos e critérios</text></g><g transform="translate(28 290)"><rect width="349" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Decisões verbais</text><text x="18" y="42" class="t small">reuniões e alinhamentos</text></g></g>
<path d="M462 292h44l-16-14 10-9 34 30-34 30-10-9 16-14h-44z" class="arrow"/>
<g transform="translate(522 112)"><rect width="356" height="368" rx="22" class="panel"/><circle cx="46" cy="44" r="25" class="accent"/><text x="46" y="52" text-anchor="middle" font-family="system-ui" font-size="23" font-weight="800" fill="#fff">2</text><text x="88" y="51" class="t h head">Organização</text><text x="28" y="82" class="t body">Estruturar sem inventar.</text><g transform="translate(28 104)"><rect width="300" height="44" rx="12" class="card"/><text x="18" y="29" class="t h head">Fatos</text></g><g transform="translate(28 157)"><rect width="300" height="44" rx="12" class="green"/><text x="18" y="29" class="t h head">Ações</text></g><g transform="translate(28 210)"><rect width="300" height="44" rx="12" class="violet"/><text x="18" y="29" class="t h head">Dúvidas</text></g><g transform="translate(28 263)"><rect width="300" height="44" rx="12" class="card"/><text x="18" y="29" class="t h head">Decisões</text></g><g transform="translate(28 316)"><rect width="300" height="44" rx="12" class="gold"/><text x="18" y="29" class="t h head">Dependências</text></g></g>
<path d="M900 292h44l-16-14 10-9 34 30-34 30-10-9 16-14h-44z" class="arrow"/>
<g transform="translate(960 112)"><rect width="404" height="368" rx="22" class="panel"/><circle cx="46" cy="44" r="25" class="accent"/><text x="46" y="52" text-anchor="middle" font-family="system-ui" font-size="23" font-weight="800" fill="#fff">3</text><text x="88" y="51" class="t h head">Saídas úteis</text><text x="28" y="82" class="t body">Prontas para agir e conferir.</text><g transform="translate(28 104)"><rect width="348" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Quadro de tarefas</text><text x="18" y="42" class="t small">o que, quem, prazo, pendência</text></g><g transform="translate(28 166)"><rect width="348" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Resumo</text><text x="18" y="42" class="t small">visão orientada ao uso</text></g><g transform="translate(28 228)"><rect width="348" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Mensagem</text><text x="18" y="42" class="t small">somente fatos confirmados</text></g><g transform="translate(28 290)"><rect width="348" height="52" rx="13" class="card"/><text x="18" y="23" class="t h head">Itens para validar</text><text x="18" y="42" class="t small">o que ainda precisa de conferência</text></g></g>
<rect x="205" y="505" width="990" height="38" rx="14" fill="#eaf3ff"/><text x="700" y="531" text-anchor="middle" class="t h body">A IA organiza o trabalho; a fonte real continua sendo a referência.</text>
</svg>