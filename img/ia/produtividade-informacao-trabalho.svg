<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Da informação espalhada ao trabalho verificável</title>
<desc id="desc">Fluxo em três etapas: entradas dispersas, organização e saídas úteis.</desc>
<defs><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#10213d}.h{font-weight:800;fill:#0f4c9b}.s{font-size:20px}.m{font-size:25px}.l{font-size:38px}.panel{fill:#eef6ff;stroke:#9fc7f3;stroke-width:3}.card{fill:#fff;stroke:#cfdef0;stroke-width:2}.line{stroke:#286dcc;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#286dcc}.green{fill:#eafff6}.violet{fill:#f3efff}.gold{fill:#fff7d6}
</style></defs>
<rect width="1200" height="720" rx="26" fill="#f9fcff"/>
<text x="48" y="58" class="t h l">Da informação espalhada ao trabalho verificável</text>
<text x="48" y="92" class="t s">Produtividade com IA é transformar material real em trabalho confiável.</text>
<g transform="translate(40 132)"><rect width="340" height="470" rx="24" class="panel"/><circle cx="44" cy="45" r="27" class="accent"/><text x="44" y="53" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">1</text><text x="90" y="55" class="t h m">Entradas dispersas</text><text x="28" y="94" class="t s">Informações chegam de vários lugares.</text>
<g transform="translate(28 122)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">mensagens</text><text x="24" y="56" class="t s">conversas, grupos, e-mails</text></g>
<g transform="translate(28 204)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">anotações</text><text x="24" y="56" class="t s">ideias soltas, registros</text></g>
<g transform="translate(28 286)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">regulamento</text><text x="24" y="56" class="t s">regras, prazos, critérios</text></g>
<g transform="translate(28 368)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">decisões verbais</text><text x="24" y="56" class="t s">reuniões, alinhamentos</text></g></g>
<path d="M390 366h55" class="line"/><path d="M433 354l18 12-18 12" class="line"/>
<g transform="translate(450 132)"><rect width="300" height="470" rx="24" class="panel"/><circle cx="44" cy="45" r="27" class="accent"/><text x="44" y="53" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">2</text><text x="90" y="55" class="t h m">Organização</text><text x="28" y="94" class="t s">A IA ajuda a estruturar sem inventar.</text>
<g transform="translate(28 122)"><rect width="244" height="57" rx="14" class="card"/><text x="20" y="37" class="t h m">fatos</text></g>
<g transform="translate(28 190)"><rect width="244" height="57" rx="14" class="green"/><text x="20" y="37" class="t h m">ações</text></g>
<g transform="translate(28 258)"><rect width="244" height="57" rx="14" class="violet"/><text x="20" y="37" class="t h m">dúvidas</text></g>
<g transform="translate(28 326)"><rect width="244" height="57" rx="14" class="card"/><text x="20" y="37" class="t h m">decisões</text></g>
<g transform="translate(28 394)"><rect width="244" height="57" rx="14" class="gold"/><text x="20" y="37" class="t h m">dependências</text></g></g>
<path d="M760 366h55" class="line"/><path d="M803 354l18 12-18 12" class="line"/>
<g transform="translate(820 132)"><rect width="340" height="470" rx="24" class="panel"/><circle cx="44" cy="45" r="27" class="accent"/><text x="44" y="53" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">3</text><text x="90" y="55" class="t h m">Saídas úteis</text><text x="28" y="94" class="t s">Informação pronta para agir e conferir.</text>
<g transform="translate(28 122)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">quadro de tarefas</text><text x="24" y="56" class="t s">o que, quem, prazo, pendência</text></g>
<g transform="translate(28 204)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">resumo</text><text x="24" y="56" class="t s">visão orientada ao uso</text></g>
<g transform="translate(28 286)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">mensagem</text><text x="24" y="56" class="t s">somente fatos confirmados</text></g>
<g transform="translate(28 368)"><rect width="284" height="70" rx="15" class="card"/><text x="24" y="31" class="t h m">itens para validação</text><text x="24" y="56" class="t s">o que ainda precisa ser conferido</text></g></g>
<rect x="130" y="630" width="940" height="60" rx="20" fill="#eaf3ff"/><text x="600" y="668" text-anchor="middle" class="t h m">Produtividade com IA não é pedir um texto: é transformar informação em trabalho confiável.</text>
</svg>