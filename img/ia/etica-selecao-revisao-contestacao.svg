<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
<title id="title">Seleção com critérios, revisão e contestação</title>
<desc id="desc">Oito etapas de uma seleção responsável, da definição do objetivo à possibilidade de correção e contestação, com a IA como apoio e não como dona da decisão.</desc>
<defs><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#10213d}.h{font-weight:800;fill:#0f4c9b}.small{font-size:15px}.body{font-size:17px}.head{font-size:20px}.title{font-size:30px}.card{fill:#f5f9ff;stroke:#c5dbf4;stroke-width:2}.focus{fill:#eaf3ff;stroke:#5b9be2;stroke-width:3}.accent{fill:#286dcc}.soft{fill:#eaf3ff}
</style></defs>
<rect width="1400" height="540" rx="24" fill="#fbfdff"/>
<text x="42" y="48" class="t h title">Seleção responsável: critérios, revisão e contestação</text>
<text x="42" y="78" class="t body">60 inscrições para 10 vagas: a IA pode ajudar a organizar, mas a decisão exige critérios claros e responsabilidade humana.</text>
<g transform="translate(42 112)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">1</text><text x="68" y="39" class="t h head">60 inscrições</text><text x="24" y="80" class="t body">Pessoas e documentos</text><text x="24" y="105" class="t small">são o ponto de partida.</text></g>
<g transform="translate(376 112)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">2</text><text x="68" y="39" class="t h head">Objetivo</text><text x="24" y="80" class="t body">O que a seleção precisa</text><text x="24" y="105" class="t body">alcançar?</text></g>
<g transform="translate(710 112)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">3</text><text x="68" y="39" class="t h head">Critérios explícitos</text><text x="24" y="80" class="t body">Regras claras, legítimas</text><text x="24" y="105" class="t body">e justificáveis.</text></g>
<g transform="translate(1044 112)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">4</text><text x="68" y="39" class="t h head">Dados necessários</text><text x="24" y="80" class="t body">Somente o que realmente</text><text x="24" y="105" class="t body">muda a análise.</text></g>
<g transform="translate(42 276)"><rect width="315" height="142" rx="18" class="focus"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">5</text><text x="68" y="39" class="t h head">IA auxilia</text><text x="24" y="80" class="t body">Organiza, agrupa e sinaliza.</text><text x="24" y="108" class="t h small">Não decide sozinha.</text></g>
<g transform="translate(376 276)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">6</text><text x="68" y="39" class="t h head">Revisão humana</text><text x="24" y="80" class="t body">Contexto, erros e decisão</text><text x="24" y="105" class="t body">final são conferidos.</text></g>
<g transform="translate(710 276)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">7</text><text x="68" y="39" class="t h head">Resultado</text><text x="24" y="80" class="t body">10 vagas com processo</text><text x="24" y="105" class="t body">explicável e transparente.</text></g>
<g transform="translate(1044 276)"><rect width="315" height="142" rx="18" class="card"/><circle cx="34" cy="34" r="21" class="accent"/><text x="34" y="41" text-anchor="middle" font-family="system-ui" font-size="21" font-weight="800" fill="#fff">8</text><text x="68" y="39" class="t h head">Contestação</text><text x="24" y="80" class="t body">Erros podem ser revistos</text><text x="24" y="105" class="t body">e corrigidos.</text></g>
<rect x="165" y="452" width="1070" height="48" rx="16" class="soft"/><text x="700" y="482" text-anchor="middle" class="t h body">A IA pode ser uma etapa do processo — não a dona da decisão.</text>
</svg>