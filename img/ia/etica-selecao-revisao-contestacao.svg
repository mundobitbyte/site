<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Seleção com critérios, revisão e contestação</title>
<desc id="desc">Fluxo de seleção com 60 inscrições para 10 vagas, mostrando objetivo, critérios, dados necessários, auxílio da IA, revisão humana e possibilidade de contestação.</desc>
<defs><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#10213d}.h{font-weight:800;fill:#0f4c9b}.s{font-size:18px}.m{font-size:22px}.l{font-size:36px}.panel{fill:#f4f9ff;stroke:#c5dbf4;stroke-width:2}.focus{fill:#eaf3ff;stroke:#5b9be2;stroke-width:4}.accent{fill:#286dcc}.line{stroke:#286dcc;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.footer{fill:#eaf3ff}
</style></defs>
<rect width="1200" height="720" rx="26" fill="#fbfdff"/>
<text x="48" y="56" class="t h l">Seleção com critérios, revisão e contestação</text>
<text x="48" y="89" class="t s">60 inscrições para 10 vagas: a IA pode auxiliar, mas a decisão continua exigindo critérios claros e responsabilidade humana.</text>
<g transform="translate(34 140)">
<g><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">1</text><text x="64" y="105" text-anchor="middle" class="t h m">60 inscrições</text><text x="64" y="150" text-anchor="middle" class="t s">pessoas e</text><text x="64" y="175" text-anchor="middle" class="t s">documentos</text></g>
<g transform="translate(144)"><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">2</text><text x="64" y="105" text-anchor="middle" class="t h m">objetivo</text><text x="64" y="135" text-anchor="middle" class="t h m">da seleção</text><text x="64" y="185" text-anchor="middle" class="t s">o que queremos</text><text x="64" y="210" text-anchor="middle" class="t s">alcançar?</text></g>
<g transform="translate(288)"><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">3</text><text x="64" y="105" text-anchor="middle" class="t h m">critérios</text><text x="64" y="135" text-anchor="middle" class="t h m">explícitos</text><text x="64" y="185" text-anchor="middle" class="t s">regras claras</text><text x="64" y="210" text-anchor="middle" class="t s">e justificáveis</text></g>
<g transform="translate(432)"><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">4</text><text x="64" y="105" text-anchor="middle" class="t h m">dados</text><text x="64" y="135" text-anchor="middle" class="t h m">necessários</text><text x="64" y="185" text-anchor="middle" class="t s">somente o que</text><text x="64" y="210" text-anchor="middle" class="t s">muda a análise</text></g>
<g transform="translate(576)"><rect width="128" height="360" rx="18" class="focus"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">5</text><rect x="35" y="90" width="58" height="58" rx="12" class="accent"/><text x="64" y="128" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="800" fill="#fff">IA</text><text x="64" y="185" text-anchor="middle" class="t h m">auxilia</text><text x="64" y="215" text-anchor="middle" class="t s">organiza, agrupa,</text><text x="64" y="240" text-anchor="middle" class="t s">sinaliza</text><text x="64" y="295" text-anchor="middle" class="t s">não decide</text><text x="64" y="320" text-anchor="middle" class="t s">sozinha</text></g>
<g transform="translate(720)"><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">6</text><text x="64" y="105" text-anchor="middle" class="t h m">revisão</text><text x="64" y="135" text-anchor="middle" class="t h m">humana</text><text x="64" y="185" text-anchor="middle" class="t s">contexto, erros</text><text x="64" y="210" text-anchor="middle" class="t s">e decisão final</text></g>
<g transform="translate(864)"><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">7</text><text x="64" y="105" text-anchor="middle" class="t h m">10 vagas</text><text x="64" y="160" text-anchor="middle" class="t s">resultado com</text><text x="64" y="185" text-anchor="middle" class="t s">transparência</text></g>
<g transform="translate(1008)"><rect width="128" height="360" rx="18" class="panel"/><circle cx="64" cy="42" r="24" class="accent"/><text x="64" y="50" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">8</text><text x="64" y="105" text-anchor="middle" class="t h m">correção</text><text x="64" y="135" text-anchor="middle" class="t h m">contestação</text><text x="64" y="185" text-anchor="middle" class="t s">revisar e</text><text x="64" y="210" text-anchor="middle" class="t s">corrigir erros</text></g>
<path d="M128 180h16M272 180h16M416 180h16M560 180h16M704 180h16M848 180h16M992 180h16" class="line"/>
</g>
<rect x="70" y="540" width="1060" height="70" rx="20" class="footer"/><text x="600" y="584" text-anchor="middle" class="t h m">A IA é uma etapa possível do processo — não a dona da decisão.</text>
<rect x="125" y="628" width="950" height="56" rx="18" fill="#f1f7ff"/><text x="600" y="664" text-anchor="middle" class="t m">Ética atravessa objetivo, dados, critérios, automação, revisão e consequência.</text>
</svg>