<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Laboratório com NAT e Host-only</title><desc id="d">Host Windows ADM-01 em .30 e VM SRV-01 em .20 comunicam pela rede Host-only. Adaptador NAT separado fornece downloads à VM. Não há Bridge, roteador .1 ou DNS da escola nessa rede.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#1967d2"/></marker></defs><rect width="760" height="610" rx="18" fill="#f5f9ff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172033"><text x="380" y="40" font-size="25" font-weight="bold">Um host, uma VM, duas funções de rede</text><rect x="165" y="65" width="430" height="84" rx="12" fill="#fff" stroke="#1967d2" stroke-width="2"/><text x="380" y="98" font-size="21" font-weight="bold">Windows · ADM-01</text><text x="380" y="128" font-size="18">Host-only 192.168.10.30/26</text><path d="M380 149V216" fill="none" stroke="#1967d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="218" width="430" height="72" rx="12" fill="#e5f5ee" stroke="#087f5b" stroke-width="2"/><text x="380" y="248" font-size="21" font-weight="bold">Rede Host-only do curso</text><text x="380" y="274" font-size="17">sem Bridge · sem gateway/DNS fictícios</text><path d="M380 290V352" fill="none" stroke="#1967d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="355" width="430" height="100" rx="12" fill="#fff" stroke="#1967d2" stroke-width="2"/><text x="380" y="387" font-size="21" font-weight="bold">Ubuntu Server · SRV-01</text><text x="380" y="416" font-size="18">Adaptador 2: 192.168.10.20/26</text><text x="380" y="440" font-size="18">Adaptador 1: DHCP pelo NAT</text><path d="M380 455V510" fill="none" stroke="#1967d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="514" width="430" height="60" rx="12" fill="#fff8df" stroke="#956700"/><text x="380" y="540" font-size="19" font-weight="bold">NAT temporário: pacotes e imagens</text><text x="380" y="562" font-size="16">sem redirecionamento de portas</text><text x="380" y="598" font-size="15">Esquema conceitual · confirme conflitos de faixa antes de configurar</text></g></svg>