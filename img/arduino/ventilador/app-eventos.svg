<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Do toque à mensagem: eventos do aplicativo</title><desc id="desc"></desc><defs><linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c8599"/><stop offset="1" stop-color="#07505e"/></linearGradient></defs><rect width="1200" height="650" fill="#f3f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#163a48" font-size="27" font-weight="700">Do toque à mensagem: eventos do aplicativo</text><rect x="50" y="105" width="540" height="120" rx="14" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><rect x="50" y="105" width="9" height="120" rx="3" fill="#0b7285" stroke="#0b7285" stroke-width="2"/><text x="76" y="142" fill="#163a48" font-size="20" font-weight="700">Conectar.BeforePicking</text><text x="76" y="184" fill="#163a48" font-size="18" font-weight="400">Listar aparelhos já pareados.</text><rect x="630" y="105" width="540" height="120" rx="14" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><rect x="630" y="105" width="9" height="120" rx="3" fill="#0b7285" stroke="#0b7285" stroke-width="2"/><text x="656" y="142" fill="#163a48" font-size="20" font-weight="700">Conectar.AfterPicking</text><text x="656" y="184" fill="#163a48" font-size="18" font-weight="400">Enviar 0; aguardar antes de liberar.</text><rect x="50" y="250" width="540" height="120" rx="14" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><rect x="50" y="250" width="9" height="120" rx="3" fill="#0b7285" stroke="#0b7285" stroke-width="2"/><text x="76" y="287" fill="#163a48" font-size="20" font-weight="700">VelocidadeN.Click</text><text x="76" y="329" fill="#163a48" font-size="18" font-weight="400">Sem espera: enviar 1, 2 ou 3.</text><rect x="630" y="250" width="540" height="120" rx="14" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><rect x="630" y="250" width="9" height="120" rx="3" fill="#0b7285" stroke="#0b7285" stroke-width="2"/><text x="656" y="287" fill="#163a48" font-size="20" font-weight="700">Desligar.Click</text><text x="656" y="329" fill="#163a48" font-size="18" font-weight="400">Reenviar 0 sem renovar sua espera.</text><rect x="50" y="395" width="540" height="120" rx="14" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><rect x="50" y="395" width="9" height="120" rx="3" fill="#0b7285" stroke="#0b7285" stroke-width="2"/><text x="76" y="432" fill="#163a48" font-size="20" font-weight="700">Clock.Timer · 500 ms</text><text x="76" y="474" fill="#163a48" font-size="18" font-weight="400">Conferir prazo; enviar ?; ler um byte.</text><rect x="630" y="395" width="540" height="120" rx="14" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><rect x="630" y="395" width="9" height="120" rx="3" fill="#0b7285" stroke="#0b7285" stroke-width="2"/><text x="656" y="432" fill="#163a48" font-size="20" font-weight="700">PermissionDenied / ErrorOccurred</text><text x="656" y="474" fill="#163a48" font-size="18" font-weight="400">Informar a falha e encerrar o enlace.</text><text x="50" y="605" fill="#163a48" font-size="18" font-weight="400">Mapa conceitual de eventos; não é captura. Importação MIT conferida; execução Android ainda pendente.</text></g></svg>