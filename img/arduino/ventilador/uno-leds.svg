<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc"><title id="title">Uno + três LEDs: localizar, ligar e conferir</title><desc id="desc">Cabecalho digital em ordem SCL, SDA, AREF, GND, 13 a 0. D5, D6 e D7 ligam cada qual um resistor de 330 ohms e um LED ao GND. Desenho simplificado autoral, nao fotografia.</desc><defs><linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c8599"/><stop offset="1" stop-color="#07505e"/></linearGradient></defs><rect width="1200" height="925" fill="#f3f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#163a48" font-size="27" font-weight="700">Uno + três LEDs: localizar, ligar e conferir</text><text x="45" y="100" fill="#163a48" font-size="21" font-weight="700">A · Confira as marcações no Uno Rev3 · USB à esquerda</text><rect x="85" y="170" width="1040" height="210" rx="22" fill="url(#board)" stroke="#06414c" stroke-width="2"/><rect x="40" y="210" width="115" height="90" rx="5" fill="#c6cdd2" stroke="#71808a" stroke-width="2"/><text x="55" y="263" fill="#163a48" font-size="22" font-weight="700">USB</text><rect x="360" y="240" width="350" height="65" rx="5" fill="#182b36" stroke="#07141b" stroke-width="2"/><text x="450" y="279" fill="#fff" font-size="24" font-weight="400">ATmega328P</text><text x="180" y="340" fill="#fff" font-size="21" font-weight="400">UNO REV3 · desenho simplificado, sem escala</text><rect x="200" y="166" width="30" height="30" rx="2" fill="#132632" stroke="#83b5bc" stroke-width="2"/><circle cx="215" cy="181" r="5" fill="#b7ced4"/><text x="201" y="151" fill="#163a48" font-size="16" font-weight="400">SCL</text><rect x="249" y="166" width="30" height="30" rx="2" fill="#132632" stroke="#83b5bc" stroke-width="2"/><circle cx="264" cy="181" r="5" fill="#b7ced4"/><text x="250" y="151" fill="#163a48" font-size="16" font-weight="400">SDA</text><rect x="298" y="166" width="30" height="30" rx="2" fill="#132632" stroke=