<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Relé: comando e contato cumprem funções diferentes</title><desc id="desc"></desc><defs><linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c8599"/><stop offset="1" stop-color="#07505e"/></linearGradient></defs><rect width="1200" height="640" fill="#f3f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#163a48" font-size="27" font-weight="700">Relé: comando e contato cumprem funções diferentes</text><rect x="70" y="130" width="470" height="390" rx="28" fill="#dbe5ec" stroke="#657d8c" stroke-width="2"/><rect x="105" y="165" width="165" height="170" rx="12" fill="#b87838" stroke="#68461c" stroke-width="2"/><path d="M120,180 L120,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M136,180 L136,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M152,180 L152,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M168,180 L168,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M184,180 L184,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M200,180 L200,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M216,180 L216,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M232,180 L232,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><path d="M248,180 L248,320" fill="none" stroke="#e6a457" stroke-width="8" stroke-linecap="round"/><text x="108" y="370" fill="#163a48" font-size="22" font-weight="700">Bobina</text><text x="108" y="402" fill="#163a48" font-size="18" font-weight="400">Campo magnético</text><text x="108" y="430" fill="#163a48" font-size="18" font-weight="400">move o contato</text><path d="M330,385 L425,260" fill="none" stroke="#2a4855" stroke-width="8" stroke-linecap="round"/><path d="M425,260 L480,260" fill="none" stroke="#2a4855" stroke-width="8" stroke-linecap="round"/><path d="M425,190 L480,190" fill="none" stroke="#2a4855" stroke-width="8" stroke-linecap="round"/><text x="480" y="298" fill="#163a48" font-size="19" font-weight="700">NF</text><text x="480" y="228" fill="#163a48" font-size="19" font-weight="700">NA</text><text x="325" y="423" fill="#163a48" font-size="19" font-weight="700">COM</text><text x="330" y="470" fill="#163a48" font-size="18" font-weight="400">Bobina desligada</text><rect x="600" y="130" width="530" height="180" rx="16" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><text x="625" y="170" fill="#163a48" font-size="24" font-weight="700">COM não significa GND</text><text x="625" y="208" fill="#163a48" font-size="20" font-weight="400">COM é o contato comum da chave.</text><text x="625" y="245" fill="#163a48" font-size="20" font-weight="400">NA: normalmente aberto.</text><text x="625" y="280" fill="#163a48" font-size="20" font-weight="400">NF: normalmente fechado.</text><rect x="600" y="340" width="530" height="180" rx="16" fill="#fff5df" stroke="#d5b575" stroke-width="2"/><text x="625" y="380" fill="#163a48" font-size="22" font-weight="700">Bobina e aparelho têm papéis diferentes</text><text x="625" y="418" fill="#163a48" font-size="19" font-weight="400">Algumas placas unem as referências.</text><text x="625" y="452" fill="#163a48" font-size="19" font-weight="400">Optoacoplador, sozinho, não comprova</text><text x="625" y="483" fill="#163a48" font-size="19" font-weight="400">isolamento de todo o conjunto.</text><text x="70" y="586" fill="#163a48" font-size="19" font-weight="400">Modelo conceitual ideal. Não representa bornes, pinagem ou capacidade de um módulo comercial.</text></g></svg>