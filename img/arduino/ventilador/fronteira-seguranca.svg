<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Duas etapas, duas responsabilidades</title><desc id="desc"></desc><defs><linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c8599"/><stop offset="1" stop-color="#07505e"/></linearGradient></defs><rect width="1200" height="640" fill="#f3f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#163a48" font-size="27" font-weight="700">Duas etapas, duas responsabilidades</text><rect x="65" y="130" width="490" height="370" rx="16" fill="#ecf8f7" stroke="#75adaf" stroke-width="2"/><text x="100" y="180" fill="#163a48" font-size="29" font-weight="700">Bancada de aprendizagem</text><text x="100" y="235" fill="#163a48" font-size="22" font-weight="400">Celular → Bluetooth → Arduino</text><text x="100" y="290" fill="#163a48" font-size="22" font-weight="400">Saídas → resistores → LEDs</text><text x="100" y="345" fill="#163a48" font-size="22" font-weight="400">Alimentação de bancada verificada</text><text x="100" y="400" fill="#163a48" font-size="22" font-weight="400">Sem ligação elétrica com a rede</text><rect x="650" y="130" width="490" height="370" rx="16" fill="#fff3e6" stroke="#c5a17d" stroke-width="2"/><text x="680" y="180" fill="#163a48" font-size="27" font-weight="700">Etapa profissional · 220 V</text><text x="680" y="235" fill="#163a48" font-size="21" font-weight="400">Motor e seletor identificados</text><text x="680" y="290" fill="#163a48" font-size="21" font-weight="400">Intertravamento e proteções</text><text x="680" y="345" fill="#163a48" font-size="21" font-weight="400">Invólucro, seccionamento e ensaios</text><text x="680" y="400" fill="#163a48" font-size="21" font-weight="400">Projeto específico ainda pendente</text><path d="M600,115 L600,525" fill="none" stroke="#a87031" stroke-width="6" stroke-linecap="round"/><text x="65" y="575" fill="#163a48" font-size="20" font-weight="400">Não há conexões de potência neste material experimental. O botão do app não isola a alimentação.</text></g></svg>