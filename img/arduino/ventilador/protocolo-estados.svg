<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="title desc"><title id="title">Conectar, esperar, confirmar: o que o app sabe</title><desc id="desc"></desc><defs><linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c8599"/><stop offset="1" stop-color="#07505e"/></linearGradient></defs><rect width="1200" height="875" fill="#f3f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#163a48" font-size="27" font-weight="700">Conectar, esperar, confirmar: o que o app sabe</text><text x="45" y="100" fill="#163a48" font-size="21" font-weight="400">Como o app 0.3 usa o programa 3 · não mede movimento</text><rect x="45" y="150" width="480" height="135" rx="16" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><text x="67" y="186" fill="#163a48" font-size="23" font-weight="700">1 · Desconectado</text><text x="67" y="226" fill="#163a48" font-size="18" font-weight="400">Quatro botões bloqueados.</text><text x="67" y="257" fill="#163a48" font-size="18" font-weight="400">Conectar inicia enviando texto 0.</text><rect x="675" y="150" width="480" height="135" rx="16" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><text x="697" y="186" fill="#163a48" font-size="23" font-weight="700">2 · Aguardando 0</text><text x="697" y="226" fill="#163a48" font-size="18" font-weight="400">Velocidades bloqueadas; Desligar ativo.</text><text x="697" y="257" fill="#163a48" font-size="18" font-weight="400">Só confirmação 0 no prazo libera.</text><rect x="675" y="390" width="480" height="135" rx="16" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><text x="697" y="426" fill="#163a48" font-size="23" font-weight="700">3 · Pronto para escolher</text><text x="697" y="466" fill="#163a48" font-size="18" font-weight="400">1, 2 ou 3 inicia uma nova espera.</text><text x="697" y="497" fill="#163a48" font-size="18" font-weight="400">O comando 0 solicita apagar os LEDs.</text><rect x="45" y="390" width="480" height="135" rx="16" fill="#fff" stroke="#b9cfd5" stroke-width="2"/><text x="67" y="426" fill="#163a48" font-size="23" font-weight="700">4 · Aguardando o comando</text><text x="67" y="466" fill="#163a48" font-size="18" font-weight="400">Só a resposta esperada libera.</text><text x="67" y="497" fill="#163a48" font-size="18" font-weight="400">Outro estado válido não renova prazo.</text><path d="M530,220 L665,220" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><text x="540" y="200" fill="#163a48" font-size="17" font-weight="400">conectar</text><path d="M915,290 L915,380" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><text x="930" y="340" fill="#163a48" font-size="17" font-weight="400">ACK 0</text><path d="M665,450 L535,450" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><text x="550" y="430" fill="#163a48" font-size="17" font-weight="400">comando</text><path d="M285,380 L285,310" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><path d="M285,310 L720,310" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><path d="M720,310 L720,380" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><text x="328" y="332" fill="#163a48" font-size="17" font-weight="400">ACK esperado → pronto</text><polygon points="655,212 665,220 655,228" fill="#0d8393"/><polygon points="907,370 915,380 923,370" fill="#0d8393"/><polygon points="545,442 535,450 545,458" fill="#0d8393"/><polygon points="712,370 720,380 728,370" fill="#0d8393"/><rect x="45" y="585" width="1110" height="170" rx="16" fill="#fff5df" stroke="#d5b575" stroke-width="2"/><text x="70" y="625" fill="#163a48" font-size="26" font-weight="700">Desligar conserva o prazo de confirmação</text><text x="70" y="666" fill="#163a48" font-size="18" font-weight="400">Esperava 1/2/3? O primeiro 0 inicia seu prazo. Já esperava 0? Reenvio mantém o prazo original.</text><text x="70" y="704" fill="#163a48" font-size="19" font-weight="400">Prazo vencido, erro ou resposta inválida → encerra a conexão e bloqueia os botões.</text><text x="45" y="800" fill="#163a48" font-size="20" font-weight="400">Timer: conferir prazo → enviar ? se conectado → ler um caractere disponível.</text><text x="45" y="837" fill="#163a48" font-size="19" font-weight="400">O Android e seu relógio podem alterar o tempo observado. Isso não protege um motor.</text></g></svg>