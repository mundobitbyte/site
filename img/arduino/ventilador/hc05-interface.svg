<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">TX transmite; RX recebe</title><desc id="desc"></desc><defs><linearGradient id="board" x2="1" y2="1"><stop stop-color="#0c8599"/><stop offset="1" stop-color="#07505e"/></linearGradient></defs><rect width="1200" height="640" fill="#f3f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#163a48" font-size="27" font-weight="700">TX transmite; RX recebe</text><rect x="65" y="155" width="310" height="320" rx="16" fill="url(#board)" stroke="#06414c" stroke-width="2"/><text x="100" y="208" fill="#fff" font-size="30" font-weight="700">Arduino Uno</text><text x="100" y="270" fill="#fff" font-size="23" font-weight="400">D2 · recebe (RX)</text><text x="100" y="370" fill="#fff" font-size="23" font-weight="400">D3 · envia (TX)</text><text x="100" y="430" fill="#fff" font-size="22" font-weight="400">Referência GND</text><rect x="830" y="155" width="310" height="320" rx="16" fill="#103043" stroke="#071c2a" stroke-width="2"/><text x="867" y="208" fill="#fff" font-size="31" font-weight="700">HC-05</text><text x="867" y="270" fill="#fff" font-size="22" font-weight="400">TX do módulo</text><text x="867" y="370" fill="#fff" font-size="22" font-weight="400">RX do módulo</text><text x="867" y="430" fill="#fff" font-size="22" font-weight="400">GND</text><path d="M830,263 L375,263" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><text x="480" y="242" fill="#163a48" font-size="20" font-weight="400">níveis compatíveis</text><path d="M375,363 L435,363" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><rect x="435" y="316" width="335" height="89" rx="8" fill="#fff5df" stroke="#bca46b" stroke-width="2"/><text x="455" y="350" fill="#163a48" font-size="23" font-weight="700">Adaptação de nível</text><text x="455" y="383" fill="#163a48" font-size="19" font-weight="400">dimensionada e verificada</text><path d="M770,363 L830,363" fill="none" stroke="#0d8393" stroke-width="5" stroke-linecap="round"/><path d="M375,423 L830,423" fill="none" stroke="#283b48" stroke-width="5" stroke-linecap="round"/><text x="70" y="535" fill="#163a48" font-size="19" font-weight="400">A tensão de VCC depende da placa exata. VCC e RX não têm, necessariamente, a mesma tolerância.</text><text x="70" y="578" fill="#163a48" font-size="20" font-weight="700">Confira a placa HC-05 antes de definir alimentação e adaptação dos sinais.</text></g></svg>