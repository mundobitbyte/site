<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 e LCD 16x2 com módulo I2C</title>
  <desc id="desc">Diagrama técnico mostrando SDA do LCD no GPIO 21, SCL no GPIO 22 e GND comum. A alimentação VCC deve ser confirmada conforme o módulo e seus pull-ups.</desc>
  <rect width="1200" height="720" fill="#f6f8fa"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#073f49">I2C — ESP32 + LCD 16x2</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">SDA e SCL são os sinais do barramento; a alimentação precisa ser conferida no módulo real.</text>
  <rect x="70" y="140" width="330" height="440" rx="28" fill="#111827" stroke="#334155" stroke-width="4"/>
  <rect x="120" y="195" width="230" height="160" rx="14" fill="#9ca3af"/>
  <text x="235" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">ESP-WROOM-32</text>
  <text x="235" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">ESP32 DOIT</text>
  <text x="235" y="546" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e2e8f0">DevKit V1</text>
  <rect x="790" y="175" width="340" height="300" rx="18" fill="#15803d" stroke="#166534" stroke-width="4"/>
  <rect x="835" y="235" width="250" height="120" rx="10" fill="#0b3f9c" stroke="#082f75" stroke-width="4"/>
  <text x="960" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#dbeafe">LCD 16x2</text>
  <text x="960" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#bfdbfe">com backpack I2C</text>
  <circle cx="400" cy="245" r="9" fill="#0f766e"/>
  <circle cx="400" cy="335" r="9" fill="#d97706"/>
  <circle cx="400" cy="425" r="9" fill="#111827" stroke="#e2e8f0" stroke-width="2"/>
  <text x="370" y="251" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">GPIO 21 / SDA</text>
  <text x="370" y="341" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#b45309">GPIO 22 / SCL</text>
  <text x="370" y="431" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">GND</text>
  <circle cx="790" cy="245" r="9" fill="#0f766e"/>
  <circle cx="790" cy="335" r="9" fill="#d97706"/>
  <circle cx="790" cy="425" r="9" fill="#111827"/>
  <circle cx="790" cy="505" r="9" fill="#b45309"/>
  <text x="815" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#eaffff">SDA</text>
  <text x="815" y="341" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff7df">SCL</text>
  <text x="815" y="431" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">GND</text>
  <text x="815" y="511" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff7df">VCC</text>
  <path d="M400 245 H790" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 335 H790" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 425 H790" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
  <path d="M790 505 H740" fill="none" stroke="#b45309" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
  <rect x="395" y="478" width="345" height="72" rx="14" fill="#fff7df" stroke="#d97706" stroke-width="2"/>
  <text x="568" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#92400e">VCC não é fixado neste desenho</text>
  <text x="568" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#92400e">confirme alimentação e pull-ups do seu backpack</text>
  <rect x="145" y="610" width="910" height="72" rx="16" fill="#fff7df" stroke="#f3d68a" stroke-width="2"/>
  <text x="600" y="639" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">Atenção elétrica</text>
  <text x="600" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#78350f">Se SDA/SCL do backpack forem puxados para 5 V, não ligue essas linhas diretamente ao ESP32: use adaptação de nível.</text>
</svg>
