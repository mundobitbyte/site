<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Componentes e formas de prototipação</title>
  <desc id="desc">Quadro didático com capacitor, indutor, circuito integrado, placa, módulo, shield e kit.</desc>
  <rect width="1200" height="650" fill="#f6f8fa"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#073f49">Componentes e blocos que aparecem nos protótipos</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Reconhecer a categoria ajuda a entender o papel de cada peça antes de ligá-la.</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(55 125)"><rect width="250" height="205" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="75" y1="60" x2="175" y2="60" stroke="#334155" stroke-width="7"/><line x1="105" y1="35" x2="105" y2="85" stroke="#334155" stroke-width="7"/><line x1="145" y1="35" x2="145" y2="85" stroke="#334155" stroke-width="7"/>
      <text x="125" y="125" text-anchor="middle" font-size="21" font-weight="700" fill="#073f49">Capacitor</text><text x="125" y="154" text-anchor="middle" font-size="15" fill="#475569">armazena carga</text><text x="125" y="177" text-anchor="middle" font-size="15" fill="#475569">temporariamente</text>
    </g>
    <g transform="translate(335 125)"><rect width="250" height="205" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M55 62 h25 c0 -36 35 -36 35 0 c0 -36 35 -36 35 0 c0 -36 35 -36 35 0 h20" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
      <text x="125" y="125" text-anchor="middle" font-size="21" font-weight="700" fill="#073f49">Indutor</text><text x="125" y="154" text-anchor="middle" font-size="15" fill="#475569">armazena energia</text><text x="125" y="177" text-anchor="middle" font-size="15" fill="#475569">em campo magnético</text>
    </g>
    <g transform="translate(615 125)"><rect width="250" height="205" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="70" y="32" width="110" height="70" rx="10" fill="#1f2937"/><g stroke="#d97706" stroke-width="5"><line x1="58" y1="42" x2="70" y2="42"/><line x1="58" y1="62" x2="70" y2="62"/><line x1="58" y1="82" x2="70" y2="82"/><line x1="180" y1="42" x2="192" y2="42"/><line x1="180" y1="62" x2="192" y2="62"/><line x1="180" y1="82" x2="192" y2="82"/></g>
      <text x="125" y="125" text-anchor="middle" font-size="21" font-weight="700" fill="#073f49">Circuito integrado</text><text x="125" y="154" text-anchor="middle" font-size="15" fill="#475569">vários componentes</text><text x="125" y="177" text-anchor="middle" font-size="15" fill="#475569">no mesmo chip</text>
    </g>
    <g transform="translate(895 125)"><rect width="250" height="205" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="55" y="30" width="140" height="80" rx="14" fill="#158aa4"/><rect x="95" y="52" width="60" height="34" rx="7" fill="#111827"/>
      <text x="125" y="125" text-anchor="middle" font-size="21" font-weight="700" fill="#073f49">Placa</text><text x="125" y="154" text-anchor="middle" font-size="15" fill="#475569">base de desenvolvimento</text><text x="125" y="177" text-anchor="middle" font-size="15" fill="#475569">com recursos integrados</text>
    </g>

    <g transform="translate(120 375)"><rect width="280" height="190" rx="20" fill="#eef9fb" stroke="#8bc9d4" stroke-width="3"/>
      <text x="140" y="55" text-anchor="middle" font-size="23" font-weight="700" fill="#07515f">Módulo</text><text x="140" y="90" text-anchor="middle" font-size="16" fill="#334155">circuito pronto para uma função</text><text x="140" y="119" text-anchor="middle" font-size="15" fill="#475569">Ex.: sensor ultrassônico</text><text x="140" y="145" text-anchor="middle" font-size="15" fill="#475569">ou módulo Bluetooth</text>
    </g>
    <g transform="translate(460 375)"><rect width="280" height="190" rx="20" fill="#eef4ff" stroke="#9fbbe8" stroke-width="3"/>
      <text x="140" y="55" text-anchor="middle" font-size="23" font-weight="700" fill="#173a70">Shield</text><text x="140" y="90" text-anchor="middle" font-size="16" fill="#334155">placa encaixável sobre outra</text><text x="140" y="119" text-anchor="middle" font-size="15" fill="#475569">acrescenta recursos sem</text><text x="140" y="145" text-anchor="middle" font-size="15" fill="#475569">substituir a placa principal</text>
    </g>
    <g transform="translate(800 375)"><rect width="280" height="190" rx="20" fill="#f0fdf4" stroke="#86c99a" stroke-width="3"/>
      <text x="140" y="55" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">Kit</text><text x="140" y="90" text-anchor="middle" font-size="16" fill="#334155">conjunto de peças para</text><text x="140" y="119" text-anchor="middle" font-size="15" fill="#475569">experimentação e montagem</text><text x="140" y="145" text-anchor="middle" font-size="15" fill="#475569">de vários protótipos</text>
    </g>
  </g>
</svg>