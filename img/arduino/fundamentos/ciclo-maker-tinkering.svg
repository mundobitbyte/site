<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo maker e tinkering</title>
  <desc id="desc">Fluxo iterativo: necessidade, montar, testar, observar, modificar e testar novamente.</desc>
  <rect width="1200" height="520" fill="#f6f8fa"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#073f49">Maker e tinkering: aprender construindo e melhorando</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">O protótipo não precisa nascer perfeito. Ele evolui quando você observa o resultado e faz uma nova tentativa.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 180)"><rect width="170" height="95" rx="22" fill="#eef9fb" stroke="#8bc9d4" stroke-width="3"/><text x="85" y="42" font-size="20" font-weight="700" fill="#07515f">Necessidade</text><text x="85" y="69" font-size="15" fill="#334155">o que resolver?</text></g>
    <g transform="translate(275 180)"><rect width="170" height="95" rx="22" fill="#eef4ff" stroke="#9fbbe8" stroke-width="3"/><text x="85" y="42" font-size="20" font-weight="700" fill="#173a70">Montar</text><text x="85" y="69" font-size="15" fill="#334155">criar o protótipo</text></g>
    <g transform="translate(480 180)"><rect width="170" height="95" rx="22" fill="#f0fdf4" stroke="#86c99a" stroke-width="3"/><text x="85" y="42" font-size="20" font-weight="700" fill="#166534">Testar</text><text x="85" y="69" font-size="15" fill="#334155">ver o que acontece</text></g>
    <g transform="translate(685 180)"><rect width="170" height="95" rx="22" fill="#fff7df" stroke="#e9bd61" stroke-width="3"/><text x="85" y="42" font-size="20" font-weight="700" fill="#92400e">Observar</text><text x="85" y="69" font-size="15" fill="#334155">comparar com o esperado</text></g>
    <g transform="translate(890 180)"><rect width="170" height="95" rx="22" fill="#fdf2f8" stroke="#dea1c1" stroke-width="3"/><text x="85" y="42" font-size="20" font-weight="700" fill="#9d174d">Modificar</text><text x="85" y="69" font-size="15" fill="#334155">ajustar e tentar de novo</text></g>
  </g>
  <g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 228 H265"/><path d="M445 228 H470"/><path d="M650 228 H675"/><path d="M855 228 H880"/>
    <path d="M975 290 C975 405 565 420 565 295" stroke="#0f766e"/>
  </g>
  <g fill="#64748b"><path d="M265 228 l-13 -9 v18z"/><path d="M470 228 l-13 -9 v18z"/><path d="M675 228 l-13 -9 v18z"/><path d="M880 228 l-13 -9 v18z"/></g>
  <path d="M565 295 l-10 17 h20z" fill="#0f766e"/>
  <text x="770" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">testar novamente</text>
  <rect x="190" y="452" width="820" height="42" rx="14" fill="#ffffff" stroke="#dbe4e8" stroke-width="2"/>
  <text x="600" y="479" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Nos projetos Arduino, errar uma ligação, corrigir o código e melhorar o protótipo faz parte do processo de aprendizagem.</text>
</svg>