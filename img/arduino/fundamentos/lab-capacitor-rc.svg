<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mini-laboratório de descarga de capacitor com LED</title>
  <desc id="desc">Arduino usado como fonte de 5 volts e GND; 5 volts passa por resistor de 220 ohms até um nó ligado ao capacitor eletrolítico e a um ramo com resistor de 1 quilohm e LED até o GND. Ao retirar o jumper de 5 volts, o capacitor descarrega pelo LED.</desc>
  <rect width="1200" height="700" rx="28" fill="#f8fbfc"/>
  <rect x="65" y="120" width="300" height="430" rx="24" fill="#ffffff" stroke="#8fb9c2" stroke-width="4"/>
  <text x="215" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#12343b">Arduino Uno</text>
  <rect x="110" y="245" width="115" height="58" rx="10" fill="#eaf7fa" stroke="#69a9b7" stroke-width="3"/>
  <text x="168" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#07515f">5V</text>
  <rect x="110" y="435" width="115" height="58" rx="10" fill="#eaf7fa" stroke="#69a9b7" stroke-width="3"/>
  <text x="168" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#07515f">GND</text>
  <line x1="225" y1="274" x2="430" y2="274" stroke="#d55b32" stroke-width="8"/>
  <text x="325" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#9a3412">jumper removível</text>
  <rect x="430" y="244" width="180" height="60" rx="10" fill="#fff4cc" stroke="#b38a20" stroke-width="4"/>
  <text x="520" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5b4610">220 Ω</text>
  <line x1="610" y1="274" x2="740" y2="274" stroke="#d55b32" stroke-width="8"/>
  <circle cx="740" cy="274" r="12" fill="#07515f"/>
  <text x="740" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#07515f">nó de carga</text>
  <path d="M740 274 L740 405" fill="none" stroke="#1b7384" stroke-width="8"/>
  <line x1="700" y1="405" x2="780" y2="405" stroke="#d55b32" stroke-width="10"/>
  <line x1="700" y1="445" x2="780" y2="445" stroke="#12343b" stroke-width="10"/>
  <text x="830" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#12343b">470–1000 µF</text>
  <text x="685" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#d55b32">+</text>
  <text x="685" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#12343b">−</text>
  <path d="M740 445 L740 510 L225 510 L225 464" fill="none" stroke="#334155" stroke-width="8"/>
  <path d="M740 274 L955 274" fill="none" stroke="#1b7384" stroke-width="8"/>
  <rect x="840" y="244" width="150" height="60" rx="10" fill="#fff4cc" stroke="#b38a20" stroke-width="4"/>
  <text x="915" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5b4610">1 kΩ</text>
  <line x1="990" y1="274" x2="1040" y2="274" stroke="#1b7384" stroke-width="8"/>
  <polygon points="1040,238 1040,310 1100,274" fill="#fde68a" stroke="#a16207" stroke-width="4"/>
  <line x1="1100" y1="235" x2="1100" y2="313" stroke="#a16207" stroke-width="7"/>
  <text x="1070" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#12343b">LED</text>
  <path d="M1100 274 L1140 274 L1140 510 L740 510" fill="none" stroke="#334155" stroke-width="8"/>
  <text x="600" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#12343b">Carregue com 5V; depois retire apenas o jumper de 5V.</text>
  <text x="600" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#475569">O capacitor descarrega pelo ramo resistor + LED, mantendo a luz por um breve instante.</text>
</svg>
