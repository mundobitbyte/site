<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mini-laboratório de carga e descarga de capacitor com Arduino</title>
  <desc id="desc">Pino digital 8 do Arduino ligado a resistor de 10 quilohms, nó de leitura conectado ao A0 e ao terminal positivo de capacitor eletrolítico de 100 microfarads, com terminal negativo no GND.</desc>
  <rect width="1200" height="700" rx="28" fill="#f8fbfc"/>
  <rect x="70" y="120" width="330" height="430" rx="24" fill="#ffffff" stroke="#8fb9c2" stroke-width="4"/>
  <text x="235" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#12343b">Arduino Uno</text>
  <rect x="110" y="215" width="120" height="58" rx="10" fill="#eaf7fa" stroke="#69a9b7" stroke-width="3"/>
  <text x="170" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#07515f">D8</text>
  <rect x="110" y="330" width="120" height="58" rx="10" fill="#eaf7fa" stroke="#69a9b7" stroke-width="3"/>
  <text x="170" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#07515f">A0</text>
  <rect x="110" y="445" width="120" height="58" rx="10" fill="#eaf7fa" stroke="#69a9b7" stroke-width="3"/>
  <text x="170" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#07515f">GND</text>
  <line x1="230" y1="244" x2="500" y2="244" stroke="#1b7384" stroke-width="8"/>
  <rect x="500" y="214" width="190" height="60" rx="10" fill="#fff4cc" stroke="#b38a20" stroke-width="4"/>
  <text x="595" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5b4610">10 kΩ</text>
  <line x1="690" y1="244" x2="820" y2="244" stroke="#1b7384" stroke-width="8"/>
  <circle cx="820" cy="244" r="12" fill="#07515f"/>
  <text x="820" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#07515f">nó de leitura</text>
  <path d="M820 244 L820 359 L230 359" fill="none" stroke="#1b7384" stroke-width="8"/>
  <text x="505" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">leitura analógica</text>
  <line x1="820" y1="244" x2="940" y2="244" stroke="#1b7384" stroke-width="8"/>
  <line x1="940" y1="200" x2="940" y2="290" stroke="#d55b32" stroke-width="10"/>
  <line x1="980" y1="200" x2="980" y2="290" stroke="#12343b" stroke-width="10"/>
  <text x="960" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#12343b">100 µF</text>
  <text x="918" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#d55b32">+</text>
  <text x="1000" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12343b">−</text>
  <path d="M980 244 L1060 244 L1060 474 L230 474" fill="none" stroke="#334155" stroke-width="8"/>
  <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#12343b">D8 → 10 kΩ → nó → A0 e capacitor (+) | capacitor (−) → GND</text>
  <text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#475569">Ao alternar D8 entre HIGH e LOW, o A0 mostra a subida e a descida gradual da tensão.</text>
</svg>
