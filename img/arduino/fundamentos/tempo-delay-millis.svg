<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Comparação entre delay e millis</title>
  <desc id="desc">Duas linhas do tempo mostram que delay bloqueia a execução, enquanto millis permite verificar o tempo e continuar executando outras tarefas.</desc>
  <rect width="1200" height="620" fill="#f6f8fa"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#073f49">Esperar não precisa significar parar o programa</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Compare uma pausa bloqueante com o acompanhamento do tempo usando millis().</text>

  <text x="70" y="150" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#991b1b">Com delay()</text>
  <line x1="210" y1="142" x2="1100" y2="142" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <rect x="235" y="110" width="520" height="64" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="495" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#991b1b">delay(3000): execução fica presa aqui</text>
  <text x="495" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7f1d1d">durante a espera, o fluxo não avança para outras tarefas</text>
  <rect x="790" y="110" width="250" height="64" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <text x="915" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">próxima instrução</text>

  <text x="70" y="310" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#166534">Com millis()</text>
  <line x1="210" y1="302" x2="1100" y2="302" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(230 267)"><rect width="190" height="70" rx="16" fill="#f0fdf4" stroke="#86c99a" stroke-width="3"/><text x="95" y="31" font-size="16" font-weight="700" fill="#166534">verifica o tempo</text><text x="95" y="53" font-size="14" fill="#334155">ainda não passou</text></g>
    <g transform="translate(450 267)"><rect width="190" height="70" rx="16" fill="#eef4ff" stroke="#9fbbe8" stroke-width="3"/><text x="95" y="31" font-size="16" font-weight="700" fill="#173a70">lê sensor</text><text x="95" y="53" font-size="14" fill="#334155">outra tarefa</text></g>
    <g transform="translate(670 267)"><rect width="190" height="70" rx="16" fill="#fff7df" stroke="#e9bd61" stroke-width="3"/><text x="95" y="31" font-size="16" font-weight="700" fill="#92400e">verifica botão</text><text x="95" y="53" font-size="14" fill="#334155">programa continua</text></g>
    <g transform="translate(890 267)"><rect width="190" height="70" rx="16" fill="#f0fdf4" stroke="#86c99a" stroke-width="3"/><text x="95" y="31" font-size="16" font-weight="700" fill="#166534">tempo atingido</text><text x="95" y="53" font-size="14" fill="#334155">muda a saída</text></g>
  </g>

  <rect x="115" y="420" width="970" height="125" rx="20" fill="#ffffff" stroke="#dbe4e8" stroke-width="2"/>
  <text x="600" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#073f49">A ideia principal</text>
  <text x="600" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">delay() manda o fluxo esperar. millis() informa quanto tempo passou desde que a placa iniciou.</text>
  <text x="600" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Com essa informação, o programa pode decidir quando agir sem deixar de executar outras partes do loop().</text>
</svg>