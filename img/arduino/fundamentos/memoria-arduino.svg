<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Memórias usadas em um microcontrolador</title>
  <desc id="desc">Diagrama introdutório separando memória de programa, memória de trabalho e memória persistente para configurações.</desc>
  <rect width="1200" height="650" fill="#f6f8fa"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#073f49">Onde ficam programa e dados?</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">O microcontrolador usa tipos de memória diferentes porque nem toda informação precisa durar pelo mesmo tempo.</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(90 150)"><rect width="300" height="330" rx="24" fill="#eef4ff" stroke="#9fbbe8" stroke-width="3"/>
      <text x="150" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#173a70">Memória de programa</text>
      <text x="150" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Flash</text>
      <text x="35" y="130" font-size="16" fill="#334155">• guarda o programa compilado</text>
      <text x="35" y="164" font-size="16" fill="#334155">• não some ao desligar</text>
      <text x="35" y="198" font-size="16" fill="#334155">• recebe o novo programa</text>
      <text x="35" y="222" font-size="16" fill="#334155">  durante o upload</text>
      <rect x="42" y="255" width="216" height="46" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="150" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#173a70">ex.: Blink gravado na placa</text>
    </g>

    <g transform="translate(450 150)"><rect width="300" height="330" rx="24" fill="#f0fdf4" stroke="#86c99a" stroke-width="3"/>
      <text x="150" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#166534">Memória de trabalho</text>
      <text x="150" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">RAM</text>
      <text x="35" y="130" font-size="16" fill="#334155">• guarda variáveis em uso</text>
      <text x="35" y="164" font-size="16" fill="#334155">• muda durante a execução</text>
      <text x="35" y="198" font-size="16" fill="#334155">• perde o conteúdo ao</text>
      <text x="35" y="222" font-size="16" fill="#334155">  desligar ou reiniciar</text>
      <rect x="42" y="255" width="216" height="46" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="150" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">ex.: distancia, leitura, estado</text>
    </g>

    <g transform="translate(810 150)"><rect width="300" height="330" rx="24" fill="#fff7df" stroke="#e9bd61" stroke-width="3"/>
      <text x="150" y="52" text-anchor="middle" font-size="25" font-weight="700" fill="#92400e">Dados persistentes</text>
      <text x="150" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">EEPROM / equivalente</text>
      <text x="35" y="130" font-size="16" fill="#334155">• guarda pequenas configurações</text>
      <text x="35" y="164" font-size="16" fill="#334155">• pode permanecer após desligar</text>
      <text x="35" y="198" font-size="16" fill="#334155">• não deve receber gravações</text>
      <text x="35" y="222" font-size="16" fill="#334155">  desnecessárias em sequência</text>
      <rect x="42" y="255" width="216" height="46" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="150" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">ex.: limite calibrado pelo usuário</text>
    </g>
  </g>
  <rect x="150" y="535" width="900" height="72" rx="16" fill="#ffffff" stroke="#dbe4e8" stroke-width="2"/>
  <text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#073f49">Pergunta-guia</text>
  <text x="600" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Essa informação precisa existir só enquanto o programa roda ou precisa continuar depois que a placa for desligada?</text>
</svg>