<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Escopo de variáveis em Arduino</title>
  <desc id="desc">Diagrama mostrando variável global acessível por várias funções e variável local visível apenas dentro da função em que foi criada.</desc>
  <rect width="1200" height="610" fill="#f6f8fa"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#073f49">Escopo: onde cada variável pode ser usada?</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">A posição em que a variável é declarada determina em quais partes do programa ela é visível.</text>

  <rect x="85" y="130" width="1030" height="390" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="125" y="170" width="950" height="74" rx="18" fill="#eef4ff" stroke="#9fbbe8" stroke-width="3"/>
  <text x="600" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173a70">Variável global: const int pinoTrig = 3;</text>
  <text x="600" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">declarada fora das funções → pode ser usada por setup(), loop() e medirDistancia()</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(140 300)"><rect width="260" height="150" rx="20" fill="#eef9fb" stroke="#8bc9d4" stroke-width="3"/><text x="130" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#07515f">setup()</text><text x="28" y="82" font-size="15" fill="#334155">usa pinoTrig</text><text x="28" y="112" font-size="15" fill="#334155">configura os pinos</text></g>
    <g transform="translate(470 300)"><rect width="260" height="150" rx="20" fill="#f0fdf4" stroke="#86c99a" stroke-width="3"/><text x="130" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">loop()</text><text x="28" y="82" font-size="15" fill="#334155">usa pinoTrig</text><text x="28" y="112" font-size="15" fill="#334155">chama a medição</text></g>
    <g transform="translate(800 300)"><rect width="260" height="150" rx="20" fill="#fff7df" stroke="#e9bd61" stroke-width="3"/><text x="130" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">medirDistancia()</text><text x="28" y="82" font-size="15" fill="#334155">usa pinoTrig</text><text x="28" y="112" font-size="15" fill="#334155">cria uma variável local</text></g>
  </g>

  <rect x="735" y="465" width="330" height="96" rx="18" fill="#fdf2f8" stroke="#dea1c1" stroke-width="3"/>
  <text x="900" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9d174d">Variável local</text>
  <text x="900" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">existe apenas dentro da função/bloco</text>
  <text x="900" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">em que foi declarada</text>

  <path d="M965 450 V462" stroke="#9d174d" stroke-width="5" fill="none"/>
  <path d="M965 462 l-10 -15 h20z" fill="#9d174d"/>
</svg>