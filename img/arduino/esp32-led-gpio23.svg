<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 com LED no GPIO 23</title>
  <desc id="desc">Diagrama técnico: GPIO 23 do ESP32 ligado a resistor de 220 ohms, depois ao LED, com retorno ao GND.</desc>
  <rect width="1200" height="720" fill="#f6f8fa"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#073f49">Circuito-base — ESP32 + LED</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">GPIO 23 → resistor 220 Ω → LED → GND</text>
  <rect x="80" y="135" width="320" height="470" rx="28" fill="#111827" stroke="#334155" stroke-width="4"/>
  <rect x="125" y="190" width="230" height="170" rx="14" fill="#9ca3af"/>
  <text x="240" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">ESP-WROOM-32</text>
  <text x="240" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#f8fafc">Wi-Fi • Bluetooth</text>
  <text x="240" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">ESP32 DOIT</text>
  <text x="240" y="552" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e2e8f0">DevKit V1</text>
  <circle cx="400" cy="285" r="9" fill="#0f766e"/>
  <circle cx="400" cy="470" r="9" fill="#111827" stroke="#e2e8f0" stroke-width="2"/>
  <text x="375" y="275" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f766e">GPIO 23</text>
  <text x="375" y="476" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">GND</text>
  <path d="M400 285 H545" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <rect x="545" y="254" width="190" height="62" rx="18" fill="#fff7df" stroke="#d97706" stroke-width="3"/>
  <text x="640" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#92400e">220 Ω</text>
  <path d="M735 285 H820" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="900" cy="285" r="44" fill="#ef4444" stroke="#991b1b" stroke-width="5"/>
  <rect x="872" y="322" width="56" height="28" rx="8" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
  <text x="900" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#991b1b">LED</text>
  <text x="816" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">ânodo</text>
  <text x="985" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">cátodo</text>
  <path d="M944 285 H1020 V470 H400" fill="none" stroke="#111827" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="930" y="442" width="105" height="44" rx="12" fill="#111827"/>
  <text x="982" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">GND</text>
  <rect x="470" y="565" width="650" height="82" rx="18" fill="#eef9fb" stroke="#b9dfe6" stroke-width="2"/>
  <text x="795" y="597" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#07515f">Montagem do Bloco 6 e do experimento RTOS</text>
  <text x="795" y="626" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">O resistor limita a corrente do LED. O retorno deve estar ligado ao GND do próprio ESP32.</text>
</svg>
