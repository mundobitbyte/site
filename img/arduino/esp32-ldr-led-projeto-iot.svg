<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Projeto IoT com ESP32, LDR e LED</title>
  <desc id="desc">Diagrama técnico em dois ramos do mesmo ESP32: entrada com 3,3 V, LDR, nó de leitura no GPIO 34 e resistor de 10 kilo-ohms para GND; saída com GPIO 23, resistor de 220 ohms, LED e GND.</desc>
  <rect width="1200" height="760" fill="#f6f8fa"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#073f49">Projeto IoT — ESP32 + LDR + LED</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Os dois ramos pertencem ao mesmo ESP32, mas GPIO 34 e GPIO 23 não são ligados entre si.</text>
  <rect x="45" y="120" width="535" height="520" rx="24" fill="#ffffff" stroke="#b9dfe6" stroke-width="3"/>
  <text x="312" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#07515f">Entrada — medir luminosidade</text>
  <text x="312" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Divisor de tensão para o GPIO 34</text>
  <rect x="85" y="225" width="120" height="54" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#b91c1c">3V3</text>
  <path d="M205 252 H275" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <circle cx="335" cy="252" r="46" fill="#e7d6b5" stroke="#92400e" stroke-width="4"/>
  <path d="M305 239 C319 214 331 289 346 239 C360 192 370 299 380 241" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <text x="335" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">LDR</text>
  <path d="M381 252 H455 V360" fill="none" stroke="#dc2626" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="455" cy="360" r="12" fill="#2563eb"/>
  <path d="M455 360 H515" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <rect x="385" y="335" width="58" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="414" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">nó de</text>
  <text x="414" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">leitura</text>
  <rect x="500" y="331" width="62" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="531" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">GPIO</text>
  <text x="531" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">34</text>
  <path d="M455 372 V432" fill="none" stroke="#111827" stroke-width="7"/>
  <rect x="400" y="432" width="110" height="70" rx="14" fill="#fff7df" stroke="#d97706" stroke-width="3"/>
  <text x="455" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#92400e">10 kΩ</text>
  <text x="455" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#92400e">resistor</text>
  <path d="M455 502 V554" fill="none" stroke="#111827" stroke-width="7"/>
  <rect x="395" y="554" width="120" height="54" rx="12" fill="#111827"/>
  <text x="455" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">GND</text>
  <rect x="620" y="120" width="535" height="520" rx="24" fill="#ffffff" stroke="#b9dfe6" stroke-width="3"/>
  <text x="887" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#07515f">Saída — controlar iluminação</text>
  <text x="887" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">GPIO 23 com resistor de proteção e LED</text>
  <rect x="660" y="300" width="130" height="60" rx="12" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/>
  <text x="725" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0f766e">GPIO</text>
  <text x="725" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f766e">23</text>
  <path d="M790 330 H845" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <rect x="845" y="298" width="150" height="64" rx="16" fill="#fff7df" stroke="#d97706" stroke-width="3"/>
  <text x="920" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#92400e">220 Ω</text>
  <path d="M995 330 H1032" fill="none" stroke="#0f766e" stroke-width="8"/>
  <circle cx="1080" cy="330" r="42" fill="#ef4444" stroke="#991b1b" stroke-width="5"/>
  <text x="1080" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#991b1b">LED</text>
  <path d="M1122 330 V510 H885" fill="none" stroke="#111827" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="825" y="483" width="120" height="54" rx="12" fill="#111827"/>
  <text x="885" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">GND</text>
  <rect x="180" y="670" width="840" height="62" rx="16" fill="#eef9fb" stroke="#b9dfe6" stroke-width="2"/>
  <text x="600" y="696" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#07515f">Mesmo ESP32, dois caminhos independentes</text>
  <text x="600" y="718" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">O GND é comum aos dois ramos. O GPIO 34 lê o LDR; o GPIO 23 aciona o LED.</text>
</svg>
