<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Teste de download — Python do Zero | Mundo bit Byte</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fbfc;color:#17314a;display:grid;min-height:100vh;place-items:center;padding:24px}
    main{max-width:650px;background:#fff;border:1px solid #d8e3ea;border-radius:16px;padding:28px;box-shadow:0 16px 42px rgba(22,58,86,.10);text-align:center}
    h1{color:#163a56;margin-top:0}.status{margin:18px 0;color:#526579}.btn{display:inline-block;border:0;border-radius:10px;background:#087f8c;color:#fff;font-weight:800;padding:13px 18px;cursor:pointer;text-decoration:none}.btn:hover{background:#075d67}.small{font-size:.85rem;color:#526579;margin-top:18px}
  </style>
</head>
<body>
<main>
  <h1>Teste concluído</h1>
  <p id="status" class="status">Se o navegador não iniciou o download automaticamente, use o botão abaixo.</p>
  <button id="download" class="btn" type="button">Baixar arquivo de teste</button>
  <p class="small">Este arquivo serve somente para testar o fluxo QR → página → download. O ZIP completo será colocado aqui após a aprovação.</p>
  <p class="small"><a href="../">Voltar à página do material</a></p>
</main>
<script>
(() => {
  const texto = [
    'Mundo bit Byte — Python do Zero',
    'Teste de acesso ao material complementar',
    '',
    'Se você conseguiu baixar e abrir este arquivo, o fluxo está funcionando:',
    'QR Code / URL → página de material → botão de download.',
    '',
    'Na publicação final, este arquivo será substituído pelo pacote ZIP com os 13 checkpoints.'
  ].join('\n');
  function baixar(){
    const blob = new Blob([texto], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'TESTE_Material_de_Apoio_Python_do_Zero.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  document.getElementById('download').addEventListener('click', baixar);
  setTimeout(baixar, 300);
})();
</script>
</body>
</html>
