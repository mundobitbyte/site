<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Auditoria responsiva temporária</title>
  <style>
    html,body{margin:0;background:#4b5563}
    iframe{display:block;height:1024px;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe title="Preview responsivo"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const frame = document.querySelector('iframe');
    frame.style.width = `${Number(params.get('w')) || 390}px`;
    frame.src = params.get('page') || '../cursos/sistemas-embarcados-iot/index.html';
  </script>
</body>
</html>
